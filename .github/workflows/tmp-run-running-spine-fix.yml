name: tmp-run-running-spine-fix
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/research/restore-running-example-spine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/restore-running-example-spine
      - name: Patch
        run: |
          M='content/research/notes/open-engineering-specification-article-draft.md'
          perl -0pi -e 's/(compensate within delegated authority\.\n\n)```\n\n(If any part is missing,)/$1$2/' "$M"
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/research/notes/open-engineering-specification-article-draft.md
          git commit -m 'docs(research): clean running-example formatting'
          git push origin HEAD:research/restore-running-example-spine
