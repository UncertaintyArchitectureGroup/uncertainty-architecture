name: One-shot Thinking Systems review reconciliation (PR)

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  polish:
    if: github.head_ref == 'research/reconcile-thinking-systems-review'
    runs-on: ubuntu-latest
    steps:
      - name: Check out head branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply final semantic polish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path

          MS = Path('content/research/notes/open-engineering-specification-article-draft.md')
          PUB = Path('content/research/notes/thinking-systems-publication-draft.md')
          TRACE = Path('content/research/framework-traceability.md')
          INDEX = Path('content/research/index.md')
          REVIEW = Path('content/research/notes/thinking-systems-external-review-maximiliano-armesto.md')
          STPA_URL = 'https://psas.scripts.mit.edu/home/get_file.php?name=STPA_handbook.pdf'

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          ms = MS.read_text()
          pub = PUB.read_text()
          trace = TRACE.read_text()
          index = INDEX.read_text()
          review = REVIEW.read_text()

          ms = replace_once(
              ms,
              'The category predates LLMs; LLMs made model-mediated judgment far more general-purpose and widespread.',
              'The systems covered by this category predate LLMs; LLMs made model-mediated judgment far more general-purpose and widespread.',
              'manuscript abstract lineage',
          )

          for label, text in [('manuscript', ms), ('publication', pub)]:
              text = replace_once(
                  text,
                  'This category did not begin with LLMs.',
                  'The systems covered by this definition did not begin with LLMs.',
                  f'{label} lineage precision',
              )
              text = replace_once(
                  text,
                  'STAMP/STPA already supports control structures that can span those levels.',
                  f'[STAMP/STPA]({STPA_URL}) already supports control structures that can span those levels.',
                  f'{label} STPA primary-source link',
              )
              text = text.replace('\n\n\nThe systems covered by this definition', '\n\nThe systems covered by this definition')
              text = text.replace('\n\n\nThinking Systems change this object', '\n\nThinking Systems change this object')
              if label == 'manuscript':
                  ms = text
              else:
                  pub = text

          trace = replace_once(
              trace,
              'Earlier probabilistic systems may qualify when their outputs materially perform or mediate a Consequential Runtime Responsibility; LLMs made the property more general-purpose and widespread',
              'Earlier probabilistic systems may qualify when at least one Consequential Runtime Responsibility depends partly on their Model Judgment; LLMs made the property more general-purpose and widespread',
              'traceability historical-scope wording',
          )
          trace = replace_once(
              trace,
              'External pre-publication review by Maximiliano Armesto plus planned bidirectional landscape/substitution analysis',
              f'[STPA Handbook]({STPA_URL}), external pre-publication review by Maximiliano Armesto, and planned bidirectional landscape/substitution analysis',
              'traceability STPA source',
          )
          index = replace_once(
              index,
              "acknowledges STAMP/STPA's existing hierarchical socio-technical control scope",
              f"acknowledges [STAMP/STPA]({STPA_URL})'s existing hierarchical socio-technical control scope",
              'research index STPA link',
          )
          review = replace_once(
              review,
              'The socio-technical control perimeter and organizational decision reach overlap materially with **STAMP/STPA**.',
              f'The socio-technical control perimeter and organizational decision reach overlap materially with **[STAMP/STPA]({STPA_URL})**.',
              'review record STPA link',
          )
          review = replace_once(
              review,
              'Editorial/provenance correction only.',
              'Editorial/provenance confirmation only.',
              'review record Jan status',
          )

          MS.write_text(ms)
          PUB.write_text(pub)
          TRACE.write_text(trace)
          INDEX.write_text(index)
          REVIEW.write_text(review)

          for path in (MS, PUB):
              content = path.read_text()
              if 'Linear Software' in content:
                  raise RuntimeError(f'{path}: publication-facing Linear Software label remains')
              if content.count(STPA_URL) != 1:
                  raise RuntimeError(f'{path}: expected exactly one STPA primary-source link')
          if 'materially perform or mediate a Consequential Runtime Responsibility' in TRACE.read_text():
              raise RuntimeError('traceability retains non-canonical lineage wording')
          PYCODE

      - name: Validate repository-facing changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_metadata.py --mode metadata
          python3 .github/scripts/validate_metadata.py --mode canonical
          python3 .github/scripts/validate_metadata.py --mode terminology
          python3 .github/scripts/validate_repository_contract.py
          git diff --check

      - name: Remove one-shot workflow and commit polish
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reconcile-thinking-systems-review-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "research: polish review provenance and antecedent links"
          git push origin HEAD:${{ github.head_ref }}
