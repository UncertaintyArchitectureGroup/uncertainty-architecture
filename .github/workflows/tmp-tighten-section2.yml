name: tmp tighten section2
on:
  push:
    branches: [research/tighten-section-2-horizon-foreshadowing]
    paths: [.github/workflows/tmp-tighten-section2.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/tighten-section-2-horizon-foreshadowing
      - name: Patch research files
        shell: python
        run: |
          from pathlib import Path
          mp=Path('content/research/notes/open-engineering-specification-article-draft.md')
          bp=Path('content/research/notes/open-engineering-specification-article-blueprint.md')
          m=mp.read_text(); b=bp.read_text()
          start=m.index('Once probabilistic judgment enters the controlled object, its consequences do not remain inside a model call.')
          end=m.index('Across those horizons, the concrete subject changes but a recurring control structure appears:', start)
          m=m[:start]+'''Once probabilistic judgment enters the controlled object, its consequences do not remain inside a model call. For material cases, the control problem may cross several distinct decision contexts because authority can be established outside runtime, architecture must make that authority operable, Delivery must realize it, and Runtime must keep operation inside it while returning evidence when an earlier assumption no longer holds.\n\n```text\nOrganization\n→ Project / Architecture\n→ Delivery\n→ Runtime\n↺ reassessment when evidence invalidates an earlier decision basis\n```\n\nThese names are introduced here only to show how far the control perimeter may extend around one consequential controlled object. They are not four mandatory departments, approval stages, or a lifecycle sequence. Their distinct ownership, authority, evidence, and reassessment semantics are developed later; at this point the important consequence is simply that the engineering perimeter may have to connect technical mechanisms, human decision rights, delivery evidence, and organizational authority around the same system.\n\n'''+m[end:]
          m=m.replace('The next section asks what capabilities are required to turn those connected decisions into bounded control.', 'The next section asks what capabilities are required to make that expanded control perimeter operational. The later decision-horizon section then asks where the consequential decisions around it are legitimately owned.')
          old='- **Section 5.2** — show that a fixed workflow can already be a Thinking System; then make the engineering consequence explicit: once Model Judgment participates in consequential responsibility, the control perimeter follows the whole object and may become a socio-technical architecture spanning organizational authority, Project / Architecture, Delivery, and Runtime. Do not present those horizons as mandatory departments or stages.'
          new='- **Section 5.2** — show that a fixed workflow can already be a Thinking System; then make the engineering consequence explicit: once Model Judgment participates in consequential responsibility, the control perimeter follows the whole object and may become a socio-technical architecture crossing organizational authority, Project / Architecture, Delivery, and Runtime. Introduce those horizon names only as **foreshadowing of perimeter reach**: do not define their ownership model, detailed responsibilities, or reassessment semantics here, and do not present them as mandatory departments or stages. Reserve the canonical four-horizon operating model for Section 5.4.'
          assert b.count(old)==1, b.count(old)
          b=b.replace(old,new)
          mp.write_text(m); bp.write_text(b)
      - name: Verify and commit
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/research/notes/open-engineering-specification-article-draft.md content/research/notes/open-engineering-specification-article-blueprint.md
          git commit -m 'docs(research): defer horizon ownership detail to section 4'
          git push origin HEAD:research/tighten-section-2-horizon-foreshadowing
