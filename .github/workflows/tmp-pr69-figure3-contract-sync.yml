name: Temporary PR69 Figure 3 sync

on:
  push:
    branches:
      - research/polish-section-2

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/polish-section-2
          fetch-depth: 0
      - name: Patch blueprint
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('content/research/notes/open-engineering-specification-article-blueprint.md')
          lines = p.read_text().splitlines()
          starts = [i for i, line in enumerate(lines) if line.startswith('Right ') and 'Thinking System' in line and 'changed responsibility structure' in line]
          if len(starts) != 1:
              raise SystemExit(f'expected one Figure 3 right-side block, found {len(starts)}')
          i = starts[0]
          expected = [
              'situation and operating conditions',
              '→ explicitly authored responsibilities remain before, between, and after Judgment Nodes',
              'AND',
              '→ one or more Judgment Nodes using probabilistic Model Judgment',
              '→ consequential output, action, or downstream state',
          ]
          if lines[i+1:i+6] != expected:
              raise SystemExit('Figure 3 right-side block differs from expected current text')
          replacement = [
              lines[i],
              'situation and operating conditions',
              '├→ explicitly authored responsibilities before, between, and after Judgment Nodes',
              '└→ one or more Judgment Nodes using probabilistic Model Judgment',
              '   both responsibility paths converge on',
              '→ consequential output, action, or downstream state',
          ]
          lines[i:i+6] = replacement
          p.write_text('\n'.join(lines) + '\n')
          PY
          git diff --check
          git diff -- content/research/notes/open-engineering-specification-article-blueprint.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/research/notes/open-engineering-specification-article-blueprint.md
          git commit -m "docs(research): align Figure 3 blueprint contract"
          git push origin HEAD:research/polish-section-2
