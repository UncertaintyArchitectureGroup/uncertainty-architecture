name: Temporary PR91 decision-space refinement

on:
  push:
    branches:
      - agent/release-contract-shift-main
    paths:
      - .github/workflows/temporary-pr91-decision-space-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/release-contract-shift-main
          fetch-depth: 0
          persist-credentials: true

      - name: Refine decision-space semantics
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          manuscript = "content/research/notes/open-engineering-specification-article-draft.md"
          adaptation = "content/research/notes/thinking-systems-publication-draft.md"
          blueprint = "content/research/notes/open-engineering-specification-article-blueprint.md"

          replace_once(
              manuscript,
              "> **Release-contract shift.** For an explicitly authored consequential responsibility, Delivery releases an implementation whose intended situation-to-consequence mapping is specified in inspectable logic before release, even when that mapping is branching, stateful, concurrent, or operationally uncertain. A Thinking-System release also places into operation a judgment process that will complete part of that mapping at runtime. Production readiness therefore depends not only on the implementation already written, but on whether the surrounding control architecture can keep that future runtime completion and its consequential effects within approved operating conditions, authority, and consequence limits.",
              "> **Release-contract shift.** For an explicitly authored consequential responsibility, Delivery releases an implementation whose intended situation-to-consequence mapping is specified in inspectable logic before release, even when that mapping is branching, stateful, concurrent, or operationally uncertain. A Thinking-System release also places into operation a judgment process that will complete part of that mapping at runtime. The important distinction is not the number of terminal outputs: a system may expose only a few allowed actions while Model Judgment interprets a large, context-dependent semantic situation space to decide which action fits. Production readiness therefore depends not only on the implementation already written, but on whether the surrounding control architecture can keep the resulting system operation, reachable authority, and consequential effects within the approved boundary despite judgment that is not exhaustively authored before release.",
              "manuscript release contract",
          )

          replace_once(
              manuscript,
              "Each runtime realization of that model-mediated responsibility therefore emerges from a behavioral space that is only partly characterized in advance. Decision-relevant classification requires more than one axis: an outcome may be intended, conditionally acceptable, prohibited, or not yet classified well enough for a decision; separately, its execution or acceptance may fall within delegated system authority or be reserved for Human Authority. These categories need not form one mutually exclusive partition, and the complete distribution need not be known or measurable for this distinction to matter.",
              "What remains open is therefore not necessarily the set of terminal actions, but the semantic decision mapping from situations and context to consequential behavior. In the LLM use cases that motivate this category, that decision space can be large and only partly characterized in advance even when downstream actions are tightly enumerated. Three different questions must remain separate: whether an outcome is intended, conditionally acceptable, or prohibited; whether the relevant case is sufficiently characterized or remains uncertain or unclassified; and whether execution or acceptance is within delegated authority or reserved for Human Authority. The complete distribution or decision boundary need not be known or measurable for this distinction to matter.",
              "manuscript decision space",
          )

          replace_once(
              adaptation,
              "> **Release-contract shift.** For an explicitly authored consequential responsibility, Delivery releases an implementation whose intended situation-to-consequence mapping is specified in inspectable logic before release, even when it is branching, stateful, concurrent, or operationally uncertain. A Thinking-System release also places into operation a judgment process that will complete part of that mapping at runtime. Production readiness therefore depends not only on the implementation already written, but on whether the surrounding control architecture can keep that future runtime completion and its consequential effects within approved operating conditions, authority, and consequence limits.",
              "> **Release-contract shift.** For an explicitly authored consequential responsibility, Delivery releases an implementation whose intended situation-to-consequence mapping is specified in inspectable logic before release, even when it is branching, stateful, concurrent, or operationally uncertain. A Thinking-System release also places into operation a judgment process that will complete part of that mapping at runtime. The important distinction is not the number of terminal outputs: a system may expose only a few allowed actions while Model Judgment interprets a large, context-dependent semantic situation space to decide which action fits. Production readiness therefore depends not only on the implementation already written, but on whether the surrounding control architecture can keep the resulting system operation, reachable authority, and consequential effects within the approved boundary despite judgment that is not exhaustively authored before release.",
              "adaptation release contract",
          )

          replace_once(
              adaptation,
              "Each runtime realization of that model-mediated responsibility emerges from a behavioral space that is only partly characterized in advance. Acceptability or epistemic status and authority are separate decision axes: an outcome may be intended, conditionally acceptable, prohibited, or not yet classified, while its execution or acceptance may independently remain within delegated authority or be reserved for Human Authority. The complete distribution need not be known or measurable for this distinction to matter.",
              "What remains open is not necessarily the set of terminal actions, but the semantic decision mapping from situations and context to consequential behavior. In the LLM use cases that motivate this category, that decision space can be large and only partly characterized in advance even when downstream actions are tightly enumerated. Keep three questions separate: whether an outcome is intended, conditionally acceptable, or prohibited; whether the case is sufficiently characterized or remains uncertain or unclassified; and whether execution or acceptance is within delegated authority or reserved for Human Authority. The complete distribution or decision boundary need not be known or measurable for this distinction to matter.",
              "adaptation decision space",
          )

          replace_once(
              blueprint,
              "→ Thinking-System Delivery also places a runtime judgment process into operation that completes part of the consequential mapping across a behavioral space only partly characterized in advance; acceptability or epistemic status and authority must be classified separately rather than treated as one partition, and credible production use requires the surrounding control architecture to keep runtime completion and its consequential effects within approved operating conditions, authority, and consequence limits",
              "→ Thinking-System Delivery also places a runtime judgment process into operation that completes part of the consequential mapping; the changed object is the semantic situation-to-consequence decision mapping, not necessarily the cardinality of terminal outputs, so a system may expose only a few allowed actions while Model Judgment operates across a large, context-dependent decision space that is not exhaustively authored in advance; credible production use requires the surrounding control architecture to keep resulting system operation, reachable authority, and consequential effects within the approved boundary",
              "blueprint connected argument",
          )

          replace_once(
              blueprint,
              "- Explain the release-contract shift: explicitly authored software releases an implementation of an already specified consequential mapping, whereas Thinking-System Delivery also places into operation a judgment process that completes part of that mapping at runtime; production readiness depends on whether the surrounding control architecture can keep that runtime completion and its consequential effects within approved operating conditions, authority, and consequence limits.",
              "- Explain the release-contract shift: explicitly authored software releases an implementation of an already specified consequential mapping, whereas Thinking-System Delivery also places into operation a judgment process that completes part of that mapping at runtime. Make clear that the distinction is the semantic situation-to-consequence mapping, not the number of terminal outputs: a small enumerated action set may still depend on Model Judgment over a large, context-dependent situation space. Production readiness depends on whether the surrounding control architecture can keep resulting system operation, reachable authority, and consequential effects within the approved boundary despite judgment that is not exhaustively authored before release.",
              "blueprint section2 release contract",
          )

          replace_once(
              blueprint,
              "- Describe the reachable behavioral space as only partly characterized in advance. Keep acceptability or epistemic status separate from authority: outcomes may be intended, conditionally acceptable, prohibited, or not yet classified, while execution or acceptance may independently remain within delegated authority or be reserved for Human Authority. Do not imply one mutually exclusive partition or an enumerable or estimable full distribution.",
              "- Describe the open semantic decision mapping rather than equating it with the terminal action set. In motivating LLM cases the situation/context space and decision boundary may be large and only partly characterized even when allowed downstream actions are tightly enumerated. Keep three dimensions separate: outcome acceptability (intended / conditionally acceptable / prohibited), epistemic status (sufficiently characterized / uncertain / unclassified), and authority (within delegated authority / reserved for Human Authority). Do not imply that Thinking-System classification itself requires a large terminal output set or an enumerable or estimable full distribution.",
              "blueprint section2 decision space",
          )

          replace_once(
              blueprint,
              "Thinking Systems are software systems in which one or more **Consequential Runtime Responsibilities** depend partly on probabilistic Model Judgment rather than being fully specified through explicitly encoded logic in advance. The category names the changed engineering object; it does not certify that the object is adequately controlled. That changes the release contract: Delivery no longer releases only the implementation of a pre-authored consequential mapping, but also places into operation a judgment process that will complete part of that mapping at runtime; credible production use requires the surrounding control architecture to keep that runtime completion and its consequential effects within approved operating conditions, authority, and consequence limits, and negative outcomes can invalidate different decision bases across Delivery, Project / Architecture, and Organization.",
              "Thinking Systems are software systems in which one or more **Consequential Runtime Responsibilities** depend partly on probabilistic Model Judgment rather than being fully specified through explicitly encoded logic in advance. The category names the changed engineering object; it does not certify that the object is adequately controlled. That changes the release contract: Delivery no longer releases only the implementation of a pre-authored consequential mapping, but also places into operation a judgment process that will complete part of that mapping at runtime. The relevant openness is in the semantic situation-to-consequence mapping rather than necessarily in the terminal action set: even a few allowed actions may depend on Model Judgment across a large, context-dependent situation space. Credible production use therefore requires the surrounding control architecture to keep resulting system operation, reachable authority, and consequential effects within the approved boundary, and negative outcomes can invalidate different decision bases across Delivery, Project / Architecture, and Organization.",
              "blueprint stable thesis",
          )

          replace_once(
              "CHANGELOG.md",
              "- Synchronized the long-form blueprint, manuscript, and shorter publication adaptation around the release-contract consequence of runtime Model Judgment: explicitly authored software releases an implementation of a consequential mapping specified before release, while a Thinking-System release also places into operation a judgment process that completes part of that mapping at runtime. The revision treats the runtime behavioral space as only partly characterized in advance, separates acceptability or epistemic status from authority classification, requires the surrounding control architecture to keep consequential effects within approved operating conditions, authority, and consequence limits, connects negative outcomes to Delivery, Project / Architecture, or Organizational decision-basis reassessment, and avoids claiming that conventional software had one path or that every Thinking System necessarily produces more errors.",
              "- Synchronized the long-form blueprint, manuscript, and shorter publication adaptation around the release-contract consequence of runtime Model Judgment: explicitly authored software releases an implementation of a consequential mapping specified before release, while a Thinking-System release also places into operation a judgment process that completes part of that mapping at runtime. The revision clarifies that the open object is the semantic situation-to-consequence decision mapping rather than necessarily the terminal action set, so a small enumerated action set may still depend on Model Judgment across a large, context-dependent situation space; separates outcome acceptability, epistemic status, and authority; requires the surrounding control architecture to bound resulting system operation, reachable authority, and consequential effects rather than the model's internal judgment itself; connects negative outcomes to Delivery, Project / Architecture, or Organizational decision-basis reassessment; and avoids claiming that conventional software had one path or that every Thinking System necessarily produces more errors.",
              "changelog decision-space summary",
          )

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-pr91-decision-space-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md \
            content/research/notes/open-engineering-specification-article-blueprint.md \
            content/research/notes/open-engineering-specification-article-draft.md \
            content/research/notes/thinking-systems-publication-draft.md \
            .github/workflows/temporary-pr91-decision-space-fix.yml
          git commit -m 'Clarify semantic decision space in release contract'
          git push origin HEAD:agent/release-contract-shift-main
