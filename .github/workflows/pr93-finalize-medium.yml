name: PR93 finalize Medium publishing path

on:
  push:
    branches:
      - publishing/linkedin-medium-renditions
    paths:
      - ".github/scripts/pr93_finalize_medium.py"
      - ".github/workflows/pr93-finalize-medium.yml"

permissions:
  contents: write

concurrency:
  group: pr93-finalize-medium
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: publishing/linkedin-medium-renditions
          fetch-depth: 0
      - name: Apply final Medium publishing correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/pr93_finalize_medium.py
          rm .github/scripts/pr93_finalize_medium.py
          rm .github/workflows/pr93-finalize-medium.yml
          git add -A
          git commit -m "fix: make Medium publishing path honest and reviewable"
          git push origin HEAD:publishing/linkedin-medium-renditions
