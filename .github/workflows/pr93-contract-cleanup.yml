name: PR93 scoped contract cleanup

on:
  push:
    branches:
      - publishing/linkedin-medium-renditions
    paths:
      - ".github/scripts/pr93_contract_cleanup.py"
      - ".github/workflows/pr93-contract-cleanup.yml"

permissions:
  contents: write

concurrency:
  group: pr93-contract-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: publishing/linkedin-medium-renditions
          fetch-depth: 0
      - name: Apply scoped repository-contract cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          python3 .github/scripts/pr93_contract_cleanup.py
          rm -f .github/scripts/pr93_contract_cleanup.py
          rm -f .github/workflows/pr93-contract-cleanup.yml
          rm -f .github/scripts/pr93_finalize_medium.py
          rm -f .github/workflows/pr93-finalize-medium.yml
          git add -A
          git commit -m "fix: scope Medium packaging and repository contract"
          git push origin HEAD:publishing/linkedin-medium-renditions
