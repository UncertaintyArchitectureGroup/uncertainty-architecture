name: Temporary build platform rendition PR

on:
  pull_request:
    branches:
      - feat/quartz-pdf-export
  push:

permissions:
  contents: write

jobs:
  build:
    if: (github.event_name == 'pull_request' && github.head_ref == 'publishing/linkedin-medium-renditions') || (github.ref == 'refs/heads/publishing/linkedin-medium-renditions' && github.event.head_commit.message == 'chore: trigger platform rendition PR build')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out rendition branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: publishing/linkedin-medium-renditions
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false
      - name: Build rendition implementation
        run: python3 .github/scripts/build_platform_renditions_pr.py
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run publication regression tests
        run: node --test quartz/scripts/*.test.mjs
      - name: Run repository-contract regression tests
        run: python3 .github/tests/repository_contract/test_repository_contract.py
      - name: Commit platform rendition PR
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Medium and LinkedIn publication renditions"
          git push origin HEAD:publishing/linkedin-medium-renditions
# retry after generated-source normalization was added to the stacked base workflow
