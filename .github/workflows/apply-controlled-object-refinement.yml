name: Apply controlled-object refinement

on:
  push:
    branches:
      - refine-controlled-object-visuals

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refine-controlled-object-visuals
          fetch-depth: 0

      - name: Apply manuscript and blueprint edits
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          draft_path = Path('content/research/notes/open-engineering-specification-article-draft.md')
          blueprint_path = Path('content/research/notes/open-engineering-specification-article-blueprint.md')

          draft = draft_path.read_text()
          blueprint = blueprint_path.read_text()

          old_figure3 = '''```mermaid
          flowchart TB
              subgraph A["Primarily explicitly encoded runtime responsibility"]
                  A1[External input and operating conditions]
                  A2[Deterministic decision and action responsibilities]
                  A3[Output, action, or downstream state]
                  A1 --> A2 --> A3
              end

              subgraph B["Thinking System boundary"]
                  B1[External input and operating conditions]
                  B2[Deterministic responsibilities]
                  J1["Judgment Node<br/>probabilistic Model Judgment"]
                  B3[Deterministic validation, authority, and execution]
                  J2["Optional additional<br/>Judgment Node"]
                  B4[Output, action, or downstream state]

                  B1 --> B2 --> J1 --> B3 --> B4
                  B3 -. optional composition .-> J2 -.-> B4
              end
          ```

          **Figure 3 — The controlled-object shift.** A Thinking System remains a mixed system. Deterministic responsibilities remain before, between, and after Judgment Nodes. Judgment Nodes may be absent, repeated, or combined; the diagram is illustrative rather than a prescribed execution topology.'''

          new_figure3 = '''```mermaid
          flowchart LR
              subgraph A["Primarily explicitly encoded runtime responsibility"]
                  direction LR
                  A1[External input and operating conditions]
                  A2[Deterministic decision and action responsibilities]
                  A3[Output, action, or downstream state]
                  A1 --> A2 --> A3
              end

              subgraph B["Thinking System boundary"]
                  direction LR
                  B1[External input and operating conditions]
                  B2[Deterministic responsibilities]
                  J1["Judgment Node<br/>probabilistic Model Judgment"]
                  B3[Deterministic validation, authority, and execution]
                  B4[Output, action, or downstream state]
                  B1 --> B2 --> J1 --> B3 --> B4
              end

              classDef judgmentShift fill:#ffe5e5,stroke:#b42318,stroke-width:3px,color:#7a0000;
              class J1 judgmentShift;
              style B fill:#fff7f7,stroke:#b42318,stroke-width:2px
          ```

          **Figure 3 — The controlled-object shift.** The side-by-side comparison emphasizes the difference between two responsibility structures. On the left, consequential runtime behavior is produced primarily through explicitly encoded deterministic responsibilities. On the right, a Thinking System remains mixed, but probabilistic Model Judgment enters the controlled object through a Judgment Node while deterministic responsibilities remain explicit around it. The red emphasis marks the structural addition, not a claim that the whole system becomes probabilistic or that every Thinking System follows this exact path.'''

          if old_figure3 not in draft:
              raise SystemExit('Figure 3 block not found')
          draft = draft.replace(old_figure3, new_figure3, 1)

          old_figure4 = '''```mermaid
          flowchart LR
              MJ[Model Judgment]
              I["Input Interpretation<br/>what does the input mean?"]
              D["Decision Logic<br/>which path, plan, tool, or action?"]
              O["Output Mediation<br/>what is communicated or transformed?"]

              MJ --> I
              MJ --> D
              MJ --> O

              I -. may repeat or combine .-> D
              D -. may repeat or combine .-> O
          ```

          **Figure 4 — Functional placement of Model Judgment.** The classes identify what judgment changes in a workflow. They do not prescribe order, topology, consequence, authority, or risk.'''

          new_figure4 = '''```mermaid
          flowchart TB
              MJ["Model Judgment"]
              I["Input Interpretation<br/>what does the input mean?"]
              D["Decision Logic<br/>which path, plan, tool, or action?"]
              O["Output Mediation<br/>what is communicated or transformed?"]

              MJ --> I & D & O
          ```

          **Figure 4 — Functional placement of Model Judgment.** Model Judgment can alter a system through three main placement functions: Input Interpretation, Decision Logic, and Output Mediation. These are functional categories rather than mandatory stages. A system may use one, several, or repeated instances of them, and each placement creates a different downstream control problem.'''

          if old_figure4 not in draft:
              raise SystemExit('Figure 4 block not found')
          draft = draft.replace(old_figure4, new_figure4, 1)

          old_horizons = '''The organization determines which authoritative boundaries, shared capabilities, prohibited uses, and decision rights apply. A project decides whether a proposed use of Model Judgment can be made technically credible, operationally supportable, and economically viable. Architecture allocates judgment, deterministic responsibility, evidence, authority, and corrective mechanisms across the system boundary. Delivery realizes those decisions for a bounded change and decides whether the resulting system is ready to release. Runtime operation determines whether active behavior remains within the conditions under which it was authorized and routes invalidating evidence back to the level that owns the affected decision.'''

          new_horizons = '''The consequences appear across four connected decision horizons that the following sections develop in detail:

- **Organizational control context.** The organization determines which authoritative boundaries, shared capabilities, prohibited uses, and decision rights apply to the Thinking System.
- **Project control architecture and viability.** The project decides whether the proposed use of Model Judgment can be made technically credible, operationally supportable, and economically viable. Within this decision horizon, architecture allocates Model Judgment, deterministic responsibilities, evidence, authority, Human Authority, fallback, and corrective mechanisms across the system boundary.
- **Delivery realization and release.** Delivery realizes the authorized architecture for a bounded change and determines whether the implementation and its evidence are complete and acceptable for release.
- **Runtime operation and reassessment.** Runtime operation determines whether active behavior remains within the conditions under which it was authorized and routes invalidating evidence back to the level that owns the affected decision.

These are not independent management layers added above implementation. They are connected decision horizons controlling the same socio-technical object.'''

          if old_horizons not in draft:
              raise SystemExit('Decision-horizons paragraph not found')
          draft = draft.replace(old_horizons, new_horizons, 1)

          # Blueprint: add durable visual and lead-in requirements without inventing a fifth decision level.
          old_primary_figure = '''**Primary Figure 1 — Controlled-object shift**

          Use a two-panel comparison of responsibility structure, not one mandatory execution path.'''
          new_primary_figure = '''**Primary Figure 1 — Controlled-object shift**

          Use a horizontal, side-by-side two-panel comparison of responsibility structure so the structural change is visible at a glance, not one mandatory execution path. Visually emphasize the Thinking-System addition—the Judgment Node and, where useful, the enclosing Thinking-System boundary—with a distinct warning color or equivalent styling. The emphasis must communicate that the new engineering problem is consequential probabilistic judgment inside the controlled object, not merely “AI somewhere in the stack.”'''
          if old_primary_figure not in blueprint:
              raise SystemExit('Blueprint primary Figure 1 block not found')
          blueprint = blueprint.replace(old_primary_figure, new_primary_figure, 1)

          old_supporting_figures = '''**Supporting figures:**

          - functional placement of Model Judgment;
          - connected locations of requirement, operational, and runtime-judgment uncertainty;
          - one controlled object viewed across four decision horizons.'''
          new_supporting_figures = '''**Supporting figures:**

          - functional placement of Model Judgment, with Model Judgment shown as the parent concept above Input Interpretation, Decision Logic, and Output Mediation in one horizontal row; the composition must communicate a taxonomy rather than an execution sequence;
          - connected locations of requirement, operational, and runtime-judgment uncertainty;
          - one controlled object viewed across four decision horizons.'''
          if old_supporting_figures not in blueprint:
              raise SystemExit('Blueprint supporting figures block not found')
          blueprint = blueprint.replace(old_supporting_figures, new_supporting_figures, 1)

          anchor = '''- Explain why the changed object creates connected control questions across organizational context, project viability, architecture, delivery realization and release, and runtime reassessment.
          - Preserve that levels use different evidence, participants, authority, time horizons, and actions and are not interchangeable.'''
          replacement = '''- Explain why the changed object creates connected control questions across organizational context, project viability, architecture, delivery realization and release, and runtime reassessment.
          - Before the detailed control-theory bridge, use a short forward-linking list with bold labels for the four canonical decision horizons: Organizational control context; Project control architecture and viability (including architectural design of the control loop); Delivery realization and release; Runtime operation and reassessment. Do not present architecture as a fifth decision level.
          - Preserve that levels use different evidence, participants, authority, time horizons, and actions and are not interchangeable.'''
          if anchor not in blueprint:
              raise SystemExit('Blueprint decision-horizon anchor not found')
          blueprint = blueprint.replace(anchor, replacement, 1)

          figure_contract_old = '''1. **Controlled-object shift** — two-panel comparison of responsibility structure, showing one or more possible Judgment Node placements without prescribing a pipeline.'''
          figure_contract_new = '''1. **Controlled-object shift** — horizontal, side-by-side comparison of responsibility structure, visually emphasizing the introduction of consequential probabilistic Model Judgment inside the controlled object while showing deterministic responsibilities around it; the figure must not prescribe a pipeline.'''
          if figure_contract_old not in blueprint:
              raise SystemExit('Blueprint figure contract item not found')
          blueprint = blueprint.replace(figure_contract_old, figure_contract_new, 1)

          draft_path.write_text(draft)
          blueprint_path.write_text(blueprint)
          PY

          rm .github/workflows/apply-controlled-object-refinement.yml

      - name: Commit refined article visuals
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/research/notes/open-engineering-specification-article-draft.md \
                  content/research/notes/open-engineering-specification-article-blueprint.md \
                  .github/workflows/apply-controlled-object-refinement.yml
          git commit -m "Refine controlled-object visuals and decision-horizon lead-in"
          git push origin HEAD:refine-controlled-object-visuals
