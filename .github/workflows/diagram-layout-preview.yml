name: Diagram layout preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  render:
    if: github.event.pull_request.head.ref == 'research/repair-diagram-layout-contracts'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Extract reviewed Mermaid blocks
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          out = Path('diagram-preview')
          out.mkdir()
          block = re.compile(r'```mermaid\n(?P<body>(?:(?!```)[\s\S])*?)\n```\n\n(?P<caption>\*\*Figure (?P<number>\d+) —[^\n]+)')
          specs = [
              ('content/research/notes/thinking-systems-publication-draft.md', 3, 'controlled-object shift', 'publication-figure3.mmd'),
              ('content/research/notes/thinking-systems-publication-draft.md', 8, 'Two orthogonal models', 'publication-figure8.mmd'),
              ('content/research/notes/open-engineering-specification-article-draft.md', 3, 'controlled-object shift', 'manuscript-figure3.mmd'),
              ('content/research/notes/open-engineering-specification-article-draft.md', 9, 'Two orthogonal models', 'manuscript-figure9.mmd'),
          ]
          for src, num, title, name in specs:
              text = Path(src).read_text(encoding='utf-8')
              matches = [m for m in block.finditer(text) if int(m.group('number')) == num and title in m.group('caption')]
              if len(matches) != 1:
                  raise SystemExit(f'{src}: expected one Figure {num} {title!r}, got {len(matches)}')
              (out / name).write_text(matches[0].group('body') + '\n', encoding='utf-8')
          PY
      - name: Render diagram previews
        shell: bash
        run: |
          set -euo pipefail
          cat > diagram-preview/puppeteer.json <<'JSON'
          {"args":["--no-sandbox","--disable-setuid-sandbox"]}
          JSON
          for source in diagram-preview/*.mmd; do
            target="${source%.mmd}.png"
            npx --yes @mermaid-js/mermaid-cli@11.15.0 -p diagram-preview/puppeteer.json -i "$source" -o "$target" -w 2200 -b transparent --quiet
          done
      - name: Upload diagram previews
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: repaired-diagram-layout-preview
          path: diagram-preview/*.png
          if-no-files-found: error
          retention-days: 3
