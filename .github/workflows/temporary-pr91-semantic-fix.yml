name: Temporary PR91 semantic fix

on:
  push:
    branches:
      - agent/release-contract-shift-main
    paths:
      - .github/workflows/temporary-pr91-semantic-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/release-contract-shift-main
          fetch-depth: 0
          persist-credentials: true

      - name: Apply semantic review fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          manuscript = "content/research/notes/open-engineering-specification-article-draft.md"
          adaptation = "content/research/notes/thinking-systems-publication-draft.md"
          blueprint = "content/research/notes/open-engineering-specification-article-blueprint.md"

          replace_once(
              manuscript,
              "> **Release-contract shift.** For an explicitly authored consequential responsibility, Delivery releases an implementation whose intended situation-to-consequence mapping is specified in inspectable logic before release, even when that mapping is branching, stateful, concurrent, or operationally uncertain. A Thinking-System release also places into operation a judgment process that will complete part of that mapping at runtime. Production readiness therefore depends not only on the implementation already written, but on whether that future runtime completion is credibly bounded.",
              "> **Release-contract shift.** For an explicitly authored consequential responsibility, Delivery releases an implementation whose intended situation-to-consequence mapping is specified in inspectable logic before release, even when that mapping is branching, stateful, concurrent, or operationally uncertain. A Thinking-System release also places into operation a judgment process that will complete part of that mapping at runtime. Production readiness therefore depends not only on the implementation already written, but on whether the surrounding control architecture can keep that future runtime completion and its consequential effects within approved operating conditions, authority, and consequence limits.",
              "manuscript release boundary",
          )

          replace_once(
              manuscript,
              "Each runtime realization of that model-mediated responsibility is therefore a selection from a wider, only partly characterized behavioral space. Some reachable outcomes are intended and desirable. Some may be acceptable only in a particular context or within a delegated boundary. Some require reserved Human Authority. Some are prohibited, and some may not yet be recognized well enough to classify. The complete distribution need not be known or measurable for this distinction to matter.",
              "Each runtime realization of that model-mediated responsibility therefore emerges from a behavioral space that is only partly characterized in advance. Decision-relevant classification requires more than one axis: an outcome may be intended, conditionally acceptable, prohibited, or not yet classified well enough for a decision; separately, its execution or acceptance may fall within delegated system authority or be reserved for Human Authority. These categories need not form one mutually exclusive partition, and the complete distribution need not be known or measurable for this distinction to matter.",
              "manuscript behavioral space",
          )

          replace_once(
              manuscript,
              "That changes both failure analysis and reassessment. Unexpected behavior is no longer limited to a defect or unanticipated condition around a fixed intended mapping. It can also be a semantically wrong, contextually inappropriate, unsupported, or unauthorized selection inside the runtime judgment space. A local realization fault may remain a Delivery issue. Repeated evidence may invalidate Project / Architecture assumptions about Model-Judgment necessity, the Operating Envelope, Human Authority, or control economics. Other outcomes may show that an Organizational authority or business premise must be narrowed or changed. The control architecture therefore needs not only local error handling but evidence and escalation paths to the decision horizon whose basis the runtime outcome challenges.",
              "That changes both failure analysis and reassessment. Unexpected behavior is no longer limited to a defect or unanticipated condition around a fixed intended mapping. It can also be a semantically wrong, contextually inappropriate, unsupported, or unauthorized selection inside the runtime judgment space. A local realization fault may remain a Delivery issue. Evidence from a single material outcome or from a repeated pattern may invalidate Project / Architecture assumptions about Model-Judgment necessity, the Operating Envelope, Human Authority, or control economics. Other outcomes may show that an Organizational authority or business premise must be narrowed or changed. The control architecture therefore needs not only local error handling but evidence and escalation paths to the decision horizon whose basis the runtime outcome challenges.",
              "manuscript evidence routing",
          )

          replace_once(
              adaptation,
              "> **Release-contract shift.** For an explicitly authored consequential responsibility, Delivery releases an implementation whose intended situation-to-consequence mapping is specified in inspectable logic before release, even when it is branching, stateful, concurrent, or operationally uncertain. A Thinking-System release also places into operation a judgment process that will complete part of that mapping at runtime. Production readiness therefore depends not only on the implementation already written, but on whether that future runtime completion is credibly bounded.",
              "> **Release-contract shift.** For an explicitly authored consequential responsibility, Delivery releases an implementation whose intended situation-to-consequence mapping is specified in inspectable logic before release, even when it is branching, stateful, concurrent, or operationally uncertain. A Thinking-System release also places into operation a judgment process that will complete part of that mapping at runtime. Production readiness therefore depends not only on the implementation already written, but on whether the surrounding control architecture can keep that future runtime completion and its consequential effects within approved operating conditions, authority, and consequence limits.",
              "adaptation release boundary",
          )

          replace_once(
              adaptation,
              "Each runtime realization of that model-mediated responsibility is a selection from a wider, only partly characterized behavioral space. Some outcomes are intended and desirable; some are acceptable only in a particular context or delegated boundary; some require reserved Human Authority; and some are prohibited or still unknown. The complete distribution need not be known or measurable for this distinction to matter.",
              "Each runtime realization of that model-mediated responsibility emerges from a behavioral space that is only partly characterized in advance. Acceptability or epistemic status and authority are separate decision axes: an outcome may be intended, conditionally acceptable, prohibited, or not yet classified, while its execution or acceptance may independently remain within delegated authority or be reserved for Human Authority. The complete distribution need not be known or measurable for this distinction to matter.",
              "adaptation behavioral space",
          )

          replace_once(
              adaptation,
              "This does not mean conventional software had one path, no nondeterminism, or no surprises. The difference is that unexpected behavior can now arise not only from defects or conditions around a fixed intended mapping, but also from a semantically wrong, contextually inappropriate, unsupported, or unauthorized selection inside the runtime judgment space. This is a qualitative shift in the failure surface, not a claim that every Thinking System necessarily produces more errors. Evidence from such outcomes may call for a local Delivery correction, a Project / Architecture reassessment of the design or Operating Envelope, or an Organizational change to authority or business basis.",
              "This does not mean conventional software had one path, no nondeterminism, or no surprises. The difference is that unexpected behavior can now arise not only from defects or conditions around a fixed intended mapping, but also from a semantically wrong, contextually inappropriate, unsupported, or unauthorized selection inside the runtime judgment space. This is a qualitative shift in the failure surface, not a claim that every Thinking System necessarily produces more errors. A single material outcome or a repeated pattern may call for a local Delivery correction, a Project / Architecture reassessment of the design or Operating Envelope, or an Organizational change to authority or business basis.",
              "adaptation evidence routing",
          )

          replace_once(
              blueprint,
              "→ Thinking-System Delivery also places a runtime judgment process into operation that completes part of the consequential mapping across a wider, only partly characterized behavioral space containing intended, contextually acceptable, reserved-for-Human-Authority, prohibited, and not-yet-understood outcomes; credible production use requires that runtime completion to be bounded by the surrounding control architecture",
              "→ Thinking-System Delivery also places a runtime judgment process into operation that completes part of the consequential mapping across a behavioral space only partly characterized in advance; acceptability or epistemic status and authority must be classified separately rather than treated as one partition, and credible production use requires the surrounding control architecture to keep runtime completion and its consequential effects within approved operating conditions, authority, and consequence limits",
              "blueprint connected argument",
          )

          replace_once(
              blueprint,
              "- Explain the release-contract shift: explicitly authored software releases an implementation of an already specified consequential mapping, whereas Thinking-System Delivery also places into operation a judgment process that completes part of that mapping at runtime; production readiness depends on whether that future runtime completion is credibly bounded.",
              "- Explain the release-contract shift: explicitly authored software releases an implementation of an already specified consequential mapping, whereas Thinking-System Delivery also places into operation a judgment process that completes part of that mapping at runtime; production readiness depends on whether the surrounding control architecture can keep that runtime completion and its consequential effects within approved operating conditions, authority, and consequence limits.",
              "blueprint section2 release boundary",
          )

          replace_once(
              blueprint,
              "- Describe the reachable behavioral space as only partly characterized and operationally partitioned into intended, contextually acceptable, reserved-for-Human-Authority, prohibited, and not-yet-understood outcomes without implying that the full distribution can be enumerated or estimated.",
              "- Describe the reachable behavioral space as only partly characterized in advance. Keep acceptability or epistemic status separate from authority: outcomes may be intended, conditionally acceptable, prohibited, or not yet classified, while execution or acceptance may independently remain within delegated authority or be reserved for Human Authority. Do not imply one mutually exclusive partition or an enumerable or estimable full distribution.",
              "blueprint section2 classifications",
          )

          replace_once(
              blueprint,
              "Thinking Systems are software systems in which one or more **Consequential Runtime Responsibilities** depend partly on probabilistic Model Judgment rather than being fully specified through explicitly encoded logic in advance. The category names the changed engineering object; it does not certify that the object is adequately controlled. That changes the release contract: Delivery no longer releases only the implementation of a pre-authored consequential mapping, but also places into operation a judgment process that will complete part of that mapping at runtime; credible production use requires that future completion to be bounded, and negative outcomes can invalidate different decision bases across Delivery, Project / Architecture, and Organization.",
              "Thinking Systems are software systems in which one or more **Consequential Runtime Responsibilities** depend partly on probabilistic Model Judgment rather than being fully specified through explicitly encoded logic in advance. The category names the changed engineering object; it does not certify that the object is adequately controlled. That changes the release contract: Delivery no longer releases only the implementation of a pre-authored consequential mapping, but also places into operation a judgment process that will complete part of that mapping at runtime; credible production use requires the surrounding control architecture to keep that runtime completion and its consequential effects within approved operating conditions, authority, and consequence limits, and negative outcomes can invalidate different decision bases across Delivery, Project / Architecture, and Organization.",
              "blueprint stable thesis",
          )

          replace_once(
              "CHANGELOG.md",
              "- Synchronized the long-form blueprint, manuscript, and shorter publication adaptation around the release-contract consequence of runtime Model Judgment: explicitly authored software releases an implementation of a consequential mapping specified before release, while a Thinking-System release also places into operation a judgment process that completes part of that mapping at runtime and must be credibly bounded for production use. The revision distinguishes intended, contextually acceptable, reserved, prohibited, and not-yet-understood outcome regions; connects negative outcomes to Delivery, Project / Architecture, or Organizational decision-basis reassessment; and avoids claiming that conventional software had one path or that every Thinking System necessarily produces more errors.",
              "- Synchronized the long-form blueprint, manuscript, and shorter publication adaptation around the release-contract consequence of runtime Model Judgment: explicitly authored software releases an implementation of a consequential mapping specified before release, while a Thinking-System release also places into operation a judgment process that completes part of that mapping at runtime. The revision treats the runtime behavioral space as only partly characterized in advance, separates acceptability or epistemic status from authority classification, requires the surrounding control architecture to keep consequential effects within approved operating conditions, authority, and consequence limits, connects negative outcomes to Delivery, Project / Architecture, or Organizational decision-basis reassessment, and avoids claiming that conventional software had one path or that every Thinking System necessarily produces more errors.",
              "changelog summary",
          )

      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-pr91-semantic-fix.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md \
            content/research/notes/open-engineering-specification-article-blueprint.md \
            content/research/notes/open-engineering-specification-article-draft.md \
            content/research/notes/thinking-systems-publication-draft.md \
            .github/workflows/temporary-pr91-semantic-fix.yml
          git commit -m 'Refine release-contract failure-surface semantics'
          git push origin HEAD:agent/release-contract-shift-main
