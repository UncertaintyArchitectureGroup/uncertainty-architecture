name: Temporary blueprint semantic cleanup

on:
  push:
    branches:
      - research/map-adjacent-landscape

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: research/map-adjacent-landscape
      - name: Apply cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('content/research/notes/open-engineering-specification-article-blueprint.md')
          t = p.read_text()

          def one(old, new):
              global t
              n = t.count(old)
              if n != 1:
                  raise SystemExit(f'expected one match, got {n}: {old[:100]!r}')
              t = t.replace(old, new)

          one('#### 5.6.5 Agent and orchestration runtimes', '#### __AGENT_HEADING__ Agent and orchestration runtimes')
          one('#### 5.6.4 Guardrails and runtime enforcement', '#### 5.6.5 Guardrails and runtime enforcement')
          one('#### __AGENT_HEADING__ Agent and orchestration runtimes', '#### 5.6.4 Agent and orchestration runtimes')
          one('STPA/Simpex/runtime-assurance practice', 'STPA/Simplex/runtime-assurance practice')

          one(
              '*Why is another architecture model needed when the ecosystem already contains orchestration runtimes, guardrails, evaluation and observability, managed agent platforms, AI-governance suites, standards, regulation, and control-theoretic research?*',
              '*Why is another architecture model needed when the ecosystem already contains systems/safety/runtime-assurance methods, control-theoretic research, orchestration runtimes, guardrails, evaluation and observability, managed agent platforms, AI-governance suites, standards, and regulation?*'
          )
          one(
              '> **The ecosystem does not lack controls. It contains many strong controls. The harder problem is knowing which ones are required for this controlled object, under whose authority, for which decision horizon, with what guarantee strength, evidence, corrective path, reassessment semantics, and lifecycle cost.**',
              '> **The ecosystem does not lack controls. It contains many strong controls and established engineering methods. The question this section tests is whether a material remaining problem lies in knowing which controls are required for this controlled object, under whose authority, for which decision horizon, with what guarantee strength, evidence, corrective path, reassessment semantics, and lifecycle cost—and what the UA map itself fails to capture from existing approaches.**'
          )
          one(
              '**Transition:** Once the map is separated from any one implementation surface, the next question is whether current tools, standards, governance methods, and research already cover enough of it that another framework is unnecessary—or whether responsibilities still fall between their normal boundaries.',
              '**Transition:** Once the map is separated from any one implementation surface, the next question is whether current systems/safety methods, research, tools, standards, governance methods, and organizational practices already cover enough of it that another framework is unnecessary—or whether material responsibilities still fall between their normal boundaries.'
          )

          p.write_text(t)
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/temp-blueprint-semantic-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/research/notes/open-engineering-specification-article-blueprint.md .github/workflows/temp-blueprint-semantic-cleanup.yml
          git diff --cached --check
          git commit -m 'docs(research): clean up landscape comparison contract'
          git push origin HEAD:research/map-adjacent-landscape
