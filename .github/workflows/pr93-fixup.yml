name: PR93 one-shot substantive fixup

# One-shot branch maintenance workflow; connector removes it after a successful fixup.
on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pr93-fixup.yml"
      - ".github/scripts/pr93_fixup.py"

permissions:
  contents: write

jobs:
  fixup:
    if: github.head_ref == 'publishing/linkedin-medium-renditions'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: publishing/linkedin-medium-renditions
          fetch-depth: 0
      - name: Merge current main and apply substantive fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          python3 .github/scripts/pr93_fixup.py
          # GITHUB_TOKEN cannot update workflow files. Keep those two files unchanged
          # in this bot push; the connector applies/removes them immediately after.
          git checkout HEAD -- .github/workflows/export-platform-renditions.yml
          rm .github/scripts/pr93_fixup.py
          git add -A
          git commit -m "fix: harden Thinking Systems publication package"
          git push origin HEAD:publishing/linkedin-medium-renditions
