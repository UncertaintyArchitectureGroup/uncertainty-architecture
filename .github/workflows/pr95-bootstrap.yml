name: Temporary PR 95 workflow bootstrap

on:
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out review branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: publishing/thinking-systems-pdf-review
          fetch-depth: 0
          persist-credentials: true
      - name: Enable refinement workflow and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/pr95-visual-refinement.yml')
          text = path.read_text(encoding='utf-8')
          old = 'on:\n  push:\n'
          new = 'on:\n  pull_request:\n  push:\n'
          if old not in text:
              raise RuntimeError('visual refinement workflow trigger anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/pr95-bootstrap.yml').unlink(missing_ok=True)
          Path('.github/pr95-bootstrap-trigger.txt').unlink(missing_ok=True)
          PY
          git config user.name "oborskyivitalii"
          git config user.email "oborskyivitalii@gmail.com"
          git add -A
          git commit -m "Enable PR 95 visual refinement workflow"
          git push origin HEAD:publishing/thinking-systems-pdf-review
