name: PR93 apply substantive review fixes

on:
  push:
    branches:
      - publishing/linkedin-medium-renditions
    paths:
      - ".github/workflows/pr93-apply-review-fixes.yml"

permissions: {}

concurrency:
  group: pr93-apply-review-fixes
  cancel-in-progress: false

jobs:
  apply:
    name: Apply substantive review fixes
    permissions:
      contents: write # Required only to commit the scoped one-shot fixes back to this PR branch.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: publishing/linkedin-medium-renditions
          fetch-depth: 0
          persist-credentials: false
      - name: Apply and validate review fixes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/pr93_apply_review_fixes.py')
          text = path.read_text(encoding='utf-8')

          launch_old = 'critical["content/research/notes/thinking-systems-linkedin-launch-post.md"]["required_text"] = ['
          launch_new = '''launch_rule_path = "content/research/notes/thinking-systems-linkedin-launch-post.md"
          if launch_rule_path not in critical:
              launch_rule = {"path": launch_rule_path, "required_text": []}
              contract["critical_files"].append(launch_rule)
              critical[launch_rule_path] = launch_rule
          critical[launch_rule_path]["required_text"] = ['''
          if text.count(launch_old) != 1:
              raise SystemExit(f'expected one launch-post contract marker, found {text.count(launch_old)}')
          text = text.replace(launch_old, launch_new, 1)

          subn_old = 'rendition, count = pattern.subn(new_checklist + "\\n\\nasync function main()", rendition, count=1)'
          subn_new = 'rendition, count = pattern.subn(lambda _match: new_checklist + "\\n\\nasync function main()", rendition, count=1)'
          if text.count(subn_old) != 1:
              raise SystemExit(f'expected one checklist substitution marker, found {text.count(subn_old)}')
          text = text.replace(subn_old, subn_new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          python3 .github/scripts/pr93_apply_review_fixes.py
          node --check quartz/scripts/render-platform-renditions.mjs
          node --check quartz/scripts/verify-publication-package.mjs
          node --check quartz/scripts/platform-rendition.test.mjs
          node --check quartz/scripts/verify-publication-package.test.mjs
          python3 .github/tests/repository_contract/test_repository_contract.py
          rm .github/scripts/pr93_apply_review_fixes.py
          rm .github/workflows/pr93-apply-review-fixes.yml
          git diff --check
          git add -A
          git commit -m "fix: align platform terminology and Medium publication contract"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" push origin HEAD:publishing/linkedin-medium-renditions
