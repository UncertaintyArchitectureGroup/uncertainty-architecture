name: Temporary release-contract shift sync

on:
  push:
    branches:
      - agent/release-contract-shift-main
    paths:
      - .github/workflows/temporary-release-contract-shift-main.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/release-contract-shift-main
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize release-contract rationale
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          manuscript = 'content/research/notes/open-engineering-specification-article-draft.md'
          adaptation = 'content/research/notes/thinking-systems-publication-draft.md'
          blueprint = 'content/research/notes/open-engineering-specification-article-blueprint.md'

          replace_once(manuscript, 'updated: 2026-08-15', 'updated: 2026-08-19', 'manuscript date')
          replace_once(adaptation, 'updated: 2026-08-17', 'updated: 2026-08-19', 'adaptation date')
          replace_once(blueprint, 'updated: 2026-08-16', 'updated: 2026-08-19', 'blueprint date')

          manuscript_anchor = '''For the same apparent request, plausible behavior may vary with context, model version, instructions, retrieval results, tools, configuration, prior interaction, data distribution, or operating conditions. The system does not merely execute a fully enumerated decision; part of the consequential mapping is selected or constructed at runtime.\n\nThe architectural difference can be shown without pretending that conventional software consists of one linear function or that every Thinking System follows one pipeline.'''
          manuscript_insert = '''For the same apparent request, plausible behavior may vary with context, model version, instructions, retrieval results, tools, configuration, prior interaction, data distribution, or operating conditions. The system does not merely execute a fully enumerated decision; part of the consequential mapping is selected or constructed at runtime.\n\n> **Release-contract shift.** For an explicitly authored consequential responsibility, Delivery releases an implementation whose intended situation-to-consequence mapping is specified in inspectable logic before release, even when that mapping is branching, stateful, concurrent, or operationally uncertain. A Thinking-System release also places into operation a judgment process that will complete part of that mapping at runtime. Production readiness therefore depends not only on the implementation already written, but on whether that future runtime completion is credibly bounded.\n\nEach runtime realization of that model-mediated responsibility is therefore a selection from a wider, only partly characterized behavioral space. Some reachable outcomes are intended and desirable. Some may be acceptable only in a particular context or within a delegated boundary. Some require reserved Human Authority. Some are prohibited, and some may not yet be recognized well enough to classify. The complete distribution need not be known or measurable for this distinction to matter.\n\nThis does not mean conventional software had one path, no nondeterminism, or no surprises. Randomization, concurrency, distributed failure, unmodeled states, changing environments, and ordinary implementation defects already existed. The narrower change is that the intended consequential mapping is no longer exhausted by what was authored before release: part of the business-relevant situation-to-consequence relationship is completed by runtime Model Judgment. This is a qualitative shift in the failure surface, not a claim that every Thinking System necessarily produces more errors.\n\nThat changes both failure analysis and reassessment. Unexpected behavior is no longer limited to a defect or unanticipated condition around a fixed intended mapping. It can also be a semantically wrong, contextually inappropriate, unsupported, or unauthorized selection inside the runtime judgment space. A local realization fault may remain a Delivery issue. Repeated evidence may invalidate Project / Architecture assumptions about Model-Judgment necessity, the Operating Envelope, Human Authority, or control economics. Other outcomes may show that an Organizational authority or business premise must be narrowed or changed. The control architecture therefore needs not only local error handling but evidence and escalation paths to the decision horizon whose basis the runtime outcome challenges.\n\nThe architectural difference can be shown without pretending that conventional software consists of one linear function or that every Thinking System follows one pipeline.'''
          replace_once(manuscript, manuscript_anchor, manuscript_insert, 'manuscript release-contract insertion')

          adaptation_anchor = '''For the same apparent request, plausible behavior may vary with context, model version, instructions, retrieval results, tools, configuration, prior interaction, data distribution, or operating conditions. The system does not merely execute a fully enumerated decision; part of the consequential mapping is selected or constructed at runtime.\n\nThe architectural difference can be shown without pretending that conventional software consists of one linear function or that every Thinking System follows one pipeline.'''
          adaptation_insert = '''For the same apparent request, plausible behavior may vary with context, model version, instructions, retrieval results, tools, configuration, prior interaction, data distribution, or operating conditions. The system does not merely execute a fully enumerated decision; part of the consequential mapping is selected or constructed at runtime.\n\n> **Release-contract shift.** For an explicitly authored consequential responsibility, Delivery releases an implementation whose intended situation-to-consequence mapping is specified in inspectable logic before release, even when it is branching, stateful, concurrent, or operationally uncertain. A Thinking-System release also places into operation a judgment process that will complete part of that mapping at runtime. Production readiness therefore depends not only on the implementation already written, but on whether that future runtime completion is credibly bounded.\n\nEach runtime realization of that model-mediated responsibility is a selection from a wider, only partly characterized behavioral space. Some outcomes are intended and desirable; some are acceptable only in a particular context or delegated boundary; some require reserved Human Authority; and some are prohibited or still unknown. The complete distribution need not be known or measurable for this distinction to matter.\n\nThis does not mean conventional software had one path, no nondeterminism, or no surprises. The difference is that unexpected behavior can now arise not only from defects or conditions around a fixed intended mapping, but also from a semantically wrong, contextually inappropriate, unsupported, or unauthorized selection inside the runtime judgment space. This is a qualitative shift in the failure surface, not a claim that every Thinking System necessarily produces more errors. Evidence from such outcomes may call for a local Delivery correction, a Project / Architecture reassessment of the design or Operating Envelope, or an Organizational change to authority or business basis.\n\nThe architectural difference can be shown without pretending that conventional software consists of one linear function or that every Thinking System follows one pipeline.'''
          replace_once(adaptation, adaptation_anchor, adaptation_insert, 'adaptation release-contract insertion')

          connected_old = '''→ runtime Model Judgment resolves situations whose relevant interpretation or decision space cannot be exhaustively specified in advance; useful behavioral variance may be part of that capability but is not the objective itself\n→ model quality and observability are necessary but insufficient'''
          connected_new = '''→ runtime Model Judgment resolves situations whose relevant interpretation or decision space cannot be exhaustively specified in advance; useful behavioral variance may be part of that capability but is not the objective itself\n→ for explicitly authored consequential responsibilities, Delivery releases an implementation whose intended situation-to-consequence mapping is specified before release; runtime may expose defects or unmodeled conditions around that mapping, but the mapping itself is not delegated to probabilistic judgment\n→ Thinking-System Delivery also places a runtime judgment process into operation that completes part of the consequential mapping across a wider, only partly characterized behavioral space containing intended, contextually acceptable, reserved-for-Human-Authority, prohibited, and not-yet-understood outcomes; credible production use requires that runtime completion to be bounded by the surrounding control architecture\n→ this is a qualitative responsibility shift rather than a claim that conventional software had one path, no nondeterminism, or no surprises, and it does not by itself prove that every Thinking System produces more errors\n→ runtime negative cases may therefore invalidate a local Delivery realization, a Project / Architecture assumption about judgment, Operating Envelope, Human Authority, or control economics, or an Organizational authority/business premise; evidence must route to the horizon whose basis is challenged\n→ model quality and observability are necessary but insufficient'''
          replace_once(blueprint, connected_old, connected_new, 'blueprint connected argument')

          section2_old = '''- Classify the support-resolution system as a Thinking System when consequential interpretation/resolution depends partly on Model Judgment, even if orchestration is fixed.\n- Show the whole mixed deterministic/probabilistic controlled object rather than reducing the example to the LLM call.\n- Use the example to separate category membership from autonomy and control adequacy.'''
          section2_new = '''- Classify the support-resolution system as a Thinking System when consequential interpretation/resolution depends partly on Model Judgment, even if orchestration is fixed.\n- Show the whole mixed deterministic/probabilistic controlled object rather than reducing the example to the LLM call.\n- Use the example to separate category membership from autonomy and control adequacy.\n- Explain the release-contract shift: explicitly authored software releases an implementation of an already specified consequential mapping, whereas Thinking-System Delivery also places into operation a judgment process that completes part of that mapping at runtime; production readiness depends on whether that future runtime completion is credibly bounded.\n- Describe the reachable behavioral space as only partly characterized and operationally partitioned into intended, contextually acceptable, reserved-for-Human-Authority, prohibited, and not-yet-understood outcomes without implying that the full distribution can be enumerated or estimated.\n- Connect negative outputs to invalidated-decision-basis routing: some remain Delivery defects, some invalidate Project / Architecture assumptions or control economics, and some require an Organizational authority/business-basis change.'''
          replace_once(blueprint, section2_old, section2_new, 'blueprint Article 2 contract')

          safety_old = '''- imply that all Hard Constraints are transaction limits or all Soft Constraints are model-output quality policies;\n- infer that successful blocking of one transaction path proves the whole system is controlled;'''
          safety_new = '''- imply that all Hard Constraints are transaction limits or all Soft Constraints are model-output quality policies;\n- claim that conventional software had one path, no nondeterminism, or no runtime surprises; the distinction is whether the consequential mapping is fully authored before release;\n- claim without evidence that Thinking Systems always produce more errors; state instead that they add qualitatively different semantic, contextual, evidentiary, and authority failure possibilities inside the runtime judgment space;\n- infer that successful blocking of one transaction path proves the whole system is controlled;'''
          replace_once(blueprint, safety_old, safety_new, 'blueprint claim safety')

          checks_old = '''- [ ] Consequential Runtime Responsibilities and Judgment Nodes remain consistent with the Thinking-System definition.\n- [ ] Organization does not absorb the Project-owned Model-Judgment-necessity'''
          checks_new = '''- [ ] Consequential Runtime Responsibilities and Judgment Nodes remain consistent with the Thinking-System definition.\n- [ ] Article §2 explains the release-contract shift without equating Linear Software with one execution path, claiming the full outcome distribution is enumerable, or asserting a universal increase in error count; it connects negative outcomes to the decision basis they invalidate.\n- [ ] Organization does not absorb the Project-owned Model-Judgment-necessity'''
          replace_once(blueprint, checks_old, checks_new, 'blueprint acceptance check')

          thesis_old = '''Thinking Systems are software systems in which one or more **Consequential Runtime Responsibilities** depend partly on probabilistic Model Judgment rather than being fully specified through explicitly encoded logic in advance. The category names the changed engineering object; it does not certify that the object is adequately controlled. Because useful runtime judgment places consequential uncertainty inside that object, evaluation, observability, policies, human approval, and agent orchestration remain insufficient as system control when disconnected from approved boundaries, concrete realizations, decision authority, corrective action, and reassessment. For production use, the socio-technical control architecture around the application must be engineered with it rather than added as a governance layer after implementation: governance becomes operational through that architecture, and the application is not ready for production at the intended scope while any material control responsibility remains unowned, unrealized, insufficiently evidenced for its decision, or without a credible corrective or reassessment path. The article derives this engineering model first, maps adjacent approaches against it, and situates its research synthesis alongside the existing open draft, tool-neutral Uncertainty Architecture specification whose boundary is defined and indexed by `SPECIFICATION.md`; each indexed document contributes only within its declared status and scope. The paper's additional lifecycle-refinement, carrier, substitution, reverse-mapping, integration-gap, and validation claims remain subject to practical testing and do not alter the specification without explicit framework review and a corresponding status-bearing change.'''
          thesis_new = '''Thinking Systems are software systems in which one or more **Consequential Runtime Responsibilities** depend partly on probabilistic Model Judgment rather than being fully specified through explicitly encoded logic in advance. The category names the changed engineering object; it does not certify that the object is adequately controlled. That changes the release contract: Delivery no longer releases only the implementation of a pre-authored consequential mapping, but also places into operation a judgment process that will complete part of that mapping at runtime; credible production use requires that future completion to be bounded, and negative outcomes can invalidate different decision bases across Delivery, Project / Architecture, and Organization. Because useful runtime judgment places consequential uncertainty inside that object, evaluation, observability, policies, human approval, and agent orchestration remain insufficient as system control when disconnected from approved boundaries, concrete realizations, decision authority, corrective action, and reassessment. For production use, the socio-technical control architecture around the application must be engineered with it rather than added as a governance layer after implementation: governance becomes operational through that architecture, and the application is not ready for production at the intended scope while any material control responsibility remains unowned, unrealized, insufficiently evidenced for its decision, or without a credible corrective or reassessment path. The article derives this engineering model first, maps adjacent approaches against it, and situates its research synthesis alongside the existing open draft, tool-neutral Uncertainty Architecture specification whose boundary is defined and indexed by `SPECIFICATION.md`; each indexed document contributes only within its declared status and scope. The paper's additional lifecycle-refinement, carrier, substitution, reverse-mapping, integration-gap, and validation claims remain subject to practical testing and do not alter the specification without explicit framework review and a corresponding status-bearing change.'''
          replace_once(blueprint, thesis_old, thesis_new, 'blueprint stable thesis')

          changelog_old = '''### Changed\n\n- Reopened lifecycle-ownership research'''
          changelog_new = '''### Changed\n\n- Synchronized the long-form blueprint, manuscript, and shorter publication adaptation around the release-contract consequence of runtime Model Judgment: explicitly authored software releases an implementation of a consequential mapping specified before release, while a Thinking-System release also places into operation a judgment process that completes part of that mapping at runtime and must be credibly bounded for production use. The revision distinguishes intended, contextually acceptable, reserved, prohibited, and not-yet-understood outcome regions; connects negative outcomes to Delivery, Project / Architecture, or Organizational decision-basis reassessment; and avoids claiming that conventional software had one path or that every Thinking System necessarily produces more errors.\n- Reopened lifecycle-ownership research'''
          replace_once('CHANGELOG.md', changelog_old, changelog_new, 'changelog entry')

      - name: Validate and commit synchronized research surfaces
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          rm -f .github/workflows/temporary-release-contract-shift-main.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md \
            content/research/notes/open-engineering-specification-article-blueprint.md \
            content/research/notes/open-engineering-specification-article-draft.md \
            content/research/notes/thinking-systems-publication-draft.md \
            .github/workflows/temporary-release-contract-shift-main.yml
          git commit -m 'Clarify the Thinking-System release-contract shift'
          git push origin HEAD:agent/release-contract-shift-main
