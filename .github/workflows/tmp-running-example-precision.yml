name: tmp-running-example-precision
on:
  push:
    branches: [research/restore-running-example-spine]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/restore-running-example-spine
      - run: python .github/scripts/tmp-running-example-precision.py
      - run: git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/research/notes/open-engineering-specification-article-draft.md
          git commit -m 'docs(research): clarify running example transaction path'
          git push
