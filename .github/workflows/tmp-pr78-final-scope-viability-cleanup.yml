name: Temporary PR78 final scope viability cleanup
on:
  push:
    branches: [agent/replan-sections-5-8]
    paths: [.github/workflows/tmp-pr78-final-scope-viability-cleanup.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/replan-sections-5-8
          fetch-depth: 0
      - run: python3 .github/scripts/tmp_pr78_final_scope_viability_cleanup.py
      - run: git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/research/notes/open-engineering-specification-article-blueprint.md content/research/notes/open-engineering-specification-article-draft.md content/research/framework-traceability.md
          git commit -m "Clarify scoped research viability and authorization concurrency"
          git push origin HEAD:agent/replan-sections-5-8
