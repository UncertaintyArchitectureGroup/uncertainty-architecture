name: tmp-run-section2-patch
on:
  push:
    branches:
      - research/tighten-section-2-horizon-foreshadowing
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/tighten-section-2-horizon-foreshadowing
      - run: python3 tmp_section2_surgery.py
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/research/notes/open-engineering-specification-article-draft.md content/research/notes/open-engineering-specification-article-blueprint.md
          git commit -m 'docs(research): keep section 2 focused on perimeter reach'
          git push origin HEAD:research/tighten-section-2-horizon-foreshadowing
