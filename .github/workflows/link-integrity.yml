name: Link integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  internal-links:
    name: Repository navigation, links, citations, and anchors
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate navigation coverage, order, and routing
        working-directory: 00-doctrine
        run: python3 ../.github/scripts/validate_navigation.py

      - name: Validate CITATION.cff
        env:
          WORKSPACE: ${{ github.workspace }}
        run: docker run --rm --network none -v "$WORKSPACE:/app:ro" citationcff/cffconvert:2.0.0@sha256:f8c5dc5fa8013e5c3635b1c2695bf54eac4d319719f8acdbb7b7ad7a778e46ea --validate

      - name: Validate maintained Markdown links and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.23.0
          args: >-
            --offline
            --include-fragments
            --index-files README.md,index.md
            --root-dir "${{ github.workspace }}"
            --no-progress
            --verbose
            './*.md'
            './00-doctrine/**/*.md'
            './01-patterns/**/*.md'
            './02-ai-control-plane/**/*.md'
            './03-reference-architectures/**/*.md'
            './04-failure-modes/**/*.md'
            './content/index.md'
            './content/research/**/*.md'
            './content/history/**/*.md'
            './content/raw/README.md'
          fail: true
          failIfEmpty: true
          jobSummary: true
