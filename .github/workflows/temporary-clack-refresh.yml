name: Temporary Clack refresh
on:
  push:
    branches: [maintenance/clack-prompts-1.7.0]
    paths: [.github/workflows/temporary-clack-refresh.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: maintenance/clack-prompts-1.7.0
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false
      - name: Refresh package files from current main baseline
        run: |
          npm install '@clack/prompts@^1.7.0' --save --package-lock-only --ignore-scripts
          rm -f .github/workflows/temporary-clack-refresh.yml
          git diff --check
          git diff -- package.json package-lock.json
      - name: Commit refreshed dependency files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/temporary-clack-refresh.yml
          git commit -m 'build(deps): bump @clack/prompts to 1.7.0'
          git push origin HEAD:maintenance/clack-prompts-1.7.0
