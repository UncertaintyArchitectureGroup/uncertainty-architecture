name: tmp final section2 surgery
on:
  push:
    branches: [research/tighten-section-2-horizon-foreshadowing]
    paths: [.github/workflows/tmp-final-section2-surgery.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/tighten-section-2-horizon-foreshadowing
      - name: Patch manuscript
        shell: python
        run: |
          from pathlib import Path
          p=Path('content/research/notes/open-engineering-specification-article-draft.md')
          s=p.read_text()
          old='''For a material case, that control perimeter may therefore become explicitly **socio-technical** and span several decision horizons:

```text
organizational authority and reserved decision rights
→ Project / Architecture authorization and control assumptions
→ Delivery realization, verification, and release evidence
→ Runtime sensing, decision, correction, and containment
↺ evidence routed back to the horizon whose decision basis it invalidates
```

In the running example, an organizational decision might permit automated refunds only inside a delegated amount and reserve larger transactions to Human Authority. Project / Architecture must decide whether Model Judgment is justified inside that boundary and whether a credible control perimeter can exist. Delivery must realize the transaction boundary, approval state, evidence, fallback, and release conditions. Runtime must observe attempted actions and control health, block or route transactions inside delegated authority, and return evidence when a local defect, project assumption, or organizational boundary is no longer credible.

This does **not** mean every Thinking System needs four departments, four committees, or a maximal governance stack. The same people or platform may carry several responsibilities, and lower-consequence systems may implement the map lightly. The point is causal: once probabilistic Model Judgment participates in a consequential responsibility, the required control perimeter follows the authority and effects of the **whole controlled object**, potentially all the way to organizational decision rights.
'''
          new='''For a material case, that control perimeter may therefore become explicitly **socio-technical** and cross technical, delivery, architectural, human-authority, and organizational decision boundaries. In the running example, a bounded-refund authority may originate outside the runtime system, depend on architectural choices about where Model Judgment is permitted, require a concrete delivery realization, and ultimately constrain whether a runtime transaction can execute. The point here is the **reach of the perimeter**, not yet the ownership model inside it.

This does **not** mean every Thinking System needs four departments, four committees, or a maximal governance stack. The same people or platform may carry several responsibilities, and lower-consequence systems may implement the map lightly. The point is causal: once probabilistic Model Judgment participates in a consequential responsibility, the required control perimeter follows the authority and effects of the **whole controlled object**, potentially all the way to organizational decision rights.
'''
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new)
          old2='''Once probabilistic judgment enters the controlled object, its consequences do not remain inside a model call. For material cases, the control problem may cross several distinct decision contexts because authority can be established outside runtime, architecture must make that authority operable, Delivery must realize it, and Runtime must keep operation inside it while returning evidence when an earlier assumption no longer holds.

```text
Organization
→ Project / Architecture
→ Delivery
→ Runtime
↺ reassessment when evidence invalidates an earlier decision basis
```

These names are introduced here only to show how far the control perimeter may extend around one consequential controlled object. They are not four mandatory departments, approval stages, or a lifecycle sequence. Their distinct ownership, authority, evidence, and reassessment semantics are developed later; at this point the important consequence is simply that the engineering perimeter may have to connect technical mechanisms, human decision rights, delivery evidence, and organizational authority around the same system.

Across those horizons, the concrete subject changes but a recurring control structure appears:
'''
          new2='''The example exposes a broader consequence: the control perimeter of a Thinking System may cross technical, delivery, architectural, human-authority, and organizational decision boundaries. Different decisions across that perimeter require different evidence, authority, and corrective mechanisms. Before assigning those decisions to explicit horizons, however, the engineering problem is more basic: **what capabilities must exist for bounded control to be possible at all?**

Across that expanded perimeter, the concrete subject changes but a recurring control structure appears:
'''
          assert s.count(old2)==1, s.count(old2)
          s=s.replace(old2,new2)
          old3='''The next section asks what capabilities are required to make that expanded control perimeter operational. The later decision-horizon section then asks where the consequential decisions around it are legitimately owned.'''
          new3='''The next section therefore asks what capabilities are required to make that expanded control perimeter operational. Only after establishing those control functions does the paper assign consequential decisions to explicit decision horizons.'''
          assert s.count(old3)==1
          s=s.replace(old3,new3)
          p.write_text(s)
      - name: Patch blueprint
        shell: python
        run: |
          from pathlib import Path
          p=Path('content/research/notes/open-engineering-specification-article-blueprint.md')
          s=p.read_text()
          s=s.replace('Introduce those horizon names only as **foreshadowing of perimeter reach**: do not define their ownership model, detailed responsibilities, or reassessment semantics here, and do not present them as mandatory departments or stages. Reserve the canonical four-horizon operating model for Section 5.4.', 'Show the **reach of the perimeter without introducing the canonical horizon sequence**: it may cross technical, delivery, architectural, human-authority, and organizational decision boundaries. Do not define horizon ownership, detailed responsibilities, or reassessment semantics here. Reserve the canonical four-horizon model and its names as an operating structure for Section 5.4.')
          s=s.replace('Section 5.2 uses those names only to foreshadow how far the perimeter may reach; detailed ownership, downward inheritance, and reassessment routing belong to Section 5.4.', 'Section 5.2 shows only how far the perimeter may reach across decision boundaries; the canonical horizon sequence, detailed ownership, downward inheritance, and reassessment routing belong to Section 5.4.')
          p.write_text(s)
      - name: Verify and commit
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/research/notes/open-engineering-specification-article-draft.md content/research/notes/open-engineering-specification-article-blueprint.md
          git commit -m 'docs(research): keep section 2 focused on perimeter reach'
          git push origin HEAD:research/tighten-section-2-horizon-foreshadowing
