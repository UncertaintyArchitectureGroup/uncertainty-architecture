name: Temporary apply Section 2

on:
  push:
    branches:
      - research/polish-section-2
    paths:
      - '.github/workflows/temp-apply-section2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/polish-section-2
          fetch-depth: 0
      - name: Apply Section 2 and reconcile blueprint
        shell: python
        run: |
          from pathlib import Path

          manuscript = Path('content/research/notes/open-engineering-specification-article-draft.md')
          text = manuscript.read_text()
          start = text.index('## 2. The Controlled Object Has Changed')
          end = text.index('## 3. From Model Quality to Bounded Control')
          section = Path('.tmp-section2.md').read_text().rstrip() + '\n\n'
          manuscript.write_text(text[:start] + section + text[end:])

          blueprint = Path('content/research/notes/open-engineering-specification-article-blueprint.md')
          b = blueprint.read_text()
          marker = '**Working word budget:** 950–1,300\n\n---\n\n### 5.3 From Model Quality to Bounded Control'
          decisions = '''**Accepted drafting decisions from the 2026-08-12 Section 2 iteration:**

- Keep Section 2 framework-neutral while deriving the changed controlled object; use UA later as the specification that organizes the resulting model rather than as the premise that validates the category.
- In the neighboring-label comparison, use `Thinking System (this paper)` and a controlled-object-boundary comparison rather than `UA boundary` language. Keep the ISO/NIST use narrow and non-competitive here.
- Treat the deterministic and model-mediated equations as design-contract abstractions, not claims of perfect repeatability or complete probabilistic specification.
- Use the customer-support running example to show the mixed deterministic / Model-Judgment structure, but defer refund thresholds, Hard/Soft realization details, and full control-loop mechanics to later sections.
- Keep the four decision-horizon paragraphs concise and ownership-focused. Project viability and architecture remain one horizon; the passage is a bridge, not the full operating-model treatment.
- Keep Figure 6 focused on decision ownership and invalidated decision-basis routing; use `Project Authorization` consistently and do not let the diagram read as a delivery workflow.

**Working word budget:** 950–1,300

---

### 5.3 From Model Quality to Bounded Control'''
          if 'Accepted drafting decisions from the 2026-08-12 Section 2 iteration' not in b:
              if marker not in b:
                  raise SystemExit('Blueprint anchor not found')
              b = b.replace(marker, decisions, 1)
          blueprint.write_text(b)
      - name: Commit article changes and remove temporary helpers
        run: |
          rm -f .tmp-section2.md .github/workflows/temp-section2-rewrite.yml .github/workflows/temp-apply-section2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(research): polish section 2 controlled-object argument'
          git push origin HEAD:research/polish-section-2
