name: Temporary PR68 capitalization fix

on:
  push:
    paths:
      - '.github/workflows/temp-pr68-capitalization-fix.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/polish-abstract-section-1
      - name: Apply capitalization fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('content/research/notes/open-engineering-specification-article-draft.md')
          s = p.read_text()
          old = 'When does runtime evidence invalidate project authorization rather than only a local implementation?'
          new = 'When does runtime evidence invalidate Project Authorization rather than only a local implementation?'
          if s.count(old) != 1:
              raise SystemExit(f'match count={s.count(old)}')
          p.write_text(s.replace(old, new))
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/research/notes/open-engineering-specification-article-draft.md
          git commit -m "docs(research): use canonical Project Authorization term"
          git push origin HEAD:research/polish-abstract-section-1
