name: Temporary PR78 traceability sync

on:
  push:
    branches:
      - agent/replan-sections-5-8

permissions:
  contents: write

jobs:
  sync-traceability:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/replan-sections-5-8
          fetch-depth: 0
      - name: Sync lifecycle hypothesis in traceability
        shell: python
        run: |
          from pathlib import Path
          path = Path('content/research/framework-traceability.md')
          text = path.read_text()
          replacements = [
              (
                  "The article is testing a sharper handshake: Project owns AI necessity and the viability conclusion; Organization owns the business proceed/reshape/defer/do-not-proceed decision; Project Authorization is a scoped technical baseline and may be **research-only** or **production-capable**.",
                  "The article is testing a sharper handshake: Project / Architecture owns AI necessity, technical/design selection within the standing Organizational business/authority basis, category confirmation, and the viability conclusion; Organization owns the business outcome and authoritative/investment basis plus specific bounded-research and proceed/continue/reshape/defer/do-not-proceed decisions; Project Authorization is a scoped technical baseline and may be **research-only** or **production-capable**."
              ),
              (
                  "| Project viability conclusion versus Organizational Business Authorization | Current status-bearing Project pattern combines project viability, authorization, deferral, and No-Go inside the Project decision surface | Article research hypothesis separates **Project viability conclusion → Organizational Business Authorization → scoped Project Authorization**, with Project Authorization allowed to be research-only before production viability is established or production-capable after a positive business decision on a viable basis | Needs Resolution | Do not change doctrine/pattern ownership by implication. Validate the distinction, then deliberately accept, narrow, reject, or otherwise reconcile it through framework review before status-bearing sources change. |",
                  "| Project technical/design selection and viability versus Organizational business/research authority | Current status-bearing Project pattern combines project viability, authorization, deferral, and No-Go inside the Project decision surface | Article research hypothesis assigns Model-Judgment necessity, technical/design selection inside the standing Organizational business/authority basis, category confirmation, and viability to Project / Architecture; Organization owns the business outcome/basis plus specific bounded-research and proceed/continue/reshape/defer/do-not-proceed decisions; scoped Project Authorization is research-only before production viability is established or production-capable after positive Organizational Business Authorization on a viable basis | Needs Resolution | Do not change doctrine/pattern ownership by implication. Validate the boundary—including the rule that a simpler technical design does not require Organizational architecture approval unless an Organizationally owned premise must change—then deliberately accept, narrow, reject, or otherwise reconcile it through framework review before status-bearing sources change. |"
              ),
              (
                  "- Project viability / Organizational Business Authorization / research-only versus production-capable Project Authorization reconciliation;",
                  "- Project technical/design selection and viability / Organizational business-basis and research authorization / research-only versus production-capable Project Authorization reconciliation;"
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence, found {count}: {old[:120]}')
              text = text.replace(old, new)
          path.write_text(text)
      - name: Commit traceability sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/research/framework-traceability.md
          git commit -m "Sync lifecycle ownership hypothesis in traceability"
          git push origin HEAD:agent/replan-sections-5-8
