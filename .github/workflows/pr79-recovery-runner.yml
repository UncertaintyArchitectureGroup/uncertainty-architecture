name: Temporary deterministic PR79 recovery

on:
  push:
    branches:
      - feat/quartz-pdf-export

permissions:
  contents: write

jobs:
  recover:
    if: github.event.head_commit.message == 'chore: execute deterministic PR79 recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out publishing branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/quartz-pdf-export
          fetch-depth: 0
          persist-credentials: true
      - name: Run deterministic recovery
        run: python3 .github/scripts/pr79_recovery_runner.py
