name: Temporary PR 95 visual refinement

on:
  pull_request:
  push:
    branches:
      - publishing/thinking-systems-pdf-review

permissions:
  contents: write

concurrency:
  group: pr95-visual-refinement
  cancel-in-progress: false

jobs:
  refine:
    name: Temporary / refine publication figures and acknowledgments
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out review branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: publishing/thinking-systems-pdf-review
          fetch-depth: 0
          persist-credentials: true

      - name: Check refinement trigger
        id: gate
        shell: bash
        run: |
          if [[ -f .github/pr95-visual-refinement-trigger.txt ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply reviewed publication changes
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          article = "content/research/notes/thinking-systems-publication-draft.md"
          text = read(article)
          text = re.sub(r"(?m)^updated: 2026-08-20$", "updated: 2026-08-21", text, count=1)

          old_figure2 = '''```mermaid
          flowchart TB
              subgraph I["Independent dimensions — they affect architecture and control demand, not category membership"]
                  direction LR
                  O["Orchestration topology<br/>fixed ↔ dynamic"]
                  A["Autonomy<br/>low ↔ high"]
                  D["Delegated authority<br/>narrow ↔ broad"]
              end

              Q{"Does any Consequential Runtime Responsibility<br/>depend partly on probabilistic Model Judgment?"}
              L["No → Linear Software<br/>relevant consequential responsibility<br/>remains explicitly encoded"]
              T["Yes → Thinking System<br/>part of consequential behavior<br/>is formed through runtime Model Judgment"]

              O -. does not decide category .-> Q
              A -. does not decide category .-> Q
              D -. does not decide category .-> Q
              Q -->|No| L
              Q -->|Yes| T

              classDef thinking fill:#eef6ff,stroke:#3367a8,stroke-width:2px;
              class T thinking;
          ```'''
          new_figure2 = '''```mermaid
          flowchart TB
              subgraph I["Independent dimensions"]
                  direction TB
                  IN["They affect architecture and control demand,<br/>not category membership"]
                  subgraph R[" "]
                      direction LR
                      O["Orchestration topology<br/>fixed ↔ dynamic"]
                      A["Autonomy<br/>low ↔ high"]
                      D["Delegated authority<br/>narrow ↔ broad"]
                  end
              end

              Q{"Does any Consequential Runtime Responsibility<br/>depend partly on probabilistic Model Judgment?"}
              L["No → Linear Software<br/>relevant consequential responsibility<br/>remains explicitly encoded"]
              T["Yes → Thinking System<br/>part of consequential behavior<br/>is formed through runtime Model Judgment"]

              IN ~~~ A
              O -. does not decide category .-> Q
              A -. does not decide category .-> Q
              D -. does not decide category .-> Q
              Q -->|No| L
              Q -->|Yes| T

              classDef thinking fill:#eef6ff,stroke:#3367a8,stroke-width:2px;
              classDef dimensionNote fill:transparent,stroke:transparent,color:#42545f,font-weight:600;
              class IN dimensionNote;
              style R fill:transparent,stroke:transparent
              class T thinking;
          ```'''
          if old_figure2 not in text:
              raise RuntimeError("Article Figure 2 source block did not match the reviewed anchor")
          text = text.replace(old_figure2, new_figure2, 1)

          old_names = "**Christophe Kolb, Maxi Armesto, and Jan**"
          new_names = "**Christophe Kolb, Maximiliano Armesto, and Jan Rosen**"
          if old_names not in text:
              raise RuntimeError("Acknowledgment-name anchor was not found")
          text = text.replace(old_names, new_names, 1)
          write(article, text)

          figure3_path = "quartz/scripts/publication-figure3.mjs"
          figure3 = read(figure3_path)
          new_figure3_function = r'''export function buildFigure3ControlledObjectSvg() {
            return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 690" style="width:100%;height:auto;max-width:none" role="img" aria-label="Side-by-side top-down comparison of Linear Software and a Thinking System" data-ua-flow="top-down">
          <defs>
            <marker id="ua3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#496574"/></marker>
          </defs>
          ${textBlock(700, 38, ["The controlled-object shift"], { size: 26, weight: 700, fill: "#17242c" })}
          ${box(24, 62, 660, 570, { fill: "#f7f9f8", stroke: "#b7c2c7", radius: 18 })}
          ${box(716, 62, 660, 570, { fill: "#f6fafb", stroke: "#9fb5bf", radius: 18 })}
          ${textBlock(354, 103, ["Linear Software"], { size: 24, weight: 700, fill: "#284b63" })}
          ${textBlock(1046, 103, ["Thinking System"], { size: 24, weight: 700, fill: "#284b63" })}
          ${textBlock(354, 132, ["Consequential mapping authored before release"], { size: 16, weight: 600, fill: "#54736d" })}
          ${textBlock(1046, 132, ["Part of the consequential mapping completed at runtime"], { size: 16, weight: 600, fill: "#54736d" })}

          ${box(150, 165, 408, 72)}
          ${textBlock(354, 193, ["Situation and", "operating conditions"], { size: 18, line: 23 })}
          ${arrow(354, 237, 354, 260)}
          ${box(150, 260, 408, 94)}
          ${textBlock(354, 289, ["Explicitly authored", "consequential responsibilities"], { size: 18, line: 24 })}
          ${arrow(354, 354, 354, 378)}
          ${box(150, 378, 408, 92)}
          ${textBlock(354, 407, ["Consequential output, action,", "or downstream state"], { size: 18, line: 24 })}
          ${textBlock(354, 515, ["No Consequential Runtime Responsibility depends partly", "on probabilistic Model Judgment."], { size: 16, line: 22, weight: 600, fill: "#42545f" })}

          ${box(835, 150, 422, 60)}
          ${textBlock(1046, 176, ["Situation and operating conditions"], { size: 17.5 })}
          ${arrow(1046, 210, 1046, 227)}
          ${box(835, 227, 422, 72)}
          ${textBlock(1046, 253, ["Explicitly authored responsibilities", "before / between Judgment Nodes"], { size: 17, line: 22 })}
          ${arrow(1046, 299, 1046, 316)}
          ${box(850, 316, 392, 88, { fill: "#fce8e8", stroke: "#b43a3a", strokeWidth: 3 })}
          ${textBlock(1046, 342, ["One or more Judgment Nodes", "probabilistic Model Judgment"], { size: 17, line: 23, weight: 650, fill: "#7b1f1f" })}
          ${arrow(1046, 404, 1046, 421)}
          ${box(835, 421, 422, 64)}
          ${textBlock(1046, 447, ["Explicitly authored responsibilities", "after Judgment Nodes"], { size: 17, line: 22 })}
          ${arrow(1046, 485, 1046, 502)}
          ${box(835, 502, 422, 72)}
          ${textBlock(1046, 529, ["Consequential output, action,", "or downstream state"], { size: 17, line: 22 })}
          ${textBlock(1046, 604, ["Model Judgment changes the responsibility structure at a bounded node;", "the surrounding system still contains explicitly authored responsibilities."], { size: 15.5, line: 20, weight: 600, fill: "#42545f" })}
          </svg>`;
          }
          '''
          updated, count = re.subn(
              r"export function buildFigure3ControlledObjectSvg\(\) \{[\s\S]*?\n\}\s*$",
              new_figure3_function.rstrip() + "\n",
              figure3,
              count=1,
          )
          if count != 1:
              raise RuntimeError(f"Figure 3 builder replacement count was {count}")
          write(figure3_path, updated)

          rendition_path = "quartz/scripts/publication-rendition.mjs"
          rendition = read(rendition_path)
          old_caption = '''  const caption = located.caption.replace(
              /^(\\**Figure 3 — ?.*?\\.\\*\\*)/,
              "<strong>$1</strong>",
            );'''
          new_caption = '''  const caption = located.caption.replace(
              /^\\*\\*(Figure 3 — ?.*?\\.)\\*\\*/,
              "<strong>$1</strong>",
            );'''
          if old_caption not in rendition:
              raise RuntimeError("Figure 3 caption conversion anchor was not found")
          rendition = rendition.replace(old_caption, new_caption, 1)
          write(rendition_path, rendition)

          figure3_test_path = "quartz/scripts/publication-figure3.test.mjs"
          tests = read(figure3_test_path)
          tests = tests.replace(
              '  assert.match(result.content, /data-ua-figure3-rendition="side-by-side"/);\n',
              '  assert.match(result.content, /data-ua-figure3-rendition="side-by-side"/);\n  assert.match(result.content, /data-ua-flow="top-down"/);\n',
              1,
          )
          tests = tests.replace(
              '  assert.match(result.content, /Judgment Nodes/);\n',
              '  assert.match(result.content, /Judgment Nodes/);\n  assert.match(result.content, /before \/ between Judgment Nodes/);\n  assert.match(result.content, /after Judgment Nodes/);\n',
              1,
          )
          tests = tests.replace(
              '  assert.match(result.content, /Figure 3 — The controlled-object shift/);\n',
              '  assert.match(result.content, /<strong>Figure 3 — The controlled-object shift\\.<\\/strong>/);\n  assert.doesNotMatch(result.content, /\\*\\*Figure 3/);\n',
              1,
          )
          write(figure3_test_path, tests)

          figure8_path = "quartz/scripts/publication-figure8.mjs"
          figure8 = read(figure8_path)
          old_curve = '''function curve(
            d,
            { dashed = false, color = "#46616f", marker = "ua8a-arrow" } = {},
          ) {
            return `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.2"${dashed ? ' stroke-dasharray="8 7"' : ""} marker-end="url(#${marker})"/>`;
          }'''
          new_curve = '''function curve(
            d,
            {
              dashed = false,
              color = "#46616f",
              marker = "ua8a-arrow",
              width = 2.2,
            } = {},
          ) {
            return `<path d="${d}" fill="none" stroke="${color}" stroke-width="${width}"${dashed ? ' stroke-dasharray="8 7"' : ""} marker-end="url(#${marker})"/>`;
          }'''
          if old_curve not in figure8:
              raise RuntimeError("Figure 8 curve helper anchor was not found")
          figure8 = figure8.replace(old_curve, new_curve, 1)
          old_exit = '${arrow(522, 326, 522, 338)}\n${box(407, 338, 230, 40, { fill: "#f2f4f5", stroke: "#87959c", radius: 8 })}${textBlock(522, 354, ["No — category exit", "Exit Thinking-System-specific lifecycle"], { size: 12.8, line: 16, weight: 650, fill: "#42545f" })}'
          new_exit = '${arrow(522, 326, 522, 334)}\n${box(392, 334, 260, 46, { fill: "#f2f4f5", stroke: "#87959c", radius: 8 })}${textBlock(522, 350, ["No — category exit", "Exit Thinking-System-specific lifecycle"], { size: 12.8, line: 17, weight: 650, fill: "#42545f" })}'
          if old_exit not in figure8:
              raise RuntimeError("Figure 8 category-exit anchor was not found")
          figure8 = figure8.replace(old_exit, new_exit, 1)
          old_exogenous = '${curve("M 192 728 L 42 700 L 42 268 L 52 268", { color: "#a9742d" })}'
          new_exogenous = '${curve("M 192 728 L 12 700 L 12 248 L 52 248", { color: "#a9742d", width: 3.2 })}'
          if old_exogenous not in figure8:
              raise RuntimeError("Figure 8 exogenous-arrow anchor was not found")
          figure8 = figure8.replace(old_exogenous, new_exogenous, 1)
          figure8 = figure8.replace(
              '${curve("M 852 316 L 1000 390 L 1000 690 L 1110 718", { dashed: true })}',
              '${curve("M 852 316 L 1000 390 L 1000 690 L 1110 718", { dashed: true, color: "#6f848e" })}',
              1,
          )
          figure8 = figure8.replace(
              '${curve("M 1182 316 L 1350 390 L 1350 690 L 1245 718", { dashed: true })}',
              '${curve("M 1182 316 L 1350 390 L 1350 690 L 1245 718", { dashed: true, color: "#6f848e" })}',
              1,
          )
          figure8 = figure8.replace(
              '${arrow(1032, 775, 982, 775, { dashed: true })}',
              '${arrow(1032, 775, 982, 775, { dashed: true, color: "#6f848e" })}',
              1,
          )
          figure8 = figure8.replace(
              '${arrow(1032, 820, 682, 820, { dashed: true })}',
              '${arrow(1032, 820, 682, 820, { dashed: true, color: "#6f848e" })}',
              1,
          )
          write(figure8_path, figure8)

          figure8_test_path = "quartz/scripts/publication-figure8.test.mjs"
          figure8_tests = read(figure8_test_path)
          anchor = '''  assert.equal(
            assertFigure8RenditionSemantics(assets.decision.svg, assets.capability.svg),
            true,
          );'''
          addition = anchor + '''
          assert.match(
            assets.decision.svg,
            /M 192 728 L 12 700 L 12 248 L 52 248/,
          );
          assert.match(assets.decision.svg, /stroke-width="3.2"/);'''
          if anchor not in figure8_tests:
              raise RuntimeError("Figure 8 test insertion anchor was not found")
          figure8_tests = figure8_tests.replace(anchor, addition, 1)
          write(figure8_test_path, figure8_tests)

          changelog_path = "CHANGELOG.md"
          changelog = read(changelog_path)
          old_changelog = "- Refined the standalone Thinking Systems publication PDF for screen and print review: kept the page background white, added a restrained off-white panel and thin border around diagrams, replaced the stacked Figure 3 render with a side-by-side Linear Software versus Thinking System comparison, and re-authored Figure 8A as three explicit authorization, reserved-basis, and reassessment bands without changing the canonical Figure 8 semantics or readability thresholds."
          new_changelog = "- Refined the standalone Thinking Systems publication PDF for screen and print review: kept the page background white, added a restrained off-white panel and thin border around diagrams, separated the Figure 2 dimension heading from its three dimension blocks, rebuilt Figure 3 as parallel side-by-side panels with top-down flows, clarified the exogenous-Organization route and category-exit treatment in Figure 8A, and expanded the Taller acknowledgments to Christophe Kolb, Maximiliano Armesto, and Jan Rosen without changing the canonical Figure 8 semantics or readability thresholds."
          if old_changelog not in changelog:
              raise RuntimeError("Changelog refinement entry was not found")
          write(changelog_path, changelog.replace(old_changelog, new_changelog, 1))

          Path(".github/pr95-visual-refinement-trigger.txt").unlink(missing_ok=True)
          PY

      - name: Format, test, and push
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx prettier --write \
            content/research/notes/thinking-systems-publication-draft.md \
            quartz/scripts/publication-figure3.mjs \
            quartz/scripts/publication-figure3.test.mjs \
            quartz/scripts/publication-figure8.mjs \
            quartz/scripts/publication-figure8.test.mjs \
            quartz/scripts/publication-rendition.mjs \
            CHANGELOG.md
          node --check quartz/scripts/publication-figure3.mjs
          node --check quartz/scripts/publication-figure8.mjs
          node --check quartz/scripts/publication-rendition.mjs
          node --test quartz/scripts/*.test.mjs
          npm run build
          git diff --check
          git config user.name "oborskyivitalii"
          git config user.email "oborskyivitalii@gmail.com"
          git add -A
          git commit -m "Refine publication figures and acknowledgments"
          git push origin HEAD:publishing/thinking-systems-pdf-review
