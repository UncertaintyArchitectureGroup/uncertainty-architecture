name: Fix Figure 4 caption

on:
  push:
    branches:
      - docs/refine-controlled-object-figures

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/refine-controlled-object-figures
          fetch-depth: 0

      - name: Replace parent capability with parent concept
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('content/research/notes/open-engineering-specification-article-draft.md')
          text = path.read_text()
          old = '**Figure 4 — Functional placement of Model Judgment.** Model Judgment is the parent capability; Input Interpretation, Decision Logic, and Output Mediation are three functional placements beneath it.'
          new = '**Figure 4 — Functional placement of Model Judgment.** Model Judgment is shown as the parent concept; Input Interpretation, Decision Logic, and Output Mediation are three functional placements beneath it.'
          if old not in text:
              raise SystemExit('Target caption text not found')
          path.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/fix-figure4-caption.yml

      - name: Commit caption correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/research/notes/open-engineering-specification-article-draft.md .github/workflows/fix-figure4-caption.yml
          git commit -m "Fix Model Judgment terminology in Figure 4 caption"
          git push origin HEAD:docs/refine-controlled-object-figures
