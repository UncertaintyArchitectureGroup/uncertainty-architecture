name: tmp-section4-runner
on:
  push:
    paths:
      - '.github/workflows/tmp-section4-runner.yml'
permissions:
  contents: write
jobs:
  run-rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rewrite-section-4-operating-map
      - name: Execute embedded rewrite
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/tmp-section4-rewrite.yml').read_text()
          start = "python - <<'PY'\n"
          end = "\n          PY\n"
          assert src.count(start) == 1, src.count(start)
          block = src.split(start, 1)[1].split(end, 1)[0]
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          exec(compile(block, 'section4_rewrite.py', 'exec'))
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          git diff --name-only | grep -qx 'content/research/notes/open-engineering-specification-article-draft.md'
          git diff --name-only | grep -qx 'content/research/notes/open-engineering-specification-article-blueprint.md'
      - name: Commit rewrite
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/research/notes/open-engineering-specification-article-draft.md content/research/notes/open-engineering-specification-article-blueprint.md
          git commit -m 'docs(research): rewrite Section 4 operating map'
          git push origin HEAD:research/rewrite-section-4-operating-map
