name: Finalize Agent Context Surface

on:
  push:
    branches:
      - repository-intelligence/context-surface

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Remove one-shot workflow before projection
        run: git rm .github/workflows/finalize-agent-context.yml

      - name: Normalize Roadmap trailing newline
        shell: python
        run: |
          from pathlib import Path
          path = Path("ROADMAP.md")
          text = path.read_text(encoding="utf-8")
          path.write_text(text.rstrip("\n") + "\n", encoding="utf-8")

      - name: Validate repository-intelligence producer
        run: python3 .github/tests/repository_intelligence/test_repository_intelligence.py

      - name: Regenerate committed Agent Context Surface
        run: python3 .github/scripts/repository_intelligence.py build --output .github/agent-context.json

      - name: Verify generated surface
        run: python3 .github/scripts/repository_intelligence.py verify

      - name: Commit final formatting and generated surface
        shell: bash
        run: |
          set -euo pipefail
          git add ROADMAP.md .github/agent-context.json
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: finalize deterministic agent context surface"
          git push origin HEAD:repository-intelligence/context-surface
