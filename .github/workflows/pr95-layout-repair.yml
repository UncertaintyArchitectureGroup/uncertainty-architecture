name: Temporary PR 95 layout repair

on:
  push:
    branches:
      - publishing/thinking-systems-pdf-review

permissions:
  contents: write

concurrency:
  group: pr95-layout-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Temporary / repair publication rendition
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out review branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: publishing/thinking-systems-pdf-review
          fetch-depth: 0
          persist-credentials: true
      - name: Rebuild clean publication-rendition module
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          path = Path('quartz/scripts/publication-rendition.mjs')
          text = subprocess.check_output(
              ['git','show','origin/main:quartz/scripts/publication-rendition.mjs'],
              text=True,
          )

          import_anchor = 'import GithubSlugger from "github-slugger";\n'
          figure3_import = '''import {
            assertFigure3SemanticSource,
            buildFigure3ControlledObjectSvg,
          } from "./publication-figure3.mjs";
          '''
          if figure3_import not in text:
              text = text.replace(import_anchor, import_anchor + figure3_import)

          toc_end = '''</section>`;
          }

          export function locateCanonicalFigure8(content) {'''
          figure3_code = '''</section>`;
          }

          export function compactInlineSvg(svg) {
            return String(svg ?? "")
              .replace(/\\r?\\n[ \\t]*\\r?\\n/g, "\\n")
              .trim();
          }

          export function locateCanonicalFigure3(content) {
            const blockPattern = /```mermaid\\r?\\n([\\s\\S]*?)\\r?\\n```/g;
            let match;
            while ((match = blockPattern.exec(content)) !== null) {
              const mermaid = match[1];
              if (
                !mermaid.includes("Primarily explicitly authored consequential behavior") ||
                !mermaid.includes("Thinking System — changed responsibility structure")
              ) {
                continue;
              }
              const tail = content.slice(blockPattern.lastIndex);
              const captionMatch =
                /^\\s*(\\*\\*Figure 3 —[^\\n]*)(?=\\n\\n|$)/.exec(tail);
              if (!captionMatch) return null;
              const captionStart =
                blockPattern.lastIndex +
                captionMatch.index +
                captionMatch[0].indexOf(captionMatch[1]);
              return {
                start: match.index,
                end: captionStart + captionMatch[1].length,
                mermaid,
                caption: captionMatch[1],
              };
            }
            return null;
          }

          export function renderFigure3(content) {
            const located = locateCanonicalFigure3(content);
            if (!located) return { content, rendered: false };
            assertFigure3SemanticSource(located.mermaid);
            const svg = compactInlineSvg(buildFigure3ControlledObjectSvg());
            const panel = `<section class="ua-pdf-static-figure ua-pdf-static-figure--3" data-ua-figure3-rendition="side-by-side">
          ${svg}
          <p>${located.caption.replace(/^\\*\\*/, "<strong>").replace(/\\*\\*(?=\\s|$)/, "</strong>")}</p>
          </section>`;
            return {
              content: `${content.slice(0, located.start)}${panel}${content.slice(located.end)}`,
              rendered: true,
            };
          }

          export function assertCurrentArticleFigure3Rendition(rendition) {
            if (!rendition.figure3Rendition) {
              throw new Error(
                "Current Thinking Systems publication requires the reviewed side-by-side Figure 3 rendition.",
              );
            }
            const canonical = rendition.canonicalFigures.filter(
              (figure) => figure.number === 3,
            );
            const rendered = rendition.renditionFigures.filter(
              (figure) => figure.number === 3,
            );
            if (
              canonical.length !== 1 ||
              canonical[0].panel !== null ||
              rendered.length !== 1 ||
              rendered[0].panel !== null
            ) {
              throw new Error(
                "Current publication must preserve exactly one canonical and one rendered Figure 3.",
              );
            }
          }

          export function locateCanonicalFigure8(content) {'''
          if toc_end not in text:
              raise RuntimeError('TOC insertion anchor not found')
          text = text.replace(toc_end, figure3_code, 1)

          old_transform = '''  const transformed = splitDenseFigures
            ? splitFigure8(source.content)
            : { content: source.content, split: false };
          '''
          new_transform = '''  const figure3 = renderFigure3(source.content);
          const transformed = splitDenseFigures
            ? splitFigure8(figure3.content)
            : { content: figure3.content, split: false };
          '''
          if old_transform not in text:
              raise RuntimeError('buildPublicationRendition transform anchor not found')
          text = text.replace(old_transform, new_transform, 1)

          old_result = '''    renditionFigures: extractFigureList(transformed.content),
            figure8Split: transformed.split,
          '''
          new_result = '''    renditionFigures: extractFigureList(transformed.content),
            figure3Rendition: figure3.rendered,
            figure8Split: transformed.split,
          '''
          if old_result not in text:
              raise RuntimeError('result anchor not found')
          text = text.replace(old_result, new_result, 1)

          old_assert = '''  if (requireFigure8Split) assertCurrentArticleFigure8Rendition(result);
            return result;
          }'''
          new_assert = '''  if (requireFigure8Split) {
              assertCurrentArticleFigure3Rendition(result);
              assertCurrentArticleFigure8Rendition(result);
            }
            return result;
          }'''
          if old_assert not in text:
              raise RuntimeError('acceptance anchor not found')
          text = text.replace(old_assert, new_assert, 1)

          # Ensure Figure 8 inline SVG remains one raw HTML block too.
          text = text.replace(
              '${assets.decision.svg}',
              '${compactInlineSvg(assets.decision.svg)}',
          ).replace(
              '${assets.capability.svg}',
              '${compactInlineSvg(assets.capability.svg)}',
          )

          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/pr95-layout.part*.b64
          rm -f .github/workflows/pr95-source-snapshot.yml
          rm -f .github/workflows/pr95-layout-repair.yml

      - name: Validate repaired module and publication tests
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node --check quartz/scripts/publication-rendition.mjs
          node --test quartz/scripts/*.test.mjs
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "oborskyivitalii"
          git config user.email "oborskyivitalii@gmail.com"
          git add -A
          git commit -m "Repair publication layout rendition"
          git push origin HEAD:publishing/thinking-systems-pdf-review
