name: Repository contract

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  critical-structure:
    name: Contract / critical structure
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate repository contract
        working-directory: 01-patterns
        run: python3 ../.github/scripts/validate_repository_contract.py

  self-tests:
    name: Policy / contract self-tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run contract regression fixtures
        working-directory: 00-doctrine
        run: python3 ../.github/tests/repository_contract/test_repository_contract.py
