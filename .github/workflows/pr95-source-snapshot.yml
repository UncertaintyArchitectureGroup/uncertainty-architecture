name: Temporary PR 95 PDF layout finalizer

on:
  push:
    branches:
      - publishing/thinking-systems-pdf-review

permissions:
  contents: write

concurrency:
  group: pr95-pdf-layout-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    name: Temporary / apply PDF layout refinement
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out review branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: publishing/thinking-systems-pdf-review
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          package-manager-cache: false

      - name: Apply publication-layout patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/pr95-layout.part*.b64 | base64 -d | gzip -d > /tmp/pr95-layout.patch
          git apply --check /tmp/pr95-layout.patch
          git apply /tmp/pr95-layout.patch
          rm -f .github/pr95-layout.part*.b64
          rm -f .github/workflows/pr95-source-snapshot.yml

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Format and validate the refinement
        shell: bash
        run: |
          set -euo pipefail
          npx prettier --write \
            CHANGELOG.md \
            .github/policy/repository-contract-change-coupling.json \
            .github/tests/repository_contract/cases.json \
            quartz/scripts/publication-rendition.mjs \
            quartz/scripts/publication-figure3.mjs \
            quartz/scripts/publication-figure3.test.mjs \
            quartz/scripts/publication-figure8.mjs \
            quartz/styles/custom.scss
          node --check quartz/scripts/publication-rendition.mjs
          node --check quartz/scripts/publication-figure3.mjs
          node --check quartz/scripts/publication-figure8.mjs
          node --test quartz/scripts/*.test.mjs
          python3 .github/tests/repository_contract/test_repository_contract.py
          npm run build
          git diff --check
          if git diff --name-only | grep -q '^content/'; then
            echo 'Publication-layout refinement must not edit canonical research content.' >&2
            exit 1
          fi

      - name: Commit the clean review change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine publication figures and PDF framing"
          git push origin HEAD:publishing/thinking-systems-pdf-review
