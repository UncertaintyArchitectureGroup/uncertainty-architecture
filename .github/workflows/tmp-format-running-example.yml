name: tmp format running example
on:
  push:
    branches: [research/tighten-section-2-horizon-foreshadowing]
    paths: [.github/workflows/tmp-format-running-example.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/tighten-section-2-horizon-foreshadowing
      - name: Format running-example spine
        shell: python
        run: |
          from pathlib import Path
          mp=Path('content/research/notes/open-engineering-specification-article-draft.md')
          bp=Path('content/research/notes/open-engineering-specification-article-blueprint.md')
          m=mp.read_text(); b=bp.read_text()

          specs = [
            ('### Running Example — Bounded Customer-Support Resolution',
             '### Running Example | Bounded Customer-Support Resolution',
             '**Lens in this section:** business proposal, controlled-object identity, and intentionally unresolved control paths.',
             '## 2. The Controlled Object Has Changed',
             '**What this adds to the case:** the support-resolution system is established as the stable controlled object; authority, evidence, control, and reassessment paths are deliberately left unresolved for later sections.'),
            ('### Running Example — The Controlled Object Expands',
             '### Running Example | The Controlled Object Expands',
             '**Lens in this section:** how Model Judgment changes the engineering boundary and the reach of the required control perimeter.',
             'This is why model quality alone is insufficient.',
             '**What this adds to the case:** the same support system now exposes why consequential responsibility can require a socio-technical control perimeter that extends beyond the model and runtime component.'),
            ('### Running Example — From Authority to a Complete Control Path',
             '### Running Example | From Authority to a Complete Control Path',
             '**Lens in this section:** how one refund-authority boundary becomes operational through Constraints, Sensors, Controller functions, Human Authority, and Actuators.',
             'The four capability families describe the logical functions needed to make such a boundary operational.',
             '**What this adds to the case:** the refund rule is no longer only policy intent; the case now has the logical anatomy of a complete control path around that boundary.'),
            ('### Running Example — One Refund Case Across Four Decision Horizons',
             '### Running Example | One Refund Case Across Four Decision Horizons',
             '**Lens in this section:** who owns the standing decision bases around the same controlled object, and where runtime evidence belongs when one of those bases is challenged.',
             '### Cross-level operating discipline — learn from negative cases without turning every deviation into governance',
             '**What this adds to the case:** the same €50/€450 refund boundary now exposes standing ownership across the four horizons and routes reassessment by the decision basis that evidence invalidates.'),
          ]

          for old_heading,new_heading,lens,end_marker,closing in specs:
            assert m.count(old_heading)==1, (old_heading,m.count(old_heading))
            start=m.index(old_heading)
            end=m.index(end_marker,start)
            block=m[start:end]
            block=block.replace(old_heading, f'---\n\n{new_heading}\n\n{lens}', 1)
            block=block.rstrip()+f'\n\n{closing}\n\n---\n\n'
            m=m[:start]+block+m[end:]

          anchor='''**Progressive-disclosure rule.** Introduce the running example explicitly in Section 5.1 as a named pedagogical spine and define the business goal and whole controlled object there, but reveal implementation detail only when the corresponding concept is introduced. For each major conceptual section, prefer the sequence `generic model → application to the same running example → optional secondary counterexample or transfer check`. Do not let a new domain example silently replace the support-resolution system as the primary explanatory object.\n'''
          addition='''\n**Running-example visual contract.** Every primary return to the support-resolution case should be visibly separated from generic exposition using portable Markdown rather than platform-specific callout syntax. Use a horizontal rule, a `### Running Example | <lens-specific title>` heading, a bold `Lens in this section:` line, the case material itself, a short bold `What this adds to the case:` progression statement, and a closing horizontal rule. Keep tables, diagrams, lists, and prose inside the callout as ordinary Markdown so the structure survives GitHub, static-site, and publication export. The title after the pipe and the lens must change with the section; the controlled object must not. This visual contract is editorial, not UA doctrine.\n'''
          assert b.count(anchor)==1
          b=b.replace(anchor,anchor+addition)

          mp.write_text(m); bp.write_text(b)
      - name: Verify and commit
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/research/notes/open-engineering-specification-article-draft.md content/research/notes/open-engineering-specification-article-blueprint.md
          git commit -m 'docs(research): visually separate running-example progression'
          git push origin HEAD:research/tighten-section-2-horizon-foreshadowing
