name: Temporary PR68 blueprint reconciliation

on:
  push:
    paths:
      - '.github/workflows/temp-pr68-reconcile-blueprint.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/polish-abstract-section-1
      - name: Reconcile manuscript and blueprint
        shell: python
        run: |
          from pathlib import Path

          manuscript = Path('content/research/notes/open-engineering-specification-article-draft.md')
          m = manuscript.read_text()
          old = 'Constraints, evidence, decision rights, and corrective mechanisms are part of the engineering response UA expects around Model-Judgment-dependent Consequential Runtime Responsibilities, not the condition that makes the category exist.'
          new = 'Constraints, evidence, decision rights, and corrective mechanisms belong to the engineering response around Model-Judgment-dependent Consequential Runtime Responsibilities; they are not the condition that makes the category exist.'
          if m.count(old) != 1:
              raise SystemExit(f'manuscript match count={m.count(old)}')
          m = m.replace(old, new)
          manuscript.write_text(m)

          blueprint = Path('content/research/notes/open-engineering-specification-article-blueprint.md')
          b = blueprint.read_text()
          replacements = {
            'For production use, the complete socio-technical control architecture is part of the application rather than a governance layer added after implementation: governance becomes operational only through that architecture, and when it remains incomplete across organizational authority, project and architecture viability, delivery realization and release, and runtime operation and reassessment, the application is not ready for production release at the intended scope. The article derives this engineering model first, then maps adjacent approaches against it, and introduces Uncertainty Architecture near the end as an open, tool-neutral specification connecting those responsibilities.':
            'For production use, the socio-technical control architecture is part of the application rather than a governance layer added after implementation: governance becomes operational through that architecture, and the application is not ready for production at the intended scope while any material control responsibility remains unowned, unrealized, insufficiently evidenced for its decision, or without a credible corrective or reassessment path. The article derives this engineering model first, maps adjacent approaches against it, and identifies the resulting synthesis as Uncertainty Architecture—an open, tool-neutral specification whose claims remain subject to practical validation, simplification, contradiction, and revision.',

            '- the paper derives capability families and decision levels, explains proportional application, maps the adjacent ecosystem against the resulting structure, and ends with an explicit validation agenda.':
            '- the paper derives capability families and decision levels, explains proportional application, maps the adjacent ecosystem against the resulting structure through substitution analysis, identifies the resulting synthesis as Uncertainty Architecture, and preserves an explicit validation agenda.',

            '- Allow one restrained forward reference at this transition: identify it as the engineering problem Uncertainty Architecture addresses—how to build and operate systems once consequential behavior is partly produced through probabilistic Model Judgment—without introducing UA capability families, decision levels, or framework machinery as premises before they are derived.':
            '- Keep this transition framework-neutral in the publication prose: state the engineering problem directly—how to build and operate systems once consequential behavior is partly produced through probabilistic Model Judgment—without using Uncertainty Architecture as the premise that validates the deduction. The publication title may retain the framework name for attribution and discoverability.',

            '- Open or transition into a credible team that has a model, retrieval or tools, traces, evaluations, policy, Human Authority, and a pilot.':
            '- Introduce the bounded customer-support-resolution running example at intentionally low detail: a team seeking lower resolution cost and latency has a capable model, retrieval and tool access, traces, evaluations, policy guidance, a human-review path, and a pilot that interprets requests and proposes resolutions. Make clear that the same controlled object will return as the argument develops, without presenting it as validation evidence or a reference architecture.',

            '- State explicitly that these gaps are not governance debt that can be closed after release: for production use of a Thinking System, the application is not ready for production at the intended scope while any material control responsibility remains unowned, unrealized, insufficiently evidenced for its decision, or without a credible corrective or reassessment path. Define **complete control architecture** here as materially complete for the authorized scope, not maximal implementation of every cell in the four-horizon × four-capability map.':
            '- State explicitly that these gaps are not governance debt that can be closed after release: for production use of a Thinking System, the application is not ready for production at the intended scope while any material control responsibility remains unowned, unrealized, insufficiently evidenced for its decision, or without a credible corrective or reassessment path. Define **complete control architecture** here as materially complete for the authorized scope, not maximal control implementation. Do not introduce the four-horizon × four-capability terminology in this callout before those models are explained later.',

            '- State that governance becomes operational through the socio-technical stack that makes the system bounded, observable, correctable, and reauthorizable, rather than through a policy document or post-release review.':
            '- State that governance becomes operational through the socio-technical control architecture rather than through a policy document or post-release review. Preserve boundedness, evidence, corrective action, and reassessment as the substance of that claim without implying a mandatory physical stack.'
          }
          for old, new in replacements.items():
              count = b.count(old)
              if count != 1:
                  raise SystemExit(f'blueprint match count={count}: {old[:100]}')
              b = b.replace(old, new)

          marker = '**Supporting figures:**\n'
          note = ('**Accepted drafting decisions from the 2026-08-12 Abstract / Section 1 iteration:**\n\n'
                  '- Keep Section 1 publication prose UA-neutral until the engineering problem and category have been derived; avoid formulations such as `UA expects` or `UA is designed to address` as premises.\n'
                  '- Introduce the customer-support running example lightly in Section 1 and defer thresholds, Hard/Soft mechanics, explicit horizon routing, and implementation detail to later sections.\n'
                  '- Use the material-control-responsibility release-readiness criterion here, but defer explicit `four horizons × four capability families` language until those models have been introduced.\n'
                  '- In the Abstract, describe UA as the resulting open-specification synthesis and its falsifiable maturity boundary rather than narrating when the framework name appears in the paper.\n\n')
          idx = b.find(marker, b.find('### 5.1 Engineering Evolves Around Dominant Uncertainty'))
          if idx == -1:
              raise SystemExit('supporting figures marker not found in 5.1')
          if 'Accepted drafting decisions from the 2026-08-12 Abstract / Section 1 iteration' not in b:
              b = b[:idx] + note + b[idx:]
          blueprint.write_text(b)
      - name: Commit reconciled research documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/research/notes/open-engineering-specification-article-draft.md content/research/notes/open-engineering-specification-article-blueprint.md
          git commit -m "docs(research): reconcile section 1 manuscript and blueprint"
          git push origin HEAD:research/polish-abstract-section-1
