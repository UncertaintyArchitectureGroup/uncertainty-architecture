name: Temporary Section 3 rewrite
on:
  push:
    branches: [research/rewrite-section-3-bounded-control]
permissions:
  contents: write
jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rewrite-section-3-bounded-control
          fetch-depth: 0
      - name: Apply staged rewrite
        run: python tmp_section3_rewrite.py
      - name: Verify and commit
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/research/notes/open-engineering-specification-article-draft.md content/research/notes/open-engineering-specification-article-blueprint.md
          git commit -m "docs(research): rewrite Section 3 bounded-control argument"
          git push origin HEAD:research/rewrite-section-3-bounded-control
