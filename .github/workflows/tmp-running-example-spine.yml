name: tmp-running-example-spine
on:
  push:
    branches:
      - research/restore-running-example-spine
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/restore-running-example-spine
      - name: Apply patch
        run: python .github/scripts/tmp-running-example-spine.py
      - name: Validate scope
        run: |
          git diff --check
          changed=$(git diff --name-only)
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 2
          printf '%s\n' "$changed" | grep -qx 'content/research/notes/open-engineering-specification-article-draft.md'
          printf '%s\n' "$changed" | grep -qx 'content/research/notes/open-engineering-specification-article-blueprint.md'
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/research/notes/open-engineering-specification-article-draft.md content/research/notes/open-engineering-specification-article-blueprint.md
          git commit -m 'docs(research): restore running example spine'
          git push
