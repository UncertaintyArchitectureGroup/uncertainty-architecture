name: tmp final pr73 fixes
on:
  push:
    branches: [research/tighten-section-2-horizon-foreshadowing]
    paths: [.github/workflows/tmp-final-pr73-fixes.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/tighten-section-2-horizon-foreshadowing
      - name: Patch manuscript and blueprint
        shell: python
        run: |
          from pathlib import Path
          import re
          mp=Path('content/research/notes/open-engineering-specification-article-draft.md')
          bp=Path('content/research/notes/open-engineering-specification-article-blueprint.md')
          m=mp.read_text(); b=bp.read_text()
          m=m.replace('### Controllers and decision authority','### Controllers and bounded decision functions')
          m=m.replace('A **Controller** compares or interprets evidence relative to approved Requirements, Constraints, assumptions, and a defined decision boundary, then selects or authorizes action. What makes something a Controller is not intelligence, automation, a dashboard, or a job title. It is ownership of a defined decision together with legitimate authority over the available response.','A **Controller** compares or interprets evidence relative to approved Requirements, Constraints, assumptions, and a defined decision boundary, then selects or initiates action within delegated authority. What makes something a Controller is not intelligence, automation, a dashboard, or a job title. It is the control function that turns evidence into a bounded response decision. Decision authority belongs to the applicable human, organizational, project, delivery, or runtime decision basis; the Controller exercises only the portion delegated to its function.')
          m=m.replace('C["Controller and decision authority<br/>compare · interpret · authorize"]','C["Controllers / decision functions<br/>compare · interpret · select bounded response"]')
          m=m.replace('Controllers and decision authority<br/> interpret evidence and authorize action','Controllers / decision functions<br/> interpret evidence and select bounded response')
          m=m.replace('E["Runtime evidence<br/>behavior · outcomes · control state · changed assumptions"]','E["Realization / operation evidence<br/>behavior · outcomes · control state · changed assumptions"]')
          m=m.replace('**Figure 9 — Four decision-ownership horizons around one controlled object.** Downward paths carry authoritative sources, delegated authority, architecture, release scope, and realized boundaries into operation. Runtime evidence returns directly to the horizon whose decision basis it invalidates; reassessment is therefore not a mandatory upward sequence.','**Figure 9 — Four decision-ownership horizons around one controlled object.** Downward paths carry authoritative sources, delegated authority, architecture, release scope, and realized boundaries toward operation. Evidence from realization or operation returns directly to the horizon whose decision basis it invalidates; reassessment is therefore not a mandatory upward sequence and need not originate only at Runtime.')
          m=re.sub(r'Figure (1[0-5]|[7-9])', lambda x: f'Figure {int(x.group(1))-1}', m)
          b=b.replace('Controller functions operating within delegated decision authority, and Actuators. Where substantive judgment is reserved, show Human Authority as the holder of that authority or escalation destination rather than as a synonym for the Controller capability.','Controller / decision functions operating within delegated authority, and Actuators. Keep decision-authority ownership outside the Controller definition: where substantive judgment is reserved, show Human Authority or the applicable horizon owner as the holder of that authority or escalation destination.')
          b=b.replace('including downward inheritance and direct reassessment to the horizon whose decision basis is invalidated. Only then combine','including downward inheritance and direct reassessment from realization or operation evidence to the horizon whose decision basis is invalidated. Do not imply that reassessment originates only at Runtime. Only then combine')
          mp.write_text(m); bp.write_text(b)
      - name: Commit
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/research/notes/open-engineering-specification-article-draft.md content/research/notes/open-engineering-specification-article-blueprint.md
          git commit -m 'docs(research): align controller authority evidence and figure sequence'
          git push origin HEAD:research/tighten-section-2-horizon-foreshadowing
