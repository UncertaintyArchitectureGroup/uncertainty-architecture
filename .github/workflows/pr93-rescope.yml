name: PR93 rescope to platform adaptation only

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pr93-rescope.yml"
      - ".github/scripts/pr93_rescope.py"

permissions:
  contents: write

jobs:
  rescope:
    if: github.head_ref == 'publishing/linkedin-medium-renditions'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: publishing/linkedin-medium-renditions
          fetch-depth: 0
      - name: Apply PR scope correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          python3 .github/scripts/pr93_rescope.py
          rm .github/scripts/pr93_rescope.py
          git add -A
          git commit -m "fix: keep PR93 scoped to LinkedIn and Medium renditions"
          git push origin HEAD:publishing/linkedin-medium-renditions
