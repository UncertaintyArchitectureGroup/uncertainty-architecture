name: Temporary PR78 final semantic cleanup
on:
  push:
    branches: [agent/replan-sections-5-8]
    paths: [.github/workflows/tmp-pr78-final-semantic-cleanup.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/replan-sections-5-8
          fetch-depth: 0
      - name: Apply semantic cleanup
        run: python3 .github/scripts/tmp_pr78_final_semantic_cleanup.py
      - name: Validate diff and exact phrases
        run: |
          git diff --check
          ! grep -nE 'Organizational-selected-path|Organizationally selected deterministic/manual redesign|Organization-level path/business/research decision|Organizational path/research/business decision|Organizational-path-specific-research-business|viability/path/business/research-authorization handshake|assessment/viability/path/business/research-authorization handshake' content/research/notes/open-engineering-specification-article-blueprint.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/research/notes/open-engineering-specification-article-blueprint.md content/research/framework-traceability.md
          git commit -m "Finish lifecycle semantic consistency cleanup"
          git push origin HEAD:agent/replan-sections-5-8
