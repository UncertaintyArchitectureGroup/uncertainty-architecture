name: One-shot review traceability table fix

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'research/reconcile-thinking-systems-review'
    runs-on: ubuntu-latest
    steps:
      - name: Check out head branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Repair traceability table continuity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path

          path = Path('content/research/framework-traceability.md')
          text = path.read_text()
          old = '\n\n| Thinking-System classification predates LLMs when at least one Consequential Runtime Responsibility depends partly on an earlier probabilistic system’s Model Judgment; LLMs changed prevalence and generality rather than creating the responsibility structure from zero.'
          new = '\n| Systems covered by Thinking-System classification predate LLMs when at least one Consequential Runtime Responsibility depends partly on an earlier probabilistic system’s Model Judgment; LLMs changed prevalence and generality rather than creating the responsibility structure from zero.'
          if text.count(old) != 1:
              raise SystemExit(f'expected one traceability-table boundary, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PYCODE

      - name: Validate repository-facing change
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_metadata.py --mode metadata
          python3 .github/scripts/validate_metadata.py --mode canonical
          python3 .github/scripts/validate_metadata.py --mode terminology
          python3 .github/scripts/validate_repository_contract.py
          git diff --check

      - name: Remove one-shot workflow and commit fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-review-traceability-table.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "research: keep external-review rows in traceability table"
          git push origin HEAD:${{ github.head_ref }}
