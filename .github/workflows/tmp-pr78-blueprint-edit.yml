name: Temporary PR78 manuscript ownership audit

on:
  push:
    branches:
      - agent/replan-sections-5-8

permissions:
  contents: read

jobs:
  audit-manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/replan-sections-5-8
      - name: Audit manuscript ownership wording
        shell: python
        run: |
          from pathlib import Path
          p = Path('content/research/notes/open-engineering-specification-article-draft.md')
          lines = p.read_text().splitlines()
          needles = [
              'Organization selects',
              'Organization select',
              'simpler alternative',
              'simpler path',
              'business/design',
              'category retest',
              'category result',
              'Architectural Veto',
              'Model Judgment unnecessary',
          ]
          for i, line in enumerate(lines, 1):
              if any(n.lower() in line.lower() for n in needles):
                  print(f'{i}: {line}')
