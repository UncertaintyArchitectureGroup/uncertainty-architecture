name: Temporary PR78 manuscript ownership correction

on:
  push:
    branches:
      - agent/replan-sections-5-8

permissions:
  contents: write

jobs:
  edit-manuscript:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/replan-sections-5-8
          fetch-depth: 0
      - name: Correct manuscript ownership semantics
        shell: python
        run: |
          from pathlib import Path

          path = Path('content/research/notes/open-engineering-specification-article-draft.md')
          text = path.read_text()

          def rep(old, new, required=True):
              global text
              count = text.count(old)
              print(f'count={count}: {old[:100]}')
              if required and count == 0:
                  raise SystemExit(f'Missing required source: {old[:160]!r}')
              text = text.replace(old, new)

          rep(
          "The repository's current draft-normative **Nested Control Lifecycle** already establishes four connected decision levels, downward inheritance, local reassessment, Project Reauthorization, and Organizational review. This paper makes one additional lifecycle distinction explicit as a **research refinement under validation**: Project / Architecture produces the engineering viability conclusion; Organization owns the business decision to proceed with, reshape, research, defer, or stop the initiative; and **Project Authorization is the scoped technical authorization baseline that connects that Organizational decision to Delivery**.",
          "The repository's current draft-normative **Nested Control Lifecycle** already establishes four connected decision levels, downward inheritance, local reassessment, Project Reauthorization, and Organizational review. This paper makes one additional lifecycle distinction explicit as a **research refinement under validation**: Project / Architecture owns Model-Judgment necessity, technical/design selection within the standing Organizational business and authority basis, and the engineering viability conclusion; Organization owns the business outcome and authoritative/investment basis plus the business decision to authorize specific bounded research, proceed with a viable production initiative, reshape that basis, defer, or stop; and **Project Authorization is the scoped technical authorization baseline that connects the applicable Organizational decision to Delivery**."
          )

          rep(
          "- **Organization** owns authoritative boundaries, reserved decision rights, shared capabilities, exceptions, and business authority over whether the initiative should proceed, be reshaped, receive a specific bounded-research authorization, be deferred, or stop. It establishes initial admissibility and assessment eligibility before Project analysis, then acts again where a Project viability conclusion requires an Organizational research or business decision.\n- **Project / Architecture** owns Model-Judgment necessity analysis, alternatives, the concrete control architecture, technical/control feasibility, Human Authority and fallback feasibility, complete control economics, and the resulting **Project viability conclusion**.",
          "- **Organization** owns authoritative boundaries, reserved decision rights, shared capabilities, exceptions, the business outcome and investment basis, and business authority over whether the initiative should proceed, be reshaped, receive a specific bounded-research authorization, be deferred, or stop. It establishes initial admissibility and assessment eligibility before Project analysis, then acts again where a Project viability conclusion requires an Organizational research, continuation, or basis-change decision.\n- **Project / Architecture** owns Model-Judgment necessity analysis, alternatives, technical/design selection within the standing Organizational business/authority basis, the concrete control architecture, technical/control feasibility, Human Authority and fallback feasibility, complete control economics, category confirmation for the selected technical design, and the resulting **Project viability conclusion**."
          )

          rep(
          "The same separation applies to Model-Judgment necessity. Project / Architecture may conclude that a deterministic, manual, or narrower model-assisted design is preferable for the stated outcome. That conclusion returns to Organization like any other material viability conclusion. Organization can select the simpler path, change the intended business outcome and request a new analysis, or stop. **Only after Organization selects the simpler path does Project apply the category result to the active design:** if no Consequential Runtime Responsibility remains materially dependent on Model Judgment, the selected design exits this Thinking-System lifecycle; if the selected narrower model-assisted design still has that dependency, it remains a Thinking System and is reassessed at its narrower scope. An executive preference for “using AI” does not make Model Judgment technically necessary for an unchanged outcome.",
          "The same separation applies to Model-Judgment necessity. Project / Architecture may conclude that a deterministic, manual, or narrower model-assisted design is preferable for the stated outcome. **If that design still satisfies the standing Organizational business outcome and authority basis, selecting it is a Project / Architecture decision, not a second Organizational architecture approval.** Project applies the category test to the selected technical design: if no Consequential Runtime Responsibility remains materially dependent on Model Judgment, the design exits this Thinking-System lifecycle; if the narrower model-assisted design still has that dependency, it remains a Thinking System and is reassessed at its narrower scope. Organization is reactivated when adopting the recommendation requires changing a premise it owns—such as the intended outcome, delegated authority, price/value model, target segment, service promise, funding, investment horizon, or another strategic objective—or when it must decide whether to continue, defer, or stop the initiative. An executive preference for “using AI” does not make Model Judgment technically necessary for an unchanged outcome; if AI capability-building, market learning, or another strategic objective is genuinely intended, that objective must become part of the Organizational business basis and be reassessed by Project."
          )

          rep(
          "Project may category-test candidate alternatives during analysis, because category membership is an engineering fact about the candidate's responsibility structure. But **choosing the business/design path remains Organizational**. If Project concludes that a deterministic/manual alternative is preferable and that candidate leaves no Consequential Runtime Responsibility materially dependent on Model Judgment, that fact is recorded in the Project viability conclusion and returned to Organization. If Organization selects that alternative, Project confirms the category result for the selected design and the design exits this Thinking-System lifecycle into the ordinary product/software lifecycle. If Organization instead changes the intended outcome, Project reassesses the new proposal. If Organization selects a narrower model-assisted alternative that still has a Model-Judgment-dependent Consequential Runtime Responsibility, it remains a Thinking System and the full map is reapplied to that narrower scope.",
          "Project may category-test candidate alternatives during analysis, because category membership is an engineering fact about the candidate's responsibility structure. **Technical/design selection remains Project / Architecture-owned while the selected design satisfies the standing Organizational business outcome and authority basis.** If Project concludes that a deterministic/manual alternative is preferable and that design leaves no Consequential Runtime Responsibility materially dependent on Model Judgment, Project selects that technical path, confirms the category result, and the design exits this Thinking-System lifecycle into the ordinary product/software lifecycle. If the Project-selected narrower model-assisted alternative still has a Model-Judgment-dependent Consequential Runtime Responsibility, it remains a Thinking System and the full map is reapplied to that narrower scope. If the technically preferred alternative requires a changed outcome, authority, price/value premise, service promise, funding, investment horizon, or another Organizationally owned basis, Project returns that requirement and its recommendation to Organization; any changed basis then comes back for Project reassessment."
          )

          rep(
          "- **Model Judgment unnecessary or a simpler alternative preferred** — a Project conclusion returned to Organization; category transition follows only if Organization selects that path;",
          "- **Model Judgment unnecessary or a simpler alternative preferred** — a Project architecture/viability conclusion; if the simpler design satisfies the standing Organizational business/authority basis, Project selects it and applies the category result directly; Organization is reactivated only when an Organizational premise or continuation decision must change;"
          )

          # Replace Figure 11 wholesale.
          old_fig = '''```mermaid
flowchart TB
    ORG["Organizational admissibility + assessment eligibility<br/> authoritative context · value assumptions"]
    NEED["Model Judgment necessity<br/> deterministic · manual · narrower alternative check"]
    SIMP["Project viability conclusion<br/> simpler alternative preferred<br/> candidate category result recorded"]
    RISK["Material scenarios<br/> Judgment landscape · authority · consequences"]
    K["Project Constraint Architecture<br/> Constraints · assumptions"]
    PROP["Required operating-contract properties<br/> evidence obligations"]
    PATH["Credible bounded control paths<br/> Realizations · Sensors · Controllers · Actuators"]
    HUMAN["Human Authority · fallback · recovery<br/> capacity · latency · common-mode assumptions"]
    ECON["Complete economics + residual exposure<br/> solution cost · control-perimeter cost"]
    V["Project viability conclusion<br/> viable · narrower · research<br/> economic non-viability · Architectural Veto"]
    OD["Organization<br/> select simpler path · proceed · reshape<br/> bounded research · defer · do not proceed"]
    CAT{"Category retest for selected path<br/>Does any Consequential Runtime Responsibility<br/>still depend partly on Model Judgment?"}
    EXIT["No → exit Thinking-System lifecycle<br/>continue ordinary product / software lifecycle"]
    PRA["Research-only Project Authorization<br/> bounded experiment · no production permission"]
    PPA["Production-capable Project Authorization<br/> versioned technical baseline"]
    D["Delivery"]

    ORG --> NEED
    NEED -->|simpler alternative preferred| SIMP --> OD
    NEED -->|Model Judgment remains candidate| RISK
    RISK --> K --> PATH
    RISK --> PROP --> PATH
    PATH --> HUMAN --> ECON --> V --> OD
    OD -->|select simpler alternative| CAT
    CAT -->|No| EXIT
    CAT -->|Yes, narrower model-assisted candidate| RISK
    OD -->|changed business / authority basis| NEED
    OD -->|specific Bounded Research Authorization| PRA --> D
    OD -->|positive Business Authorization<br/>on viable production basis| PPA --> D
```'''
          new_fig = '''```mermaid
flowchart TB
    ORG["Organizational admissibility + assessment eligibility<br/> business outcome · authoritative context · value assumptions"]
    NEED["Project / Architecture<br/> Model Judgment necessity + alternative-design analysis"]
    CAT{"Selected technical design<br/>Does any Consequential Runtime Responsibility<br/>still depend partly on Model Judgment?"}
    EXIT["No → exit Thinking-System lifecycle<br/>continue ordinary product / software lifecycle"]
    RISK["Thinking-System candidate remains<br/>material scenarios · Judgment landscape · authority · consequences"]
    K["Project Constraint Architecture<br/> Constraints · assumptions"]
    PROP["Required operating-contract properties<br/> evidence obligations"]
    PATH["Credible bounded control paths<br/> Realizations · Sensors · Controllers · Actuators"]
    HUMAN["Human Authority · fallback · recovery<br/> capacity · latency · common-mode assumptions"]
    ECON["Complete economics + residual exposure<br/> solution cost · control-perimeter cost"]
    V["Project viability conclusion<br/> viable · narrower · research<br/> economic non-viability · Architectural Veto"]
    OD["Organization<br/> specific bounded research · proceed / continue<br/> reshape business / authority basis · defer · do not proceed"]
    PRA["Project / Architecture<br/> research-only Project Authorization<br/> bounded experiment · no production permission"]
    PPA["Project / Architecture<br/> production-capable Project Authorization<br/> versioned technical baseline"]
    D["Delivery"]

    ORG --> NEED
    NEED -->|Project selects technical design<br/>inside standing Organizational basis| CAT
    CAT -->|No| EXIT
    CAT -->|Yes| RISK
    NEED -->|preferred design requires changed<br/>Organizational outcome / authority / investment basis| OD
    RISK --> K --> PATH
    RISK --> PROP --> PATH
    PATH --> HUMAN --> ECON --> V --> OD
    OD -->|changed business / authority basis| NEED
    OD -->|specific Bounded Research Authorization| PRA --> D
    OD -->|positive Business Authorization<br/>on viable production basis| PPA --> D
```'''
          rep(old_fig, new_fig)

          rep(
          "**Figure 11 — Project control architecture, viability conclusion, Organizational choice, category exit, and authorization handshake.** Project / Architecture owns Model-Judgment necessity, architectural feasibility, control economics, and the Project viability conclusion. A simpler alternative is a Project conclusion, not a unilateral lifecycle transition. Organization decides whether to select that path, change the business basis, research, proceed, defer, or stop. If Organization selects the simpler path, Project applies the category test to the **selected** design: a negative result exits this Thinking-System lifecycle; a narrower model-assisted design remains inside it. Bounded research is also two-step: Project defines a controllable experiment, Organization issues a specific Bounded Research Authorization, and Project then issues the research-only technical baseline. Architectural Veto is a Project conclusion; “do not proceed” is an Organizational business decision.",
          "**Figure 11 — Project technical/design selection, viability conclusion, Organizational business/research decision, category exit, and authorization handshake.** Project / Architecture owns Model-Judgment necessity, alternative-design selection within the standing Organizational business/authority basis, category confirmation, architectural feasibility, control economics, and the Project viability conclusion. A simpler architecture that still satisfies that standing basis may be selected at Project and can exit the Thinking-System lifecycle immediately after a negative category test; it does not require an Organizational architecture-selection ceremony. Organization is reactivated when a Project conclusion requires a changed business/authority/investment premise, when bounded research is requested, or when the business decision is to proceed, reshape, defer, or stop. Bounded research remains two-step: Project defines a controllable experiment, Organization issues a specific Bounded Research Authorization, and Project then issues the research-only technical baseline. Architectural Veto is a Project conclusion; “do not proceed” is an Organizational business decision."
          )

          rep(
          "Project Reauthorization follows the same distinction. If Delivery or Runtime evidence changes the technical design but the proposal remains viable inside the standing Organizational business and authority basis, Project may reassess and issue a new production-capable technical baseline without a new business decision. Research evidence returns to Project viability analysis and cannot promote itself to production. If evidence destroys the business assumptions, makes a simpler alternative preferable, creates an Architectural Veto, or requires wider Organizational authority, Project returns the viability conclusion to Organization. If Organization then selects a non-Model-Judgment path, category retest determines whether the active design leaves this lifecycle.",
          "Project Reauthorization follows the same distinction. If Delivery or Runtime evidence changes the technical design but the proposal remains viable inside the standing Organizational business and authority basis, Project may reassess, select a different technical architecture, apply the category test, and—where the system remains a Thinking System—issue a new production-capable technical baseline without a new business decision. Research evidence returns to Project viability analysis and cannot promote itself to production. A simpler alternative that still satisfies the standing Organizational basis is therefore Project-local. Evidence returns to Organization when business assumptions no longer close, a new bounded-research decision is needed, an Architectural Veto requires a changed proposal, or wider Organizational authority or another Organizationally owned premise must change."
          )

          rep(
          "| **Project / Architecture** | Is Model Judgment justified, can the €50/Human-Authority boundary be controlled credibly, and does the full control perimeter remain viable? | Project/architecture/product/engineering decision function operating inside the Organizational basis. | Viability conclusion, candidate category result, Architectural Veto, narrower/simpler alternative, economic finding; after the corresponding Organizational choice, confirm category status and issue a scoped research-only or production-capable Project Authorization where applicable. |",
          "| **Project / Architecture** | Is Model Judgment justified, which technical design best satisfies the standing Organizational basis, can the €50/Human-Authority boundary be controlled credibly, and does the full control perimeter remain viable? | Project/architecture/product/engineering decision function operating inside the Organizational basis. | Technical/design selection, category confirmation, viability conclusion, Architectural Veto, narrower/simpler alternative, economic finding; after any required Organizational research/business authorization, issue a scoped research-only or production-capable Project Authorization where applicable. |"
          )

          rep(
          "- If Project concludes that the same business outcome is better served by deterministic rules, it returns **simpler alternative preferred** as part of the Project viability conclusion. Organization then decides whether to select that path, change the intended outcome, or stop. If Organization selects the deterministic redesign, Project confirms the category result for the selected design; if no Consequential Runtime Responsibility remains materially dependent on Model Judgment, it **exits this Thinking-System lifecycle**. If Organization selects a narrower model-assisted alternative that still materially informs a consequential responsibility, it remains a Thinking System and is reassessed at its narrower scope.",
          "- If Project concludes that the same business outcome is better served by deterministic rules and that redesign remains inside the standing Organizational authority/business basis, it selects the deterministic architecture and records **simpler alternative preferred** in the viability conclusion. Project then confirms the category result; if no Consequential Runtime Responsibility remains materially dependent on Model Judgment, the design **exits this Thinking-System lifecycle**. A Project-selected narrower model-assisted alternative that still materially informs a consequential responsibility remains a Thinking System and is reassessed at its narrower scope. Organization is involved only if the recommendation requires a changed outcome, authority, investment premise, strategic objective, or a business decision to continue, defer, or stop."
          )

          rep(
          "**What this adds to the case:** the €50/€450 boundary now distinguishes initial assessment eligibility, specific Bounded Research Authorization, Project engineering viability, Organizational business authority, research-only versus production-capable technical authorization, Delivery release authority, and the explicit exit only after Organization selects a non-Model-Judgment design and Project confirms its category result.",
          "**What this adds to the case:** the €50/€450 boundary now distinguishes initial assessment eligibility, Project-owned technical/design selection and engineering viability, Organizational business/basis authority, specific Bounded Research Authorization, research-only versus production-capable technical authorization, Delivery release authority, and category exit when the Project-selected design inside the standing Organizational basis no longer depends on Model Judgment."
          )

          rep(
          "The current draft-normative Nested Control Lifecycle already provides downward inheritance, local reassessment, Project Reauthorization, and Organizational review. The sharper **Project viability conclusion ↔ Organizational Bounded Research / Business Authorization ↔ scoped Project Authorization** handshake developed in this section—including assessment eligibility, research-only versus production-capable authorization, and category exit after Organizational selection of a simpler path—is a paper-level lifecycle refinement under validation.",
          "The current draft-normative Nested Control Lifecycle already provides downward inheritance, local reassessment, Project Reauthorization, and Organizational review. The sharper **Project technical/design selection and viability conclusion ↔ Organizational Bounded Research / Business Authorization or basis change ↔ scoped Project Authorization** handshake developed in this section—including assessment eligibility, research-only versus production-capable authorization, and category exit after Project selects a simpler design inside the standing Organizational basis—is a paper-level lifecycle refinement under validation."
          )

          rep(
          "The four horizons therefore form a nested, recurrent lifecycle rather than a waterfall. Organizational authority and business assumptions flow into Project analysis. Initial assessment eligibility allows analysis, not experiment exposure. Project viability evidence can return to Organization before any technical authorization exists. A Project-defined experiment may run only after specific Bounded Research Authorization and under research-only Project Authorization, then return evidence without creating production permission. Once Organization chooses to proceed on a technically viable production basis, a production-capable Project Authorization carries the technical baseline to Delivery. Delivery realizes and releases only the authorized scope. Runtime operates it and produces evidence. Exogenous Organizational changes can also reopen the Organizational horizon directly. A simpler path leaves the Thinking-System lifecycle only after Organization selects that path and Project confirms the selected design no longer meets the category test.",
          "The four horizons therefore form a nested, recurrent lifecycle rather than a waterfall. Organizational authority, business outcome, and business assumptions flow into Project analysis. Initial assessment eligibility allows analysis, not experiment exposure. Project selects the technical design within that standing basis, confirms its category, and produces viability evidence. A Project-defined experiment may run only after specific Bounded Research Authorization and under research-only Project Authorization, then return evidence without creating production permission. Once Organization chooses to proceed on a technically viable production basis, a production-capable Project Authorization carries the technical baseline to Delivery. Delivery realizes and releases only the authorized scope. Runtime operates it and produces evidence. Exogenous Organizational changes can also reopen the Organizational horizon directly. A simpler technical path may leave the Thinking-System lifecycle at Project after category confirmation when it still satisfies the standing Organizational basis; Organization re-enters only when its business outcome, authority, investment premise, or continuation decision must change."
          )

          rep(
          "> **Project / Architecture owns the viability conclusion. Organization owns the decision to select a business/design path, authorize a specific bounded experiment, pursue a viable production basis, reshape, defer, or stop. Project Authorization is the scoped technical baseline that connects the applicable Organizational decision to Delivery.**",
          "> **Project / Architecture owns Model-Judgment necessity, technical/design selection within the standing Organizational business/authority basis, category confirmation, and the viability conclusion. Organization owns the business outcome and basis plus the decisions to authorize a specific bounded experiment, pursue a viable production basis, reshape that basis, defer, or stop. Project Authorization is the scoped technical baseline that connects the applicable Organizational decision to Delivery.**"
          )

          rep(
          "> **A simpler alternative is a Project viability conclusion; if Organization selects it, category retest of the selected design determines whether it exits this Thinking-System lifecycle.**",
          "> **A simpler alternative is a Project architecture/viability conclusion. If it satisfies the standing Organizational business/authority basis, Project may select it directly; category retest of that selected design determines whether it exits this Thinking-System lifecycle.**"
          )

          path.write_text(text)
      - name: Commit manuscript correction
        run: |
          git diff -- content/research/notes/open-engineering-specification-article-draft.md
          if git diff --quiet -- content/research/notes/open-engineering-specification-article-draft.md; then
            echo "No manuscript changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/research/notes/open-engineering-specification-article-draft.md
          git commit -m "Align manuscript Section 4 ownership with blueprint"
          git push origin HEAD:agent/replan-sections-5-8
