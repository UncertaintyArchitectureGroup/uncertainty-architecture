          "routes `simpler alternative preferred` through Project technical/design selection → category confirmation → Project viability conclusion, with Organization re-entering only for changed business/authority basis or research/proceed/reshape/defer/stop decisions"
          ),
          ]

          for old, new in pairs:
              rep(old, new, required=False)

          # Clean up remaining generic shorthand without changing research/business authorization semantics.
          text = text.replace('Organization selects the simpler path', 'Project selects the simpler technical path within the standing Organizational basis')
          text = text.replace('Organization selects a simpler path', 'Project selects a simpler technical path within the standing Organizational basis')
          text = text.replace('Organization selects the path', 'Project selects the technical path within the standing Organizational basis')
          text = text.replace('Organization chooses among them', 'Project / Architecture chooses the technical design within the standing Organizational basis')
          text = text.replace('Organization chooses a simpler alternative', 'Project / Architecture chooses a simpler technical alternative within the standing Organizational basis')
          text = text.replace('selection of the business/design path belongs to Organization', 'technical/design selection within the standing Organizational basis belongs to Project / Architecture; Organization owns the business outcome and basis')

          path.write_text(text)
      - name: Commit blueprint correction
        run: |
          git diff -- content/research/notes/open-engineering-specification-article-blueprint.md
          if git diff --quiet -- content/research/notes/open-engineering-specification-article-blueprint.md; then
            echo "No blueprint changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/research/notes/open-engineering-specification-article-blueprint.md
          git commit -m "Complete Project and Organization ownership correction in blueprint"
          git push origin HEAD:agent/replan-sections-5-8
