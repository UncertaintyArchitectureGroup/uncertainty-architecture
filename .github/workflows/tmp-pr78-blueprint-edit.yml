name: Temporary PR78 blueprint audit

on:
  push:
    branches:
      - agent/replan-sections-5-8

permissions:
  contents: read

jobs:
  audit-blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/replan-sections-5-8
      - name: Audit ownership wording
        shell: python
        run: |
          from pathlib import Path
          p = Path('content/research/notes/open-engineering-specification-article-blueprint.md')
          lines = p.read_text().splitlines()
          needles = [
              'Organization selects',
              'Organization select',
              'business/design path',
              'selected-path category',
              'simpler alternative',
              'simpler path',
              'candidate category',
              'lifecycle exit',
          ]
          for i, line in enumerate(lines, 1):
              if any(n.lower() in line.lower() for n in needles):
                  print(f'{i}: {line}')
