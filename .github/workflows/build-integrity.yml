name: Build integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quartz-build:
    name: Build / Quartz production site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Code formatting and Python syntax / changed sources
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base_ref="$CURRENT_SHA"
          head_ref="$CURRENT_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_ref="$BASE_SHA"
            head_ref="$HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            base_ref="$BEFORE_SHA"
          fi
          python3 .github/scripts/validate_code_quality.py --base "$base_ref" --head "$head_ref"
      - name: Policy / code-quality self-tests
        run: python3 -m unittest discover -s .github/tests/code_quality -p 'test_*.py'
      - name: Policy / publication-impact self-tests
        run: python3 -m unittest discover -s .github/tests/publication_impact -p 'test_*.py'
      - name: TypeScript / static analysis
        run: npm run check:types
      - name: Quartz / TypeScript regression tests
        run: npm run test:quartz
      - name: PDF export / regression tests
        run: npm run test:publication
      - name: Figure 8 / semantic and readability verification
        run: npm run pdf:verify:figure8
      - name: Build Quartz site
        run: npm run build

  publication-impact:
    name: Publication / detect impacted surfaces
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.detect.outputs.required }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect publication-impacting changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          required="$(
            python3 .github/scripts/detect_publication_impact.py \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA"
          )"
          echo "required=$required" >> "$GITHUB_OUTPUT"

  publication-render:
    needs: publication-impact
    if: needs.publication-impact.outputs.required == 'true'
    name: Publication / current article render
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium and PDF inspection tools
        shell: bash
        run: |
          ./node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Generate Figure 8 review assets
        run: npm run pdf:verify:figure8
      - name: Render current publication PDF
        env:
          UA_PDF_REPOSITORY_REF: ${{ github.sha }}
        run: npm run pdf:article
      - name: Visual verify current publication PDF
        run: npm run pdf:verify -- dist/pdf/thinking-systems-when-the-controlled-object-changes.pdf --require-manifest
      - name: Render publication platform assets
        run: npm run publication:assets
      - name: Render living working paper PDF
        env:
          UA_PDF_REPOSITORY_REF: ${{ github.sha }}
        run: npm run pdf:working-paper
      - name: Visual verify living working paper PDF
        run: npm run pdf:verify -- dist/pdf/uncertainty-architecture-thinking-systems-working-paper.pdf --require-manifest
      - name: Upload publication validation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-render-validation
          path: |
            dist/pdf/*.pdf
            dist/pdf/*.manifest.json
            dist/pdf/visual/**
            dist/publication/thinking-systems/**
          if-no-files-found: error
          retention-days: 14

  mermaid-render:
    name: Content / render Mermaid diagrams
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Render every maintained Mermaid block
        run: python3 .github/scripts/validate_mermaid.py

  workflow-policy:
    name: Supply chain / workflows and pins
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate immutable action and container references
        run: python3 .github/scripts/validate_workflow_supply_chain.py
      - name: Run supply-chain regression fixtures
        run: python3 .github/tests/supply_chain/test_supply_chain.py
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}"
      - name: Run actionlint
        run: '"$(go env GOPATH)/bin/actionlint"'
      - name: Install zizmor
        run: pipx install zizmor==1.26.0
      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --pedantic .github/workflows
