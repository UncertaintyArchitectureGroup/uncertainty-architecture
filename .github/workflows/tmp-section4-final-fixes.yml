name: tmp-section4-final-fixes
on:
  push:
    branches: [research/rewrite-section-4-operating-map]
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rewrite-section-4-operating-map
      - name: Apply targeted Section 4 fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          draft_path = Path('content/research/notes/open-engineering-specification-article-draft.md')
          bp_path = Path('content/research/notes/open-engineering-specification-article-blueprint.md')
          draft = draft_path.read_text()
          bp = bp_path.read_text()

          replacements = [
          (
          '''The business case must include the control perimeter from the beginning:\n\n```text\nexpected value attributable to Model Judgment\ncompared with\nsolution lifecycle cost\n+ complete control-perimeter lifecycle cost\n+ residual exposure / uncertainty after control\n→ authorize / narrow / bounded research / redesign / defer / No-Go\n```\n\nSolution lifecycle cost may include model, platform, data, integration, and ordinary operation. Control-perimeter cost may include Constraint design and realization, evaluations and evidence, Human Authority, fallback, observability, incident response, false blocks, control maintenance, reassessment, added latency, and control-specific operational friction. These are reasoning buckets, not a universal accounting standard.''',
          '''The business case must include the control perimeter from the beginning. The decision should consider four things together rather than collapse them into one pseudo-precise score:\n\n```text\nexpected value attributable to Model Judgment\n+ solution lifecycle economics\n+ complete control-perimeter lifecycle economics\n+ residual exposure and uncertainty after control\n+ hard authorization constraints that cannot be traded away\n→ authorize / narrow / bounded research / redesign / defer / No-Go\n```\n\nSolution lifecycle economics may include model, platform, data, integration, and ordinary operation. Control-perimeter economics may include Constraint design and realization, evaluations and evidence, Human Authority, fallback, observability, incident response, false blocks, control maintenance, reassessment, added latency, and control-specific operational friction. Residual exposure and uncertainty remain separate decision dimensions unless they are credibly translated into comparable expected-loss or range estimates. These are reasoning buckets, not a universal accounting standard.'''
          ),
          (
          '''    P["Project Authorization + Constraints<br/> evidence obligations · delegated authority"]\n    ENG["Delivery translation and realization<br/> Judgment Nodes · realizations · Human Authority<br/> fallback · Sensors · Controllers · Actuators"]\n    VER["Implementation / evaluation / verification<br/> deterministic tests · semantic evidence · traceability"]\n    G["DoR · DoD · Release Gate<br/> distinct decisions"]\n    RUN["Runtime deployment and evidence"]\n    LOCAL["Local response<br/> repair · rollback · narrow · re-release"]\n    REAUTH["Project Reauthorization<br/> authorization basis invalidated"]\n\n    P --> ENG --> VER --> G --> RUN\n    RUN -->|local implementation / realization / evidence issue| LOCAL --> ENG\n    RUN -->|risk / authority / feasibility / capacity / economics invalidated| REAUTH --> P''',
          '''    P["Project Authorization + Constraints<br/> evidence obligations · delegated authority"]\n    R["Definition of Ready<br/> bounded work may begin"]\n    ENG["Delivery realization<br/> Judgment Nodes · realizations · Human Authority<br/> fallback · Sensors · Controllers · Actuators"]\n    VER["Implementation / evaluation / verification<br/> deterministic tests · semantic evidence · traceability"]\n    D["Definition of Done<br/> implementation + evidence complete"]\n    G["Release Gate<br/> accept · limit · condition · escalate · reject"]\n    RUN["Runtime deployment and evidence"]\n    LOCAL["Local response<br/> repair · rollback · narrow · re-release"]\n    REAUTH["Project Reauthorization<br/> authorization basis invalidated"]\n\n    P --> R --> ENG --> VER --> D --> G --> RUN\n    RUN -->|local implementation / realization / evidence issue| LOCAL --> ENG\n    RUN -->|risk / authority / feasibility / capacity / economics invalidated| REAUTH --> P'''
          ),
          (
          '''Automation can carry repeatable invariant checks, tests, evaluations, evidence aggregation, version comparison, routing, policy-as-code checks, blocked-action verification, release-condition checks, and safe bounded Actuation when those mechanisms are observable, reversible, and inside delegated authority. Human decision owners retain contextual acceptance, architecture judgment, residual-risk acceptance, and authority change.''',
          '''Automation can carry repeatable invariant checks, tests, evaluations, evidence aggregation, version comparison, routing, policy-as-code checks, blocked-action verification, release-condition checks, and safe bounded Actuation when those mechanisms are observable, reversible, and inside delegated authority. Human decision owners retain contextual release acceptance, bounded engineering judgment, and residual-risk acceptance within delegated release authority; changes to project architecture or authority must be escalated to Project / Architecture or Organization as appropriate.'''
          ),
          (
          '''    CTRL["Runtime Controller<br/> interpret within delegated authority"]\n    ACT["Runtime Actuator / Human Authority<br/> reject · contain · fallback · narrow<br/> roll back · compensate · disable · stop"]\n    VERIFY["Post-action evidence<br/> resulting state verified"]''',
          '''    CTRL["Runtime Controller / Human Authority<br/> interpret · decide · authorize within delegated authority"]\n    ACT["Runtime Actuator<br/> reject · contain · fallback · narrow<br/> roll back · compensate · disable · stop"]\n    VERIFY["Post-action evidence<br/> resulting state verified"]'''
          )]

          for old, new in replacements:
              count = draft.count(old)
              if count != 1:
                  raise SystemExit(f'draft replacement expected 1 match, got {count}: {old[:80]!r}')
              draft = draft.replace(old, new)

          old_bp = '''Project Authorization + Constraints + evidence obligations\n→ delivery translation and realization\n→ implementation / evaluation / verification\n→ DoR / DoD / Release Gate decisions\n→ runtime deployment and evidence\n→ local repair / rollback / narrow / re-release\n   OR Project Reauthorization when the authorization basis is invalidated'''
          new_bp = '''Project Authorization + Constraints + evidence obligations\n→ Definition of Ready\n→ delivery realization / implementation / evaluation / verification\n→ Definition of Done\n→ deployment-specific Release Gate\n→ runtime deployment and evidence\n→ local repair / rollback / narrow / re-release\n   OR Project Reauthorization when the authorization basis is invalidated'''
          count = bp.count(old_bp)
          if count != 1:
              raise SystemExit(f'blueprint delivery figure replacement expected 1 match, got {count}')
          bp = bp.replace(old_bp, new_bp)

          draft_path.write_text(draft)
          bp_path.write_text(bp)
          PY
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'content/research/notes/open-engineering-specification-article-blueprint.md\ncontent/research/notes/open-engineering-specification-article-draft.md'
          test "$changed" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/research/notes/open-engineering-specification-article-draft.md content/research/notes/open-engineering-specification-article-blueprint.md
          git commit -m "docs(research): tighten Section 4 review findings"
          git push
