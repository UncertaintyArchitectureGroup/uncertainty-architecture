name: Temporary PR 95 inline SVG repair

on:
  push:
    branches:
      - publishing/thinking-systems-pdf-review

permissions:
  contents: write

concurrency:
  group: pr95-inline-svg-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Temporary / repair inline SVG publication rendering
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out review branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: publishing/thinking-systems-pdf-review
          fetch-depth: 0
          persist-credentials: true
      - name: Repair SVG compaction and test fixtures
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          rendition = Path('quartz/scripts/publication-rendition.mjs')
          text = rendition.read_text(encoding='utf-8')
          bad = '.replace(/\\n\\sj\\n/g, "\\n")'
          good = '.replace(/\\r?\\n[ \\t]*\\r?\\n/g, "\\n")'
          if bad not in text:
              raise RuntimeError('Expected broken compactInlineSvg expression not found')
          rendition.write_text(text.replace(bad, good, 1), encoding='utf-8')

          tests = subprocess.check_output(
              ['git','show','origin/main:quartz/scripts/publication-rendition.test.mjs'],
              text=True,
          )
          tests = tests.replace(
              '  buildPublicationRendition,\n',
              '  buildPublicationRendition,\n  compactInlineSvg,\n',
              1,
          )
          anchor = 'test("Figure 8 publication rendition preserves decision and capability semantics", () => {'
          compact_test = '''test("inline publication SVG remains one raw HTML block", () => {\n  const svg = `<svg>\\n<text>top</text>\\n\\n<rect/>\\n\\n<text>bottom</text>\\n</svg>`;\n  const compacted = compactInlineSvg(svg);\n  assert.doesNotMatch(compacted, /\\n[ \\t]*\\n/);\n  assert.match(compacted, /<text>bottom<\\/text>/);\n});\n\n'''
          if anchor not in tests:
              raise RuntimeError('Test insertion anchor not found')
          tests = tests.replace(anchor, compact_test + anchor, 1)
          Path('quartz/scripts/publication-rendition.test.mjs').write_text(tests, encoding='utf-8')

          Path('.github/workflows/pr95-inline-svg-fix.yml').unlink(missing_ok=True)
          Path('.github/pr95-trigger.txt').unlink(missing_ok=True)
          PY
      - name: Validate and push repaired branch
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node --check quartz/scripts/publication-rendition.mjs
          node --test quartz/scripts/*.test.mjs
          git diff --check
          git config user.name "oborskyivitalii"
          git config user.email "oborskyivitalii@gmail.com"
          git add -A
          git commit -m "Fix publication SVG rendering and regression fixtures"
          git push origin HEAD:publishing/thinking-systems-pdf-review
