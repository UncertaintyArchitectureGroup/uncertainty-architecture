name: Temporary PR68 final semantic cleanup

on:
  push:
    paths:
      - '.github/workflows/temp-pr68-final-semantic-cleanup.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/polish-abstract-section-1
      - name: Apply final semantic cleanup
        shell: python
        run: |
          from pathlib import Path

          manuscript = Path('content/research/notes/open-engineering-specification-article-draft.md')
          m = manuscript.read_text()
          old = 'Consider a customer-support team trying to reduce resolution cost and latency.'
          new = 'Consider a fictional customer-support team trying to reduce resolution cost and latency.'
          if m.count(old) != 1:
              raise SystemExit(f'manuscript match count={m.count(old)}')
          m = m.replace(old, new)
          manuscript.write_text(m)

          blueprint = Path('content/research/notes/open-engineering-specification-article-blueprint.md')
          b = blueprint.read_text()
          old = '**Supporting table:** Location of uncertainty, primary engineering mechanism, and where decisive feedback appears. The first column must use the broader categories first: plan-driven development (including Waterfall), iterative delivery (including Agile and related approaches), modern operations (commonly associated with DevOps), and **Thinking-System engineering — problem space addressed by Uncertainty Architecture**. The table must state that earlier uncertainty classes persist and describe UA response as bounded control architecture rather than as the category definition itself.'
          new = '**Supporting table:** Location of uncertainty, primary engineering mechanism, and where decisive feedback appears. The first column must use the broader categories first: plan-driven development (including Waterfall), iterative delivery (including Agile and related approaches), modern operations (commonly associated with DevOps), and **Thinking-System engineering**. Keep the table framework-neutral at this stage. It must state that earlier uncertainty classes persist and describe the Thinking-System engineering response as bounded control architecture rather than using Uncertainty Architecture as the category definition or explanatory premise.'
          if b.count(old) != 1:
              raise SystemExit(f'blueprint match count={b.count(old)}')
          b = b.replace(old, new)
          blueprint.write_text(b)

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/research/notes/open-engineering-specification-article-draft.md content/research/notes/open-engineering-specification-article-blueprint.md
          git commit -m "docs(research): finish section 1 framework-neutral reconciliation"
          git push origin HEAD:research/polish-abstract-section-1
