name: tmp-reconcile-section1
on:
  push:
    branches:
      - research/reconcile-section-1-blueprint
    paths:
      - tmp/reconcile_section1.py
      - .github/workflows/tmp-reconcile-section1.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/reconcile-section-1-blueprint
      - run: python tmp/reconcile_section1.py
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/research/notes/open-engineering-specification-article-draft.md content/research/notes/open-engineering-specification-article-blueprint.md
          git commit -m 'docs(research): reconcile section 1 with blueprint'
          git push origin HEAD:research/reconcile-section-1-blueprint
