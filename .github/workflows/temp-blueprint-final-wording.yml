name: Temporary blueprint final wording

on:
  push:
    paths:
      - '.github/workflows/temp-blueprint-final-wording.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/map-adjacent-landscape
      - name: Align final blueprint wording
        shell: python
        run: |
          from pathlib import Path
          p = Path('content/research/notes/open-engineering-specification-article-blueprint.md')
          s = p.read_text()
          old = '> Governance becomes operational through the active socio-technical control architecture; without it, readiness for production release at the intended scope is incomplete.'
          new = '> Governance becomes operational through the active socio-technical control architecture; a Thinking System is not ready for production at the intended scope while any material control responsibility remains unowned, unrealized, insufficiently evidenced for its decision, or without a credible corrective or reassessment path.'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one match, found {count}')
          p.write_text(s.replace(old, new))
      - name: Commit blueprint update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/research/notes/open-engineering-specification-article-blueprint.md
          git commit -m "docs(research): align final readiness wording"
          git push origin HEAD:research/map-adjacent-landscape
