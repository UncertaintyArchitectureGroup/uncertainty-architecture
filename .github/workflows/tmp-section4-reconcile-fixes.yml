name: tmp-section4-reconcile-fixes
on:
  push:
    branches: [research/rewrite-section-4-operating-map]
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rewrite-section-4-operating-map
      - name: Reconcile manuscript and blueprint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          draft_path = Path('content/research/notes/open-engineering-specification-article-draft.md')
          bp_path = Path('content/research/notes/open-engineering-specification-article-blueprint.md')
          draft = draft_path.read_text()
          bp = bp_path.read_text()

          old = '''The business case must include the control perimeter from the beginning. The decision should consider four things together rather than collapse them into one pseudo-precise score:\n\n```text\nexpected value attributable to Model Judgment\n+ solution lifecycle economics\n+ complete control-perimeter lifecycle economics\n+ residual exposure and uncertainty after control\n+ hard authorization constraints that cannot be traded away\n→ authorize / narrow / bounded research / redesign / defer / No-Go\n```'''
          new = '''The business case must include the control perimeter from the beginning. The decision should consider five dimensions together rather than collapse them into one pseudo-precise score:\n\n```text\nexpected value attributable to Model Judgment\nconsidered against:\n- solution lifecycle economics\n- complete control-perimeter lifecycle economics\n- residual exposure and uncertainty after control\n- hard authorization constraints that cannot be traded away\n→ authorize / narrow / bounded research / redesign / defer / No-Go\n```'''
          if draft.count(old) != 1:
              raise SystemExit(f'economics block expected 1 match, got {draft.count(old)}')
          draft = draft.replace(old, new)

          old = '''Delivery Controllers combine explicit human release/engineering authority with automation. Automation may handle repeatable invariant checks, build/test/evaluation execution, evidence aggregation, traceability, drift/version detection, policy-as-code checks, blocked-action verification, release-condition checks, routing, and safe bounded actions **when those checks and actions are themselves sufficiently observable, reversible, and inside delegated authority**. Human decision owners retain decisions that require contextual acceptance, architecture judgment, residual-risk acceptance, or authority change.'''
          new = '''Delivery Controllers combine explicit human release/engineering authority with automation. Automation may handle repeatable invariant checks, build/test/evaluation execution, evidence aggregation, traceability, drift/version detection, policy-as-code checks, blocked-action verification, release-condition checks, routing, and safe bounded actions **when those checks and actions are themselves sufficiently observable, reversible, and inside delegated authority**. Human decision owners retain contextual release acceptance, bounded engineering judgment, and residual-risk acceptance within delegated release authority; changes to project architecture or authority must be escalated to Project / Architecture or Organization as appropriate.'''
          if bp.count(old) != 1:
              raise SystemExit(f'delivery-controller blueprint sentence expected 1 match, got {bp.count(old)}')
          bp = bp.replace(old, new)

          old = '''active Thinking System / realizations\n→ Sensors and evidence\n→ Runtime Controller within delegated authority\n→ Actuator / Human Authority / fallback\n→ changed operation\n→ Sensor verification of the resulting state'''
          new = '''active Thinking System / realizations\n→ Sensors and evidence\n→ Runtime Controller / Human Authority within delegated authority\n→ Actuator / fallback\n→ changed operation\n→ Sensor verification of the resulting state'''
          if bp.count(old) != 1:
              raise SystemExit(f'runtime capability path expected 1 match, got {bp.count(old)}')
          bp = bp.replace(old, new)

          draft_path.write_text(draft)
          bp_path.write_text(bp)
          PY
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'content/research/notes/open-engineering-specification-article-blueprint.md\ncontent/research/notes/open-engineering-specification-article-draft.md'
          test "$changed" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/research/notes/open-engineering-specification-article-draft.md content/research/notes/open-engineering-specification-article-blueprint.md
          git commit -m "docs(research): reconcile Section 4 review fixes"
          git push
