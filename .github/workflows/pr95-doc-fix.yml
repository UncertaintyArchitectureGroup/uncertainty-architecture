name: Temporary PR 95 documentation repair

on:
  push:
    branches:
      - publishing/thinking-systems-pdf-review

permissions:
  contents: write

jobs:
  repair:
    name: Temporary / repair publication documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out review branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: publishing/thinking-systems-pdf-review
          fetch-depth: 0
          persist-credentials: true
      - name: Document reviewed figure presentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("quartz/PDF-EXPORT.md")
          text = path.read_text(encoding="utf-8")
          marker = "## Dense Figure 8\n"
          section = """## Figure presentation

The publication page itself remains white for print fidelity and predictable reader rendering. Diagram bodies use a restrained off-white panel with a thin neutral border so figures are visually grouped without turning the paper into a slide deck.

The canonical Markdown remains unchanged. For the standalone publication PDF, Figure 3 is rendered as two side-by-side panels: Linear Software on the left and the Thinking System on the right. Figure 8A is re-authored as three decision bands across Organization, Project / Architecture, Delivery, and Runtime; Figure 8B retains the capability-family and orthogonality view. These are presentation renditions, not alternative research definitions.

"""
          if section in text:
              raise SystemExit("Figure presentation section already exists")
          if marker not in text:
              raise SystemExit("Dense Figure 8 section marker not found")
          path.write_text(text.replace(marker, section + marker, 1), encoding="utf-8")
          PY
          rm -f .github/workflows/pr95-doc-fix.yml
      - name: Commit documentation repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document publication figure presentation"
          git push origin HEAD:publishing/thinking-systems-pdf-review
