name: Temporary Section 3 final polish

on:
  push:
    branches:
      - research/rewrite-section-3-bounded-control

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rewrite-section-3-bounded-control
          fetch-depth: 0
      - name: Apply final Section 3 polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('content/research/notes/open-engineering-specification-article-draft.md')
          s = p.read_text()
          replacements = [
            ('Suppose the organization permits automated low-value credits but requires **Human Authority** before a refund above a delegated amount can execute.', 'Suppose the organization permits automated refunds up to a delegated amount but requires **Human Authority** before a refund above that amount can execute.'),
            ('This is the difference between a measured system, a closed feedback loop, and a bounded controlled system. The last requires not merely feedback but an approved and credibly realized operating boundary, evidence fit for the decisions being made, legitimate decision authority, effective corrective action, and a path for reassessment when the basis of control changes.', 'This is the difference between a measured system, a closed feedback loop, and a bounded controlled system. The last requires not merely feedback but an approved and credibly realized operating boundary, evidence fit for the decisions being made, legitimate decision authority, effective corrective action, and a path for reassessment when the basis of control changes. Here, a **complete control architecture** means materially complete for the authorized scope, not maximal instantiation of every possible control mechanism or every cell in the later operating map.'),
            ('What is often called AI governance is therefore not a fifth capability family and not a post-hoc checkpoint. Governance becomes operational through this socio-technical control architecture.', 'What is often called AI governance is therefore not a fifth capability family and not a post-hoc checkpoint. Governance becomes operational through this socio-technical control architecture across Organization, Project / Architecture, Delivery, and Runtime decision horizons.'),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:80]}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
          git diff --check
          git diff -- content/research/notes/open-engineering-specification-article-draft.md
          test -z "$(git status --short | grep -v 'open-engineering-specification-article-draft.md' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/research/notes/open-engineering-specification-article-draft.md
          git commit -m "docs(research): tighten Section 3 control boundaries"
          git push origin HEAD:research/rewrite-section-3-bounded-control
