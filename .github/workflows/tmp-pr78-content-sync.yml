name: Temporary PR78 content sync

on:
  push:
    branches:
      - agent/replan-sections-5-8

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/replan-sections-5-8
          fetch-depth: 0
      - name: Apply content fixes
        run: python3 .github/scripts/tmp_pr78_sync.py
      - name: Validate diff
        run: git diff --check
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md content/research/notes/open-engineering-specification-article-blueprint.md content/research/notes/open-engineering-specification-article-draft.md
          git commit -m "Align Article lifecycle ownership semantics"
          git push origin HEAD:agent/replan-sections-5-8
