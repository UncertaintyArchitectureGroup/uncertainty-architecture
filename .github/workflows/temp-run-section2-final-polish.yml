name: Temporary run Section 2 final polish
on:
  push:
    paths:
      - '.github/workflows/temp-run-section2-final-polish.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/polish-section-2
      - run: python .tmp-section2-final-polish.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/research/notes/open-engineering-specification-article-draft.md
          git commit -m "docs(research): tighten Section 2 visual semantics"
          git push