name: tmp-pr73-indent
on:
  push:
    branches:
      - research/tighten-section-2-horizon-foreshadowing
    paths:
      - tmp/pr73_indent.py
      - .github/workflows/tmp-pr73-indent.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/tighten-section-2-horizon-foreshadowing
      - run: python tmp/pr73_indent.py
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/research/notes/open-engineering-specification-article-draft.md
          git commit -m 'docs(research): normalize combined-model Mermaid indentation'
          git push origin HEAD:research/tighten-section-2-horizon-foreshadowing
