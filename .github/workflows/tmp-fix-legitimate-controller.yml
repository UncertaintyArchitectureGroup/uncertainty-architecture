name: tmp-fix-legitimate-controller
on: [push]
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/research/restore-running-example-spine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/restore-running-example-spine
      - name: Patch wording
        run: |
          M='content/research/notes/open-engineering-specification-article-draft.md'
          python - <<'PY'
          from pathlib import Path
          p=Path('content/research/notes/open-engineering-specification-article-draft.md')
          s=p.read_text()
          old='evidence without a legitimate Controller is observation'
          new='evidence without a Controller able to interpret it and act within an authorized decision boundary is observation'
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new))
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/research/notes/open-engineering-specification-article-draft.md
          git commit -m 'docs(research): clarify Controller authority semantics'
          git push origin HEAD:research/restore-running-example-spine
