name: Temporary PR69 blueprint final sync

on:
  push:
    branches:
      - research/polish-section-2

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/polish-section-2
          fetch-depth: 0
      - name: Align blueprint with manuscript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('content/research/notes/open-engineering-specification-article-blueprint.md')
          s = p.read_text()

          new1 = "- Explain why the object needs a distinct name using the canonical category boundary: in Linear Software, Consequential Runtime Responsibilities are fulfilled entirely through explicitly encoded logic rather than depending partly on probabilistic Model Judgment; in a Thinking System, one or more Consequential Runtime Responsibilities depend partly on probabilistic Model Judgment, so part of the consequential mapping is completed at runtime."
          pattern1 = r"^- Explain why the object needs a distinct name:.*$"
          s, n1 = re.subn(pattern1, new1, s, count=1, flags=re.MULTILINE)
          if n1 != 1:
              raise SystemExit(f'Linear Software boundary: expected exactly 1 structural match, found {n1}')

          new2 = """Right — Thinking System — changed responsibility structure
          situation and operating conditions
          ├→ explicitly authored responsibilities before, between, and after Judgment Nodes ─┐
          └→ one or more Judgment Nodes using probabilistic Model Judgment ──────────────────┤
                                                                                               ↓
                                                     consequential output, action, or downstream state"""
          pattern2 = r"Right — Thinking System — changed responsibility structure\nsituation and operating conditions\n→ explicitly authored responsibilities\n→ one or more Judgment Nodes using probabilistic Model Judgment\n→ consequential output, action, or downstream state"
          s, n2 = re.subn(pattern2, new2, s, count=1)
          if n2 != 1:
              raise SystemExit(f'Figure 3 contract: expected exactly 1 structural match, found {n2}')

          p.write_text(s)
          PY
      - name: Verify only intended blueprint changes and commit
        shell: bash
        run: |
          git diff --check
          git diff -- content/research/notes/open-engineering-specification-article-blueprint.md
          test -z "$(git status --short | grep -v 'open-engineering-specification-article-blueprint.md' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/research/notes/open-engineering-specification-article-blueprint.md
          git commit -m "docs(research): align Section 2 blueprint wording"
          git push origin HEAD:research/polish-section-2
