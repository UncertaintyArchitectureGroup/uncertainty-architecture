name: Temporary run Section 2 patch

on:
  push:
    branches:
      - research/polish-section-2
    paths:
      - '.github/workflows/temp-run-section2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/polish-section-2
          fetch-depth: 0
      - run: python .github/scripts/temp_apply_section2.py
      - run: |
          rm -f .tmp-section2.md
          rm -f .github/scripts/temp_apply_section2.py
          rm -f .github/workflows/temp-section2-rewrite.yml
          rm -f .github/workflows/temp-apply-section2.yml
          rm -f .github/workflows/temp-run-section2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(research): polish section 2 controlled-object argument'
          git push origin HEAD:research/polish-section-2
