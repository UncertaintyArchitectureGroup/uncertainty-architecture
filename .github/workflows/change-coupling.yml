name: Change coupling

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: change-coupling-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-contract:
    if: github.event_name == 'pull_request'
    name: Contract / diff-aware companion updates
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate PR contract and actual diff
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 .github/scripts/validate_change_coupling.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --labels "$PR_LABELS"

  agent-checkpoint:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    name: Agent protocol / exact-state checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact-state agent checkpoint
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          BASE_TIP_SHA="$(git rev-parse "refs/remotes/origin/$BASE_REF")"
          python3 .github/scripts/validate_agent_checkpoint.py \
            --base "$BASE_SHA" \
            --base-tip "$BASE_TIP_SHA" \
            --head "$HEAD_SHA" \
            --merge "$MERGE_SHA"

  self-tests:
    name: Policy / change coupling self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run diff-aware regression fixtures
        working-directory: 03-reference-architectures
        run: python3 ../.github/tests/change_coupling/test_change_coupling.py

      - name: Run agent checkpoint regression fixtures
        run: python3 .github/tests/agent_checkpoint/test_agent_checkpoint.py

      - name: Run checkpoint repository-contract mutation fixture
        run: python3 .github/tests/agent_checkpoint/test_checkpoint_repository_contract.py
