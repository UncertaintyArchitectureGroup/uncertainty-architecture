name: Metadata integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metadata-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontmatter:
    name: Metadata / frontmatter and controlled values
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate frontmatter and controlled values
        working-directory: 01-patterns
        run: python3 ../.github/scripts/validate_metadata.py --mode metadata

  canonical-ownership:
    name: Metadata / canonical ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate canonical ownership
        working-directory: 02-ai-control-plane
        run: python3 ../.github/scripts/validate_metadata.py --mode canonical

  glossary-terminology:
    name: Content / glossary and terminology
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate protected glossary entries and report terminology warnings
        working-directory: 00-doctrine
        run: python3 ../.github/scripts/validate_metadata.py --mode terminology

  research-register:
    name: Research / state and provenance register
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate research state register
        run: python3 .github/scripts/validate_research_register.py

  repository-intelligence:
    name: Repository / intelligence projection
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run repository-intelligence behavioral tests
        run: python3 .github/tests/repository_intelligence/test_repository_intelligence.py

      - name: Run agent-workflow and A/B evaluation regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tests/repository_intelligence/test_agent_workflow.py
          python3 .github/tests/repository_intelligence/test_ab_evaluation.py

      - name: Run Control Map data-boundary regressions
        run: python3 .github/tests/repository_intelligence/test_control_map.py

      - name: Build compact Agent Context Surface candidate
        run: python3 .github/scripts/repository_intelligence.py build --view agent --output "${RUNNER_TEMP}/agent-context.json"

      - name: Build full Graph View candidate
        run: python3 .github/scripts/repository_intelligence.py build --view graph --output "${RUNNER_TEMP}/repository-intelligence-graph.json"

      - name: Report materialization sizes
        shell: bash
        run: |
          set -euo pipefail
          wc -c "${RUNNER_TEMP}/agent-context.json" "${RUNNER_TEMP}/repository-intelligence-graph.json"

      - name: Refresh compact surface on PR branch
        if: github.event_name == 'pull_request' && github.head_ref == 'test/repository-intelligence-ab-evaluation' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if cmp -s "${RUNNER_TEMP}/agent-context.json" assets/repository-intelligence/agent-context.json; then
            echo "Committed compact surface is already current."
            exit 0
          fi
          current_sha="$(git rev-parse "origin/${HEAD_REF}:assets/repository-intelligence/agent-context.json")"
          CURRENT_SHA="${current_sha}" python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          content = Path(os.environ["RUNNER_TEMP"]) / "agent-context.json"
          payload = {
              "message": "chore: refresh RI agent context surface",
              "content": base64.b64encode(content.read_bytes()).decode("ascii"),
              "sha": os.environ["CURRENT_SHA"],
              "branch": os.environ["HEAD_REF"],
          }
          Path(os.environ["RUNNER_TEMP"], "ri-surface-update.json").write_text(
              json.dumps(payload), encoding="utf-8"
          )
          PY
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@${RUNNER_TEMP}/ri-surface-update.json" \
            "https://api.github.com/repos/${REPOSITORY}/contents/assets/repository-intelligence/agent-context.json" \
            > "${RUNNER_TEMP}/ri-surface-update-response.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          response = json.loads(Path(os.environ["RUNNER_TEMP"], "ri-surface-update-response.json").read_text())
          print(f"Committed compact surface at {response['commit']['sha']}")
          PY

      - name: Upload compact candidate for connector-only recovery
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-context-candidate
          path: ${{ runner.temp }}/agent-context.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload full graph candidate for Quartz/CI consumers
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-intelligence-graph
          path: ${{ runner.temp }}/repository-intelligence-graph.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify committed compact surface freshness
        run: python3 .github/scripts/repository_intelligence.py verify --candidate "${RUNNER_TEMP}/agent-context.json"

      - name: Measure deterministic preflight corpus
        run: python3 .github/scripts/benchmark_repository_intelligence.py --suite repository-preflight-v1 --record-checkout --output "${RUNNER_TEMP}/repository-intelligence-benchmark.json"

      - name: Upload benchmark observations
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-intelligence-benchmark
          path: ${{ runner.temp }}/repository-intelligence-benchmark.json
          if-no-files-found: ignore
          retention-days: 7

  self-tests:
    name: Policy / metadata self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run metadata regression fixtures
        working-directory: 03-reference-architectures
        run: python3 ../.github/tests/metadata_contract/test_metadata.py

      - name: Run research-register regression fixtures
        run: python3 .github/tests/research_register/test_research_register.py
