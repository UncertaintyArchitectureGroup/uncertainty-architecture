name: Temporary PR78 blueprint leftover cleanup
on:
  push:
    branches: [agent/replan-sections-5-8]
    paths: [.github/workflows/tmp-pr78-blueprint-last-leftovers.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/replan-sections-5-8
          fetch-depth: 0
      - name: Apply cleanup
        run: python3 .github/scripts/tmp_pr78_blueprint_last_leftovers.py
      - name: Validate
        run: |
          git diff --check
          git diff --name-only
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/research/notes/open-engineering-specification-article-blueprint.md
          git commit -m "Remove remaining blanket Organization routing"
          git push origin HEAD:agent/replan-sections-5-8
