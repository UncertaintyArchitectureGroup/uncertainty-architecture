name: Temporary Section 1 reader prose polish

on:
  push:
    paths:
      - '.github/workflows/temp-polish-section-1-reader-prose.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/polish-abstract-section-1
      - name: Refine running-example prose
        shell: python
        run: |
          from pathlib import Path
          p = Path('content/research/notes/open-engineering-specification-article-draft.md')
          s = p.read_text()
          old = 'Consider a customer-support team trying to reduce resolution cost and latency. It has a capable model, authorized retrieval and tool access, traces, evaluation suites, policy guidance, a human-review path, and a pilot that interprets requests and proposes resolutions. Each local component can be competent. The dashboard may be green. The demo may be impressive. The complete system may still lack a defensible connection between what the organization permits, what the project authorizes, what the delivery team has realized, what runtime evidence means, and what action follows when assumptions fail. This support-resolution system will remain the running example through the paper; at this point, the important fact is only that consequential interpretation and resolution may depend partly on Model Judgment while the surrounding controls and decision rights are not yet connected.'
          new = 'Consider a customer-support team trying to reduce resolution cost and latency. It has a capable model, retrieval and tool access, traces, evaluation suites, policy guidance, a human-review path, and a pilot that interprets requests and proposes resolutions. Each local component can be competent. The dashboard may be green. The demo may be impressive. The complete system may still lack a defensible connection between what the organization permits, what the project authorizes, what the delivery team has realized, what runtime evidence means, and what action follows when assumptions fail. We will return to this support-resolution system as the argument develops. For now, the important fact is only that consequential interpretation and resolution may depend partly on Model Judgment while the surrounding controls and decision rights are not yet connected.'
          if s.count(old) != 1:
            raise SystemExit(f'Expected one match, found {s.count(old)}')
          p.write_text(s.replace(old, new))
      - name: Commit manuscript update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/research/notes/open-engineering-specification-article-draft.md
          git commit -m "docs(research): refine section 1 reader-facing example"
          git push origin HEAD:research/polish-abstract-section-1
