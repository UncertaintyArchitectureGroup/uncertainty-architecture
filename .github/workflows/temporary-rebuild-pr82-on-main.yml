name: Temporary rebuild PR82 on merged release-contract main

on:
  push:
    branches:
      - agent/article-section5-carrier-sufficiency
    paths:
      - .github/workflows/temporary-rebuild-pr82-on-main.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out rebuilt branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/article-section5-carrier-sufficiency
          fetch-depth: 0
          persist-credentials: true

      - name: Restore only Article 5 work from historical PR82 commit
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          OLD = "aa65a50befc90ea930de472c7811f89518d372f0"
          MANUSCRIPT = "content/research/notes/open-engineering-specification-article-draft.md"
          BLUEPRINT = "content/research/notes/open-engineering-specification-article-blueprint.md"
          CHANGELOG = "CHANGELOG.md"

          def old_file(path: str) -> str:
              return subprocess.check_output(
                  ["git", "show", f"{OLD}:{path}"], text=True
              )

          # Manuscript: PR82's independent contribution is Article 5. Article 2 now
          # comes entirely from merged PR91/main.
          current = Path(MANUSCRIPT).read_text(encoding="utf-8")
          historical = old_file(MANUSCRIPT)
          marker = "## 5. Applying the Map Without Overbuilding"
          if marker in current:
              raise SystemExit("Article 5 already present in rebuilt manuscript")
          pos = historical.find(marker)
          if pos < 0:
              raise SystemExit("Historical Article 5 marker not found")
          section5 = historical[pos:].strip()
          Path(MANUSCRIPT).write_text(current.rstrip() + "\n\n" + section5 + "\n", encoding="utf-8")

          # Blueprint: preserve merged PR91 wording and restore only the Article 5
          # canonical map plus the accepted Article 5 drafting decisions.
          current = Path(BLUEPRINT).read_text(encoding="utf-8")
          historical = old_file(BLUEPRINT)

          map_start = "**Blueprint-owned canonical working mapping — `support-resolution-canonical-material-map / v12`.**"
          map_end = "**Reverse-mapping closure rule:**"
          hs = historical.find(map_start)
          he = historical.find(map_end, hs)
          if hs < 0 or he < 0:
              raise SystemExit("Historical v12 mapping block anchors not found")
          mapping_block = historical[hs:he].rstrip()
          if map_start in current:
              raise SystemExit("v12 mapping already present in rebuilt blueprint")
          target = current.find(map_end)
          if target < 0:
              raise SystemExit("Current reverse-mapping anchor not found")
          current = current[:target] + mapping_block + "\n\n" + current[target:]

          decisions_start = "**Accepted drafting decisions from the 2026-08-16 Article §5 first-draft iteration:**"
          decisions_end = "**Minimum publication-facing output:**"
          hs = historical.find(decisions_start)
          he = historical.find(decisions_end, hs)
          if hs < 0 or he < 0:
              raise SystemExit("Historical Article 5 drafting-decision anchors not found")
          decisions_block = historical[hs:he].rstrip()
          if decisions_start in current:
              raise SystemExit("Article 5 drafting decisions already present")
          target = current.find(decisions_end)
          if target < 0:
              raise SystemExit("Current minimum-publication anchor not found")
          current = current[:target] + decisions_block + "\n\n" + current[target:]
          Path(BLUEPRINT).write_text(current, encoding="utf-8")

          # Changelog: keep PR91's already-merged release-contract entry and add
          # only PR82's Article 5 entry.
          current = Path(CHANGELOG).read_text(encoding="utf-8")
          historical = old_file(CHANGELOG)
          prefix = "- Drafted Article §5 as the paper-level carrier-sufficiency and proportional-application test,"
          article5_line = next((line for line in historical.splitlines() if line.startswith(prefix)), None)
          if article5_line is None:
              raise SystemExit("Historical Article 5 changelog entry not found")
          if prefix in current:
              raise SystemExit("Article 5 changelog entry already present")
          anchor = "- Synchronized the long-form blueprint, manuscript, and shorter publication adaptation around the release-contract consequence of runtime Model Judgment:"
          idx = current.find(anchor)
          if idx < 0:
              raise SystemExit("Merged PR91 changelog anchor not found")
          current = current[:idx] + article5_line + "\n" + current[idx:]
          Path(CHANGELOG).write_text(current, encoding="utf-8")

      - name: Commit rebuilt PR and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-rebuild-pr82-on-main.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md \
            content/research/notes/open-engineering-specification-article-blueprint.md \
            content/research/notes/open-engineering-specification-article-draft.md \
            .github/workflows/temporary-rebuild-pr82-on-main.yml
          git commit -m 'Rebuild Article 5 PR on merged release-contract baseline'
          git push origin HEAD:agent/article-section5-carrier-sufficiency
