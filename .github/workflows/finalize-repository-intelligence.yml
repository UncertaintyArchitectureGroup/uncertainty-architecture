name: Finalize Repository Intelligence PR2

on:
  push:
    branches:
      - repository-intelligence/context-surface

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Materialize reviewed PR2 implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tmp/ri-finalize/script-*.b64 | base64 -d | gzip -d > .github/scripts/repository_intelligence.py
          mkdir -p .github/tests/repository_intelligence
          cat .github/tmp/ri-finalize/test-*.b64 | base64 -d | gzip -d > .github/tests/repository_intelligence/test_repository_intelligence.py
          cat .github/tmp/ri-finalize/workflow-*.b64 | base64 -d | gzip -d > .github/workflows/metadata-integrity.yml
          chmod +x .github/scripts/repository_intelligence.py .github/tests/repository_intelligence/test_repository_intelligence.py
          rm -rf .github/tmp/ri-finalize
          git rm .github/workflows/finalize-repository-intelligence.yml

      - name: Reconcile architecture and companion state
        shell: bash
        run: |
          python3 - <<'PYDOC'
            from pathlib import Path

            def replace_once(path, old, new):
                p = Path(path)
                text = p.read_text(encoding="utf-8")
                count = text.count(old)
                if count != 1:
                    raise SystemExit(f"{path}: expected exactly one match, found {count}")
                p.write_text(text.replace(old, new, 1), encoding="utf-8")

            p = Path("CHANGELOG.md")
            text = p.read_text(encoding="utf-8")
            marker = "## [Unreleased]\n\n### Added\n\n"
            bullet = '- Added the repository-intelligence PR 2 bootstrap implementation: one deterministic producer now emits a compact root-neutral `.ua-agent-context.json` Agent Context Surface and an uncommitted full Graph View, with complete term/artifact/scope/research/validation inventories, derived Responsibility nodes, typed relation classes plus explicit impact roles/directions, deterministic provenance-backed diagnostics, first-order structural-control impact semantics, owner/term/artifact/validation preflight, non-self-referential freshness checks, and a bounded Git tree/blob candidate-snapshot reader that rejects symlink/submodule/path indirection and reports trusted comparison as unsupported/incomplete when target-owned interpretation cannot be established. Candidate-side tests remain bootstrap evidence until the producer/schema are merged.\n'
            if marker not in text:
                raise SystemExit("CHANGELOG marker missing")
            if bullet not in text:
                text = text.replace(marker, marker + bullet, 1)
            p.write_text(text, encoding="utf-8")

            replace_once("ROADMAP.md", '2. build one deterministic accepted-state producer that emits a compact connector-friendly Agent Context Surface and a fuller Graph View, supports typed relations plus explicit impact roles/directions and endpoint-sensitive first-order structural-control traversal, validates freshness, and implements a bounded candidate-snapshot reader that cannot escape the declared repository snapshot through symlink/path/submodule/Git-execution indirection; during this bootstrap PR, candidate-side tests/generated outputs are implementation evidence and direct maintainer review remains the trust boundary because the producer/schema are not target-owned until merge;', '2. [x] build one deterministic accepted-state producer that emits a compact connector-friendly Agent Context Surface and a fuller Graph View, supports typed relations plus explicit impact roles/directions and endpoint-sensitive first-order structural-control traversal, validates freshness, and implements a bounded candidate-snapshot reader that cannot escape the declared repository snapshot through symlink/path/submodule/Git-execution indirection; during this bootstrap PR, candidate-side tests/generated outputs are implementation evidence and direct maintainer review remains the trust boundary because the producer/schema are not target-owned until merge;')
            p = Path("ROADMAP.md")
            text = p.read_text(encoding="utf-8")
            marker = "### Current repository-integrity foundation\n\n"
            bullet = '- repository-intelligence PR 2 now provides one deterministic projection producer, a compact root-neutral Agent Context Surface, a CI/build Graph View, explicit edge class/impact role/impact direction semantics, first-order structural-control traversal, deterministic freshness/diagnostic checks, and a bounded Git tree/blob snapshot reader; trusted target-owned comparison becomes active only after this producer/schema are merged.\n'
            if marker not in text:
                raise SystemExit("ROADMAP foundation marker missing")
            if bullet not in text:
                text = text.replace(marker, marker + bullet, 1)
            p.write_text(text if text.endswith("\n") else text + "\n", encoding="utf-8")

            for old, new in {'| Deterministic logical Repository Intelligence Projection | Planned for PR 2 |': '| Deterministic logical Repository Intelligence Projection | Implemented by PR 2 bootstrap |', '| Compact connector-friendly Agent Context Surface | Planned for PR 2 |': '| Compact connector-friendly Agent Context Surface | Implemented by PR 2 bootstrap at `.ua-agent-context.json` |', '| Full Graph View materialization | Planned for PR 2 / consumed by PR 4 |': '| Full Graph View materialization | Implemented by PR 2 bootstrap as CI/build materialization; consumed by PR 4 |', '| Ephemeral proposed projection from current-target tested merge | Planned for PR 2 / consumed by PR 4 |': '| Ephemeral proposed projection from current-target tested merge | Implemented capability in PR 2; trusted activation after merge |', '| Bounded candidate snapshot reader for trusted comparison | Planned for PR 2 / activated after PR 2 merge |': '| Bounded candidate snapshot reader for trusted comparison | Implemented in PR 2; trusted activation after merge |', '| `Responsibility` derived nodes, typed edge classes, impact roles, and impact directions | Planned for PR 2 |': '| `Responsibility` derived nodes, typed edge classes, impact roles, and impact directions | Implemented by PR 2 bootstrap |', '| Endpoint-sensitive first-order structural-control traversal | Planned for PR 2 / consumed by PR 4 |': '| Endpoint-sensitive first-order structural-control traversal | Implemented by PR 2 bootstrap; consumed by PR 4 |', '| `context_for_task` / owner / preflight / validation operations | Planned for PR 2 |': '| `context_for_task` / owner / preflight / validation operations | Implemented by PR 2 bootstrap |', '| Drift/regeneration validation | Planned for PR 2 |': '| Drift/regeneration validation | Implemented by PR 2 bootstrap |'}.items():
                replace_once(".github/REPOSITORY-INTELLIGENCE.md", old, new)
          PYDOC

      - name: Run repository-intelligence bootstrap tests
        run: |
          python3 -m py_compile .github/scripts/repository_intelligence.py
          python3 .github/tests/repository_intelligence/test_repository_intelligence.py

      - name: Generate deterministic materializations
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/repository_intelligence.py build --view agent --output .ua-agent-context.json
          python3 .github/scripts/repository_intelligence.py build --view graph --output "${RUNNER_TEMP}/repository-intelligence-graph.json"
          python3 .github/scripts/repository_intelligence.py verify
          python3 .github/scripts/repository_intelligence.py stats
          wc -c .ua-agent-context.json "${RUNNER_TEMP}/repository-intelligence-graph.json"

      - name: Commit PR2 implementation and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: implement repository intelligence projection bootstrap"
          git push origin HEAD:repository-intelligence/context-surface
