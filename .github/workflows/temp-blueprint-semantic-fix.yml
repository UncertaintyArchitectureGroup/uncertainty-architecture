name: Temporary blueprint semantic fix

on:
  push:
    branches:
      - research/map-adjacent-landscape

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: research/map-adjacent-landscape
      - name: Apply semantic blueprint fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('content/research/notes/open-engineering-specification-article-blueprint.md')
          text = path.read_text()

          def repl(old, new, expected=1):
              global text
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'replacement count mismatch: expected {expected}, got {actual} for {old[:100]!r}')
              text = text.replace(old, new)

          # 1. Keep the end-to-end landscape framing broad enough to include true conceptual substitutes.
          repl(
              '7. maps the existing research, orchestration, guardrail, observability, managed-platform, governance, standards, and regulatory landscape onto that map so the reader can see what current approaches already solve, what they can implement, and which authority or lifecycle decisions remain outside their normal scope;',
              '7. maps the existing systems/safety/runtime-assurance methods, control-theoretic research, orchestration, guardrail, observability, managed-platform, governance, standards, and regulatory landscape onto that map so the reader can see what current approaches already solve, what they can implement, what UA may lose when translating them into its own vocabulary, and which authority or lifecycle decisions remain outside their normal scope;'
          )
          repl(
              '→ the ecosystem already contains many strong pieces of this control problem: orchestration runtimes, guardrails, evaluation and observability, managed AI platforms, governance suites, standards, regulation, and control-theoretic research\n→ those approaches must be mapped by controlled object, capability coverage, decision horizon, authority semantics, guarantee strength, evidence routing, reassessment, Human Authority, and economics rather than dismissed by product category',
              '→ the ecosystem already contains many strong pieces and alternative framings of this control problem: systems/safety/runtime-assurance methods, orchestration runtimes, guardrails, evaluation and observability, managed AI platforms, governance suites, standards, regulation, and control-theoretic research\n→ those approaches must be mapped by controlled object, capability coverage, decision horizon, authority semantics, guarantee strength, evidence routing, reassessment, Human Authority, and economics—and reverse-mapped to identify what UA itself loses or distorts—rather than dismissed by product category'
          )

          # 2. Make the running example distinguish a deterministic gate from substantive Human Authority.
          repl(
              '> An automated refund transaction above an illustrative threshold (for example, €50) must not reach the payment API without a valid Human Authority approval token.\n\nA credible Hard realization might require a deterministic transaction gateway that checks amount, authenticated execution identity, approval token, scope, and relevant bypass paths before the payment action is reachable.',
              '> An automated refund transaction above an illustrative threshold (for example, €50) must not reach the payment API unless a deterministic gateway verifies an approval credential issued through the designated approval path for an authenticated authorized human identity and the matching transaction scope.\n\nA credible Hard realization might therefore require a deterministic transaction gateway that checks amount, authenticated execution identity, approval credential, transaction scope, and relevant bypass paths before the payment action is reachable. **This Hard claim establishes deterministic transaction gating; it does not by itself prove that the Human Authority process is substantively effective.** Information quality, competence, capacity, latency, fallback, and real power to change the outcome remain separate Project / Runtime obligations.'
          )
          repl(
              '- NIST/ISO/regulatory sources may create or structure organizational Requirements, Constraints, evidence expectations, and management obligations.',
              '- applicable regulation or binding obligations may create authoritative Requirements; NIST/ISO and other voluntary frameworks may structure risk-management or evidence obligations and become authoritative only through explicit adoption, contractual incorporation, certification/procurement commitment, policy, or another legitimate authority decision.'
          )
          repl(
              '- [ ] The illustrative Hard refund boundary remains a **scoped complete-path claim**, not a semantic guarantee about all model behavior.',
              '- [ ] The illustrative Hard refund boundary remains a **scoped complete-path transaction-gating claim**, not a semantic guarantee about all model behavior and not proof that the Human Authority process is substantively effective.'
          )

          # 3. Treat the landscape gap as an explicit hypothesis rather than an established market fact.
          repl(
              '**Core claim:** Existing approaches cover substantial parts of the Thinking-System control problem, sometimes very well. The remaining integration burden arises primarily at the boundaries between **capability, authority, lifecycle decision ownership, guarantee strength, evidence routing, and economics**. UA is intended to provide a common map across those boundaries rather than replace the tools, standards, research, or organizational processes that already implement pieces of them.',
              '**Core hypothesis to examine:** Existing approaches cover substantial parts of the Thinking-System control problem, sometimes very well. This paper examines the hypothesis that, once those controls and implementation capabilities are acknowledged, a material part of the remaining engineering burden lies in the connections among **capability, authority, lifecycle decision ownership, guarantee strength, evidence routing, corrective action, and economics**. UA is proposed as one common map across those boundaries rather than as a replacement for the tools, standards, research, or organizational processes that already implement pieces of them. Section 5.8 must treat this integration-gap claim as falsifiable rather than established market fact.'
          )
          repl(
              '> Existing approaches solve many parts of the control problem. The unresolved engineering problem is often the connection among their scopes, not the absence of components.\n\n> A platform may implement control. A standard may create obligations. A governance process may authorize. An evaluator may observe. None of those labels alone tells us whether the complete Thinking System is bounded, viable, correctable, and reauthorizable.',
              '> Existing approaches solve many parts of the control problem. The comparison asks whether the unresolved engineering problem is often the connection among their scopes rather than the absence of controls themselves.\n\n> A platform may implement control. Applicable law or another binding source may create Requirements. An adopted standard or voluntary framework may structure obligations and become authoritative through a legitimate adoption path. A governance process may authorize. An evaluator may observe. None of those labels alone tells us whether the complete Thinking System is bounded, viable, correctable, and reauthorizable.'
          )
          repl(
              '- “the remaining gap is cross-boundary integration/authority/reassessment/economics”;',
              '- “this paper examines whether a material remaining gap lies in cross-boundary integration/authority/reassessment/economics”;'
          )

          # 4. Add reverse mapping to the comparison lens so UA is not the only language of comparison.
          repl(
              '13. **What remains outside its normal scope** — which material decision, authority relationship, evidence path, or economic question must still be supplied elsewhere?\n\nThe section must state that **coverage is not a maturity score**.',
              '13. **What remains outside its normal scope** — which material decision, authority relationship, evidence path, or economic question must still be supplied elsewhere?\n14. **Reverse mapping / UA lossiness** — what concepts, relationships, guarantees, lifecycle semantics, or control distinctions in this approach are lost, distorted, or forced into an unnatural category when translated into UA? What does the approach make explicit that UA currently does not?\n\nThe section must state that **coverage is not a maturity score**. The comparison is bidirectional: UA is allowed to expose missing connections in adjacent approaches, and adjacent approaches are allowed to expose missing or poorly partitioned concepts in UA.'
          )
          repl(
              'What does the complete control perimeter cost across the lifecycle?\n```',
              'What does the complete control perimeter cost across the lifecycle?\nWhat does this existing approach or composition make explicit that UA currently does not?\n```'
          )

          # 5. Insert systems/safety/runtime-assurance methods as a true conceptual substitution class.
          marker = '''- Do not claim UA is the first application of control theory to LLMs or AI systems.\n- Do not imply mathematical control research is “less rigorous” because it does not cover SDLC.\n- State positively that UA's proposed contribution is **not applying control theory to LLMs as such**, but using control-loop distinctions as one part of a broader software/systems-engineering operating map for Thinking Systems.\n\n#### 5.6.3 Agent and orchestration runtimes'''
          replacement = '''- Do not claim UA is the first application of control theory to LLMs or AI systems.\n- Do not imply mathematical control research is “less rigorous” because it does not cover SDLC.\n- State positively that UA's proposed contribution is **not applying control theory to LLMs as such**, but using control-loop distinctions as one part of a broader software/systems-engineering operating map for Thinking Systems.\n\n#### 5.6.3 Systems, safety, and runtime-assurance engineering methods\n\nThis category is a **required conceptual-substitution challenge**, not merely historical provenance. Use a small representative set such as STAMP/STPA, Simplex/runtime-assurance architecture, and broader systems/safety-engineering practice where current primary sources support the comparison. The purpose is not to survey all systems engineering; it is to test whether an established engineering method or composition already carries the cross-level control relationships UA claims to make explicit.\n\n**What these approaches genuinely contribute:**\n\n- socio-technical control structures, safety constraints, control actions, feedback, and unsafe-control-action reasoning in STAMP/STPA;\n- trusted safety/assurance paths, fallback, decision modules, and bounded runtime assurance around complex or untrusted components in Simplex-family architectures;\n- established hazard analysis, assurance cases, requirements allocation, verification/validation, change control, operational monitoring, and lifecycle responsibility in broader systems/safety engineering practice.\n\n**UA mapping:** potentially broad. Unlike a runtime tool, these methods can span organizational assumptions, architecture, implementation constraints, assurance evidence, runtime monitoring, fallback, and lifecycle change. Do not force them into a Delivery/Runtime-only box merely because some implementations contain runtime monitors or safety controllers.\n\n**Substitution question:** Could STPA/Simpex/runtime-assurance practice plus ordinary architecture, delivery, operations, and business-governance records already preserve the material decisions UA asks teams to make? Which UA distinctions add operational value beyond that composition, and which are merely renamed or repackaged established systems-engineering concepts?\n\n**Reverse-mapping obligation:** Explicitly identify concepts that do not translate cleanly into UA. Examples to examine rather than pre-answer include hierarchical control structures, unsafe control actions, process models, hazards/losses, assurance separation, trusted fallback architecture, formal safety invariants, and responsibility allocation. If UA's four horizons or four capability families lose useful structure from these methods, record that as evidence against the current UA partition rather than treating it as a defect in the antecedent.\n\n**Boundary relative to this paper:** Do not say systems/safety engineering “does not cover AI” or “lacks governance.” The narrower question is whether these methods, as normally applied, provide the specific Thinking-System category boundary, Model-Judgment placement language, complete realized-path Hard/Soft semantics, four decision-horizon routing, and explicit control-perimeter economics proposed here—or whether an existing composition already does so with equal or lower conceptual overhead.\n\n**Mandatory claim-safety:**\n\n- Do not demote STAMP/STPA or Simplex to historical inspiration while treating implementation tools as the only current competitors.\n- Do not claim UA is more complete merely because UA uses broader editorial categories.\n- Use Section 5.7 for intellectual continuity/provenance; use this subsection for the functional substitution test.\n- A finding that established systems/safety methods already carry most of the map is a valid result that should narrow UA's contribution claim.\n\n#### 5.6.4 Agent and orchestration runtimes'''
          repl(marker, replacement)

          # Renumber the remaining 5.6 subsections in descending order.
          for old, new in [
              ('#### 5.6.12 ', '#### 5.6.13 '),
              ('#### 5.6.11 ', '#### 5.6.12 '),
              ('#### 5.6.10 ', '#### 5.6.11 '),
              ('#### 5.6.9 ', '#### 5.6.10 '),
              ('#### 5.6.8 ', '#### 5.6.9 '),
              ('#### 5.6.7 ', '#### 5.6.8 '),
              ('#### 5.6.6 ', '#### 5.6.7 '),
              ('#### 5.6.5 ', '#### 5.6.6 '),
              ('#### 5.6.4 ', '#### 5.6.5 '),
          ]:
              if old not in text:
                  raise SystemExit(f'missing heading {old}')
              text = text.replace(old, new, 1)

          # The newly inserted systems subsection was shifted by the descending rename only if 5.6.4 onward existed; restore desired sequence explicitly.
          text = text.replace('#### 5.6.4 Agent and orchestration runtimes', '#### 5.6.4 Agent and orchestration runtimes', 1)

          # 6. Make matrix claims tendencies, not universal category properties, and add the conceptual-substitute row.
          old_matrix = '''A publication-facing table may use qualitative terms such as `primary`, `substantial`, `partial`, `implementation`, `obligation/source`, or `usually outside scope`. Avoid green/red maturity scoring.\n\nSuggested columns:\n\n| Approach family | Typical controlled object | Organization | Project / Architecture | Delivery | Runtime | Capability emphasis | Authority / reassessment / economics boundary |\n|---|---|---|---|---|---|---|---|\n| Control-theoretic research | model/state/physical process | usually outside | partial/specific | limited | strong in scoped problem | Sensors / Controllers / Actuators; formal constraints where modeled | socio-technical authorization/economics usually outside research question |\n| Agent/orchestration runtimes | workflow/agent run | usually outside | partial | strong | strong | Controller implementation / Actuators / realization hooks / Sensor hooks | legitimate authority and viability remain application/organization decisions |\n| Guardrail/enforcement tools | input/output/tool path | usually outside | partial | strong | strong | Constraint Realizations / Sensors / local Controllers / Actuators | source authority, Hard claim semantics, cross-level reassessment outside local mechanism |\n| Evaluation/observability | traces/evidence/application behavior | usually outside | partial | strong | strong | Sensors; some Controller/Actuator automation | evidence consumer, authority, escalation, and full economics supplied elsewhere |\n| Managed AI/agent platforms | application/platform estate | partial | partial | strong | strong | potentially all four implementation families | platform implements delegated control; organizational/project authority not created by platform |\n| Enterprise governance platforms | AI use case / model / organizational estate | strong | moderate-to-strong | moderate | evidence/monitoring oriented | authoritative records, Sensors, Controller workflows, some control integrations | technical realization/Actuation depth depends on integration and architecture |\n| Risk / management frameworks and standards | organization / AI management system / risk process | source/obligation when adopted or otherwise made authoritative | requirements / risk-management guidance | process and evidence expectations | monitoring / continual-improvement expectations where applicable | Requirements/Constraints, evidence, management and authority expectations | application-specific authority, realization, Actuation, and economics depend on adoption and implementation |\n| Law / regulation / binding contractual obligations | regulated or contract-bound organization and system | authoritative where applicable | mandatory Requirements / Constraints | delivery, documentation, assurance, or process obligations | monitoring / oversight / corrective obligations where applicable | authoritative Requirements, evidence, oversight, and corrective obligations | application-specific realization and control economics still require engineering decisions |'''
          new_matrix = '''A publication-facing table may use qualitative terms such as `commonly substantial`, `partial`, `implementation`, `obligation/source`, `product-dependent`, `varies by method`, or `usually outside scope`. Avoid green/red maturity scoring and avoid presenting one category-level adjective as a guaranteed property of every implementation.\n\n**Matrix epistemic rule:** Cells describe common tendencies observed in the cited representative set, not universal properties of every member of an approach family. Product/platform coverage is configuration-dependent; systems/safety-method coverage depends on the method and how it is integrated into lifecycle practice.\n\nSuggested columns:\n\n| Approach family | Typical controlled object | Organization | Project / Architecture | Delivery | Runtime | Capability emphasis | Authority / reassessment / economics boundary |\n|---|---|---|---|---|---|---|---|\n| Control-theoretic research | model/state/physical process | usually outside the scoped research question | partial/specific | limited or outside | substantial in the scoped problem | Sensors / Controllers / Actuators; formal constraints where modeled | socio-technical authorization/economics often outside the research question |\n| Systems / safety / runtime-assurance methods | socio-technical system / hazards / controlled process / assured runtime architecture | potentially substantial, method-dependent | potentially substantial | substantial where assurance/verification is integrated | substantial in runtime-assurance variants | Constraints, control structure, evidence, Controllers/Actuators, fallback; exact mapping method-dependent | may already carry broad lifecycle authority/assurance semantics; explicit UA category/economics/horizon mapping must be tested rather than presumed absent |\n| Agent/orchestration runtimes | workflow/agent run | usually outside intrinsic product scope | partial/application-defined | commonly substantial | commonly substantial | Controller implementation / Actuators / realization hooks / Sensor hooks | legitimate authority and viability remain application/organization decisions |\n| Guardrail/enforcement tools | input/output/tool path | usually outside intrinsic product scope | partial/application-defined | commonly substantial | commonly substantial | Constraint Realizations / Sensors / local Controllers / Actuators | source authority, complete Hard-claim semantics, and cross-level reassessment usually supplied elsewhere |\n| Evaluation/observability | traces/evidence/application behavior | usually outside intrinsic product scope | partial/application-defined | commonly substantial | commonly substantial | Sensors; some Controller/Actuator automation | evidence consumer, authority, escalation, and full economics usually supplied elsewhere |\n| Managed AI/agent platforms | application/platform estate | product/configuration dependent | product/configuration dependent | commonly substantial | commonly substantial | potentially all four implementation families | platform implements delegated control; organizational/project authority is not created merely by platform functionality |\n| Enterprise governance platforms | AI use case / model / organizational estate | commonly substantial but product-dependent | moderate-to-substantial depending on implementation | integration-dependent | evidence/monitoring and integration dependent | authoritative records, Sensors, Controller workflows, some control integrations | technical realization/Actuation depth depends on integration and architecture |\n| Risk / management frameworks and standards | organization / AI management system / risk process | source/obligation when adopted or otherwise made authoritative | requirements / risk-management guidance | process and evidence expectations | monitoring / continual-improvement expectations where applicable | Requirements/Constraints, evidence, management and authority expectations | application-specific authority, realization, Actuation, and economics depend on adoption and implementation |\n| Law / regulation / binding contractual obligations | regulated or contract-bound organization and system | authoritative where applicable | mandatory Requirements / Constraints | delivery, documentation, assurance, or process obligations | monitoring / oversight / corrective obligations where applicable | authoritative Requirements, evidence, oversight, and corrective obligations | application-specific realization and control economics still require engineering decisions |'''
          repl(old_matrix, new_matrix)

          # 7. Update figure approach families and keep voluntary/binding sources separate.
          repl(
              'Control-theoretic research\nAgent/orchestration runtimes\nGuardrails / runtime enforcement\nEvaluation / observability\nManaged AI / agent platforms\nEnterprise governance platforms\nStandards / management systems / regulation',
              'Control-theoretic research\nSystems / safety / runtime-assurance methods\nAgent/orchestration runtimes\nGuardrails / runtime enforcement\nEvaluation / observability\nManaged AI / agent platforms\nEnterprise governance platforms\nRisk / management frameworks and voluntary standards\nLaw / regulation / binding contractual obligations'
          )
          repl(
              '- **adjacent approaches mapped onto the UA operating map** — approach-family coverage bands across decision horizons and capability families, with “outside scope” explicitly not treated as inferiority and no product-logo scorecard;',
              '- **adjacent approaches mapped onto the UA operating map** — approach-family coverage bands across decision horizons and capability families, including systems/safety/runtime-assurance methods, with voluntary frameworks/standards visually distinct from law/regulation/binding obligations, “outside scope” explicitly not treated as inferiority, and no product-logo scorecard;'
          )

          # 8. Add reverse-mapping and systems/safety-method risks/falsification.
          repl(
              '- **Framework comparison asymmetry:** standards, laws, research papers, open-source runtimes, and commercial governance suites have different purposes. “Coverage” is not a common maturity score.',
              '- **Framework comparison asymmetry:** standards, laws, systems/safety methods, research papers, open-source runtimes, and commercial governance suites have different purposes. “Coverage” is not a common maturity score.\n- **UA-frame asymmetry:** mapping every approach into UA categories can hide useful concepts that UA does not represent well. Every substantive comparison must include reverse mapping: what UA loses, distorts, or fails to name when translating the adjacent approach.'
          )
          repl(
              '20. **Simpler composition:** Can a simpler combination of standards + existing engineering records + tooling produce the same control outcome with less conceptual overhead?',
              '20. **Simpler composition:** Can a simpler combination of standards + existing engineering records + tooling produce the same control outcome with less conceptual overhead?\n21. **Reverse mapping / conceptual loss:** Which concepts from systems engineering, safety engineering, runtime assurance, governance, or integrated platforms become less precise when translated into UA, and should UA change rather than forcing them into its current four-horizon × four-capability partition?'
          )
          repl(
              '- Is the substitution test fair to standards whose purpose is to specify outcomes/obligations rather than implementation?',
              '- Is the substitution test fair to standards whose purpose is to specify outcomes/obligations rather than implementation?\n- What does each serious conceptual substitute make explicit that UA currently does not, and where does the UA mapping lose useful structure?\n- Would an established systems/safety/runtime-assurance method plus normal architecture and operations practice satisfy the substitution test with less conceptual overhead?'
          )

          # 9. Add primary-source plan for systems/safety/runtime-assurance methods.
          source_marker = '''**Agent/orchestration runtimes**\n\n- LangGraph official documentation — durable execution, persistence, human-in-the-loop, orchestration.'''
          source_insert = '''**Systems / safety / runtime-assurance engineering methods**\n\n- Nancy G. Leveson, *Engineering a Safer World* / STAMP and current STPA primary material — use for hierarchical socio-technical control, safety constraints, unsafe control actions, feedback, and process-model concepts.\n- Software Engineering Institute, *An Architectural Description of the Simplex Architecture* and other primary runtime-assurance material where needed — use for trusted safety paths, decision modules, fallback, and assured runtime boundaries.\n- Add one current systems/safety-engineering source only if it materially demonstrates lifecycle assurance or responsibility semantics not already covered by STAMP/STPA or Simplex; do not create a generic systems-engineering literature survey.\n- Apply the same reverse-mapping rule: record what these methods contain that UA does not represent cleanly, rather than treating every mismatch as missing coverage in the antecedent.\n\n**Agent/orchestration runtimes**\n\n- LangGraph official documentation — durable execution, persistence, human-in-the-loop, orchestration.'''
          repl(source_marker, source_insert)

          # 10. Keep reader promise and acceptance criteria aligned with the revised comparison method.
          repl(
              '16. how control-theoretic research, orchestration runtimes, guardrails, evaluation/observability tools, managed AI platforms, governance suites, standards, and regulation map onto the same decision-and-capability structure;\n17. what those approaches genuinely provide, what they can replace or implement inside a UA-shaped architecture, and which decisions or authority relationships usually remain external to them;',
              '16. how systems/safety/runtime-assurance methods, control-theoretic research, orchestration runtimes, guardrails, evaluation/observability tools, managed AI platforms, governance suites, standards, and regulation map onto the same decision-and-capability structure;\n17. what those approaches genuinely provide, what they can replace or implement inside a UA-shaped architecture, which decisions or authority relationships usually remain external to them, and what UA itself loses or distorts when the mapping is reversed;'
          )
          repl(
              '- [ ] Section 6 uses one stable comparison lens across all approach families: controlled object, primary function, capability coverage, decision horizons, authority, guarantee semantics, evidence routing, reassessment, Human Authority, economics, substitution, and outside-scope responsibilities.',
              '- [ ] Section 6 uses one stable bidirectional comparison lens across all approach families: controlled object, primary function, capability coverage, decision horizons, authority, guarantee semantics, evidence routing, reassessment, Human Authority, economics, substitution, outside-scope responsibilities, and reverse mapping of what UA loses or distorts.'
          )
          repl(
              '- [ ] Section 6 treats “outside scope” as a scope boundary rather than an inferiority score and avoids vendor-maturity scoring.',
              '- [ ] Section 6 treats “outside scope” as a scope boundary rather than an inferiority score, avoids vendor-maturity scoring, and allows adjacent methods to expose missing or poorly partitioned concepts in UA itself.\n- [ ] Section 6 includes systems/safety/runtime-assurance methods as a real conceptual substitution class rather than mentioning STAMP/STPA and Simplex only as historical antecedents.\n- [ ] Section 6 frames the proposed cross-boundary integration gap as a hypothesis under comparison/falsification rather than an established market-wide fact.\n- [ ] Section 6 matrix cells are explicitly representative tendencies, not guaranteed category properties; product/platform coverage is configuration-dependent and method coverage is application-dependent.'
          )

          # 11. Tighten general claim-safety for the new bidirectional comparison.
          repl(
              '- infer market-wide absence from a small representative comparison set;',
              '- infer market-wide absence from a small representative comparison set;\n- force systems/safety/runtime-assurance concepts into UA categories without recording where the translation is lossy or where UA may need revision;\n- present the proposed landscape integration gap as established fact rather than a bounded hypothesis to be challenged by substitution and reverse mapping;'
          )

          path.write_text(text)
          PY

      - name: Remove temporary workflow and commit blueprint fix
        shell: bash
        run: |
          rm .github/workflows/temp-blueprint-semantic-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/research/notes/open-engineering-specification-article-blueprint.md .github/workflows/temp-blueprint-semantic-fix.yml
          git diff --cached --check
          git commit -m 'docs(research): strengthen landscape falsifiability'
          git push origin HEAD:research/map-adjacent-landscape
