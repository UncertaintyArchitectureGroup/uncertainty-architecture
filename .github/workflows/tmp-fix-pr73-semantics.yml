name: tmp fix pr73 semantics
on:
  push:
    branches:
      - research/tighten-section-2-horizon-foreshadowing
    paths:
      - .github/workflows/tmp-fix-pr73-semantics.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/tighten-section-2-horizon-foreshadowing
      - name: Patch manuscript and blueprint
        shell: python
        run: |
          from pathlib import Path
          mp = Path('content/research/notes/open-engineering-specification-article-draft.md')
          bp = Path('content/research/notes/open-engineering-specification-article-blueprint.md')
          m = mp.read_text()
          b = bp.read_text()

          old = 'C["Controller and decision authority"]'
          new = 'C["Controller / decision function"]'
          assert m.count(old) == 1, m.count(old)
          m = m.replace(old, new)

          old = '**Figure 7 — A closed feedback loop.** Evidence reaches a decision function and an authorized action changes the controlled process. The figure deliberately does not yet claim that the loop operates inside a legitimate or adequately realized boundary.'
          new = '**Figure 7 — A closed feedback loop.** Evidence reaches a Controller / decision function and an authorized action changes the controlled process. Decision authority comes from the applicable authorized decision boundary; the Controller operates within that boundary rather than constituting its source. The figure deliberately does not yet claim that the loop operates inside a legitimate or adequately realized boundary.'
          assert m.count(old) == 1, m.count(old)
          m = m.replace(old, new)

          old = '- **Section 5.2** — show that a fixed workflow can already be a Thinking System; then make the engineering consequence explicit: once Model Judgment participates in consequential responsibility, the control perimeter follows the whole object and may become a socio-technical architecture crossing organizational authority, Project / Architecture, Delivery, and Runtime. Show the **reach of the perimeter without introducing the canonical horizon sequence**: it may cross technical, delivery, architectural, human-authority, and organizational decision boundaries. Do not define horizon ownership, detailed responsibilities, or reassessment semantics here. Reserve the canonical four-horizon model and its names as an operating structure for Section 5.4.'
          new = '- **Section 5.2** — show that a fixed workflow can already be a Thinking System; then make the engineering consequence explicit: once Model Judgment participates in consequential responsibility, the control perimeter follows the whole object and may become a socio-technical architecture crossing technical, delivery, architectural, human-authority, and organizational decision boundaries. Show only the **reach of the perimeter**, without introducing the canonical horizon sequence, horizon ownership, detailed responsibilities, or reassessment semantics. Reserve the canonical four-horizon model and its names as an operating structure for Section 5.4.'
          assert b.count(old) == 1, b.count(old)
          b = b.replace(old, new)

          mp.write_text(m)
          bp.write_text(b)
      - name: Verify and commit
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/research/notes/open-engineering-specification-article-draft.md content/research/notes/open-engineering-specification-article-blueprint.md
          git commit -m 'docs(research): align controller and section 2 semantics'
          git push origin HEAD:research/tighten-section-2-horizon-foreshadowing
