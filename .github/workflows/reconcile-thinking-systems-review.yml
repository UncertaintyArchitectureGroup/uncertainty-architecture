name: One-shot Thinking Systems review reconciliation

on:
  push:
    branches:
      - research/reconcile-thinking-systems-review

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Restore latest long-form research head from PR 82
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/pull/82/head:refs/remotes/origin/pr-82
          git show refs/remotes/origin/pr-82:content/research/notes/open-engineering-specification-article-blueprint.md > content/research/notes/open-engineering-specification-article-blueprint.md
          git show refs/remotes/origin/pr-82:content/research/notes/open-engineering-specification-article-draft.md > content/research/notes/open-engineering-specification-article-draft.md

      - name: Reconcile external review across research surfaces
        shell: bash
        env:
          RECONCILE_PAYLOAD: 
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64, os, pathlib, zlib
          payload = zlib.decompress(base64.b64decode(os.environ["RECONCILE_PAYLOAD"]))
          pathlib.Path("/tmp/reconcile-thinking-systems-review.py").write_bytes(payload)
          PYCODE
          python3 /tmp/reconcile-thinking-systems-review.py

      - name: Validate changed Markdown locally
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_metadata.py --mode metadata
          python3 .github/scripts/validate_metadata.py --mode canonical
          python3 .github/scripts/validate_metadata.py --mode terminology
          python3 .github/scripts/validate_repository_contract.py

      - name: Remove one-shot workflow and commit result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reconcile-thinking-systems-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "research: reconcile Thinking Systems external review"
          git push origin HEAD:research/reconcile-thinking-systems-review
