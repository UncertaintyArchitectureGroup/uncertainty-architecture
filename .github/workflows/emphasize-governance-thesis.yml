name: Emphasize governance thesis

on:
  push:
    branches:
      - docs/refine-controlled-object-figures

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/refine-controlled-object-figures
          fetch-depth: 0

      - name: Emphasize existing governance thesis
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          draft_path = Path('content/research/notes/open-engineering-specification-article-draft.md')
          blueprint_path = Path('content/research/notes/open-engineering-specification-article-blueprint.md')

          draft = draft_path.read_text()
          blueprint = blueprint_path.read_text()

          old = '''For a consequential Thinking System, these are not gaps that can be delegated to a post-release governance review. If the complete control architecture is absent across organizational authority, project and architecture viability, delivery realization and release, and runtime operation and reassessment, the application is not ready for consequential production release. Governance becomes operational through that socio-technical stack; it is not a document layered over the system. The stack makes the system bounded, observable, correctable, and reauthorizable.'''

          new = '''> **Release-readiness consequence.** For a consequential Thinking System, these are not gaps that can be delegated to a post-release governance review. If the complete control architecture is absent across organizational authority, project and architecture viability, delivery realization and release, and runtime operation and reassessment, the application is not ready for consequential production release. Governance becomes operational through that socio-technical stack; it is not a document layered over the system. The stack makes the system bounded, observable, correctable, and reauthorizable.'''

          if old not in draft:
              raise SystemExit('Governance thesis paragraph not found')
          draft = draft.replace(old, new, 1)

          anchor = '''- State explicitly that these gaps are not governance debt that can be closed after release: without the complete control architecture across the four decision levels, a consequential Thinking System is not ready for consequential production release.
- State that governance becomes operational through the socio-technical stack that makes the system bounded, observable, correctable, and reauthorizable, rather than through a policy document or post-release review.'''

          replacement = '''- State explicitly that these gaps are not governance debt that can be closed after release: without the complete control architecture across the four decision levels, a consequential Thinking System is not ready for consequential production release.
- Present this release-readiness consequence as a visually distinct publication-facing callout so the reader can identify it as a central engineering thesis without repeating the argument elsewhere.
- State that governance becomes operational through the socio-technical stack that makes the system bounded, observable, correctable, and reauthorizable, rather than through a policy document or post-release review.'''

          if anchor not in blueprint:
              raise SystemExit('Blueprint governance anchor not found')
          blueprint = blueprint.replace(anchor, replacement, 1)

          acceptance = '''- [ ] The consequence of an incomplete cross-level control architecture is explicit and scoped to consequential production release of Thinking Systems.'''
          acceptance_new = '''- [ ] The consequence of an incomplete cross-level control architecture is explicit, scoped to consequential production release of Thinking Systems, and visually emphasized once as a central engineering thesis without duplicating the argument.'''
          if acceptance not in blueprint:
              raise SystemExit('Blueprint acceptance item not found')
          blueprint = blueprint.replace(acceptance, acceptance_new, 1)

          draft_path.write_text(draft)
          blueprint_path.write_text(blueprint)
          PY

          rm .github/workflows/emphasize-governance-thesis.yml

      - name: Commit article emphasis
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/research/notes/open-engineering-specification-article-draft.md \
                  content/research/notes/open-engineering-specification-article-blueprint.md \
                  .github/workflows/emphasize-governance-thesis.yml
          git commit -m "Emphasize governance release-readiness thesis"
          git push origin HEAD:docs/refine-controlled-object-figures

# retrigger
