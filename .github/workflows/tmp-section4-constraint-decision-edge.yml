name: tmp-section4-constraint-decision-edge
on:
  push:
    branches: [research/rewrite-section-4-operating-map]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rewrite-section-4-operating-map
      - name: Apply Figure 11 constraint-decision fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          draft = Path('content/research/notes/open-engineering-specification-article-draft.md')
          bp = Path('content/research/notes/open-engineering-specification-article-blueprint.md')

          d = draft.read_text()
          old = '''    OUT --> NEED --> RISK --> K --> LOOP\n    OUT -->|value hypothesis| DEC\n    LOOP --> HUMAN --> DEC\n'''
          new = '''    OUT --> NEED --> RISK --> K --> LOOP\n    OUT -->|value hypothesis| DEC\n    K -->|non-negotiable authorization boundary| DEC\n    LOOP --> HUMAN --> DEC\n'''
          assert d.count(old) == 1, d.count(old)
          d = d.replace(old, new)
          draft.write_text(d)

          b = bp.read_text()
          oldb = '- Include the complete control perimeter in project viability rather than treating evaluation, Human Authority, fallback, observability, and control friction as post-launch overhead; keep attributable value visibly connected to the final Project decision rather than only to the AI-necessity check.\n'
          newb = '- Include the complete control perimeter in project viability rather than treating evaluation, Human Authority, fallback, observability, and control friction as post-launch overhead; keep attributable value visibly connected to the final Project decision rather than only to the AI-necessity check, and keep non-negotiable Project Constraint Architecture boundaries visibly connected to that decision rather than treating them as tradeable economics.\n'
          assert b.count(oldb) == 1, b.count(oldb)
          b = b.replace(oldb, newb)
          bp.write_text(b)
          PY
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "content/research/notes/open-engineering-specification-article-blueprint.md content/research/notes/open-engineering-specification-article-draft.md "
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/research/notes/open-engineering-specification-article-draft.md content/research/notes/open-engineering-specification-article-blueprint.md
          git commit -m 'docs(research): connect project constraints to authorization decision'
          git push origin HEAD:research/rewrite-section-4-operating-map
