<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 690" width="1400" height="690" role="img" aria-labelledby="title desc">
  <title id="title">Figure 3 — The controlled-object shift for the motivating class</title>
  <desc id="desc">Side-by-side top-down comparison of Explicitly Authored Software and the motivating runtime-judgment class.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#496574"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #314852; }
      .title { font-size: 26px; font-weight: 700; fill: #17242c; }
      .panel-title { font-size: 24px; font-weight: 700; fill: #284b63; }
      .subtitle { font-size: 16px; font-weight: 600; fill: #54736d; }
      .body { font-size: 18px; font-weight: 500; }
      .body-small { font-size: 17px; font-weight: 500; }
      .note { font-size: 16px; font-weight: 600; fill: #42545f; }
      .note-small { font-size: 15.5px; font-weight: 600; fill: #42545f; }
      .judgment { font-size: 17px; font-weight: 650; fill: #7b1f1f; }
      .box { fill: #fff; stroke: #6c8795; stroke-width: 2; rx: 12; }
      .arrow { stroke: #496574; stroke-width: 2.4; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="700" y="38" text-anchor="middle" class="title">The controlled-object shift</text>

  <rect x="24" y="62" width="660" height="570" rx="18" fill="#f7f9f8" stroke="#b7c2c7" stroke-width="2"/>
  <rect x="716" y="62" width="660" height="570" rx="18" fill="#f6fafb" stroke="#9fb5bf" stroke-width="2"/>

  <text x="354" y="103" text-anchor="middle" class="panel-title">Explicitly Authored Software</text>
  <text x="1046" y="103" text-anchor="middle" class="panel-title">Motivating runtime-judgment class</text>
  <text x="354" y="132" text-anchor="middle" class="subtitle">Consequential mapping authored before release</text>
  <text x="1046" y="132" text-anchor="middle" class="subtitle">Part of the consequential mapping completed at runtime</text>

  <rect x="150" y="165" width="408" height="72" class="box"/>
  <text x="354" y="193" text-anchor="middle" class="body"><tspan x="354">Situation and</tspan><tspan x="354" dy="23">operating conditions</tspan></text>
  <line x1="354" y1="237" x2="354" y2="260" class="arrow"/>
  <rect x="150" y="260" width="408" height="94" class="box"/>
  <text x="354" y="289" text-anchor="middle" class="body"><tspan x="354">Explicitly authored</tspan><tspan x="354" dy="24">consequential responsibilities</tspan></text>
  <line x1="354" y1="354" x2="354" y2="378" class="arrow"/>
  <rect x="150" y="378" width="408" height="92" class="box"/>
  <text x="354" y="407" text-anchor="middle" class="body"><tspan x="354">Consequential output, action,</tspan><tspan x="354" dy="24">or downstream state</tspan></text>
  <text x="354" y="515" text-anchor="middle" class="note"><tspan x="354">No Consequential Runtime Responsibility depends partly</tspan><tspan x="354" dy="22">on probabilistic Model Judgment.</tspan></text>

  <rect x="835" y="150" width="422" height="60" class="box"/>
  <text x="1046" y="176" text-anchor="middle" class="body-small">Situation and operating conditions</text>
  <line x1="1046" y1="210" x2="1046" y2="227" class="arrow"/>
  <rect x="835" y="227" width="422" height="72" class="box"/>
  <text x="1046" y="253" text-anchor="middle" class="body-small"><tspan x="1046">Explicitly authored responsibilities</tspan><tspan x="1046" dy="22">before / between Judgment Nodes</tspan></text>
  <line x1="1046" y1="299" x2="1046" y2="316" class="arrow"/>
  <rect x="850" y="316" width="392" height="88" rx="12" fill="#fce8e8" stroke="#b43a3a" stroke-width="3"/>
  <text x="1046" y="342" text-anchor="middle" class="judgment"><tspan x="1046">One or more Judgment Nodes</tspan><tspan x="1046" dy="23">probabilistic Model Judgment</tspan></text>
  <line x1="1046" y1="404" x2="1046" y2="421" class="arrow"/>
  <rect x="835" y="421" width="422" height="64" class="box"/>
  <text x="1046" y="447" text-anchor="middle" class="body-small"><tspan x="1046">Explicitly authored responsibilities</tspan><tspan x="1046" dy="22">after Judgment Nodes</tspan></text>
  <line x1="1046" y1="485" x2="1046" y2="502" class="arrow"/>
  <rect x="835" y="502" width="422" height="72" class="box"/>
  <text x="1046" y="529" text-anchor="middle" class="body-small"><tspan x="1046">Consequential output, action,</tspan><tspan x="1046" dy="22">or downstream state</tspan></text>
  <text x="1046" y="604" text-anchor="middle" class="note-small"><tspan x="1046">Model Judgment leaves part of a consequential responsibility unresolved until operation;</tspan><tspan x="1046" dy="20">the surrounding system still contains explicitly authored responsibilities.</tspan></text>
</svg>
